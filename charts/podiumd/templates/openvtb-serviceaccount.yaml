{{- /*
The openvtb chart renders `automountServiceAccountToken` with `| default "true"`,
so a false value turns into true. Open VTB does not call the Kubernetes API:
this chart makes the ServiceAccount itself (openvtb.serviceAccount.create is
false) without a token mount.
*/ -}}
{{- if .Values.openvtb.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.openvtb.serviceAccount.name }}
  labels:
    {{- include "podiumd.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
