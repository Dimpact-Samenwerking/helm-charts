{{- /* Deployment-time validations. This template emits no Kubernetes resources. */ -}}

{{- /* Confidential Keycloak client secrets that come straight from values (not
     generated by keycloak-podiumd-realm-secrets.yaml). Only required when the
     realm import job runs, and only for an enabled client or component: an
     empty value is imported as the client's secret (security review 4.10.0
     SD-03), so fail with every missing path at once. */ -}}
{{- if (index .Values "keycloak-operator").enabled -}}
{{- if (index .Values "keycloak-operator").jobs.importPodiumdRealm.enabled -}}
{{- $clients := .Values.keycloak.config.clients -}}
{{- $required := list
      (list $clients.monitoring.enabled "keycloak.config.clients.monitoring.secret" $clients.monitoring.secret)
      (list $clients.datamigratie.enabled "keycloak.config.clients.datamigratie.secret" $clients.datamigratie.secret)
      (list (and .Values.zaakbrug.enabled (ne (toString $clients.zaakbrug.enabled) "false")) "keycloak.config.clients.zaakbrug.secret" $clients.zaakbrug.secret)
      (list .Values.kiss.enabled "kiss.settings.oidc.clientSecret" .Values.kiss.settings.oidc.clientSecret)
      (list .Values.zac.enabled "zac.auth.secret" .Values.zac.auth.secret)
      (list .Values.ita.enabled "ita.web.oidc.clientSecret" .Values.ita.web.oidc.clientSecret)
      (list .Values.pabc.enabled "pabc.settings.oidc.clientSecret" .Values.pabc.settings.oidc.clientSecret)
      (list .Values.pabc.enabled "pabc.settings.keycloakAdmin.clientSecret" .Values.pabc.settings.keycloakAdmin.clientSecret) -}}
{{- $missing := list -}}
{{- range $r := $required -}}
{{- if and (index $r 0) (not (trim (toString (index $r 2 | default "")))) -}}
{{- $missing = append $missing (index $r 1) -}}
{{- end -}}
{{- end -}}
{{- if $missing -}}
{{- fail (printf "Keycloak client secrets must be set to non-empty values for every enabled client (they are imported into the realm as-is):\n  %s" (join "\n  " $missing)) -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- /* Keycloak 26.8 (CVE-2026-12388, IN-3203) refuses an identity provider
     mapper that grants an admin role unless the identity provider has
     config.allowAdminRoleMapping "true": the master realm import then fails
     with 403 on every run. The chart leaves enabling it to the environment,
     so the escalation path the CVE closes stays closed unless chosen.
     Detects only roles that are admin by name (master realm admin and
     create-realm, client roles of realm-management and <realm>-realm), not
     composites, and only identity providers defined in these values. */ -}}
{{- if and (index .Values "keycloak-operator").enabled (index .Values "keycloak-operator").jobs.importMasterRealm.enabled -}}
{{- $idps := dict -}}
{{- range $idp := (.Values.keycloak.config.adminIdentityProviders | default dict).identityProviders -}}
{{- $_ := set $idps $idp.alias (eq (toString (($idp.config | default dict).allowAdminRoleMapping)) "true") -}}
{{- end -}}
{{- $blocked := list -}}
{{- range $m := (.Values.keycloak.config.adminIdentityProviderMappers | default dict).identityProviderMappers -}}
{{- $role := toString (($m.config | default dict).role) -}}
{{- $client := ternary (first (splitList "." $role)) "" (contains "." $role) -}}
{{- $adminRole := or (has $role (list "admin" "create-realm")) (eq $client "realm-management") (hasSuffix "-realm" $client) -}}
{{- if and (eq (toString $m.identityProviderMapper) "oidc-hardcoded-role-idp-mapper") $adminRole (hasKey $idps (toString $m.identityProviderAlias)) (not (get $idps (toString $m.identityProviderAlias))) -}}
{{- $blocked = append $blocked (printf "mapper %q grants %q through identity provider %q" $m.name $role $m.identityProviderAlias) -}}
{{- end -}}
{{- end -}}
{{- if $blocked -}}
{{- fail (printf "Keycloak 26.8 refuses identity provider mappers that grant admin roles (CVE-2026-12388). Set config.allowAdminRoleMapping: \"true\" on the identity provider in keycloak.config.adminIdentityProviders.identityProviders, or remove the mapper:\n  %s" (join "\n  " $blocked)) -}}
{{- end -}}
{{- end -}}

{{- /* ITA 3.2.0 requires the Medewerker-objecttype: ita.medewerker.type must be set
     (gemeente-specific objecttype URL) whenever ITA is enabled. */ -}}
{{- if .Values.ita.enabled -}}
{{- $medewerker := index .Values.ita "medewerker" | default dict -}}
{{- if not (index $medewerker "type") -}}
{{- fail "ita.medewerker.type must be set to the environment-specific Medewerker objecttype URL when ita.enabled is true (ITA 3.2.0)" -}}
{{- end -}}
{{- end -}}

{{- /* Open Inwoner's admin OIDC needs the providers schema (mozilla-django-oidc-db 2.x,
     since Open Inwoner 2.4.0). An item without oidc_provider_identifier, or with
     the old flat fields, fails setup-configuration; since openinwoner chart 2.6.0
     that is a post-upgrade hook, so it would fail the whole helm upgrade. */ -}}
{{- $oip := .Values.openinwoner | default dict -}}
{{- $oipConfig := $oip.configuration | default dict -}}
{{- if and (or $oip.enabled (not (hasKey $oip "enabled"))) $oipConfig.enabled $oipConfig.data -}}
{{- $oipData := $oipConfig.data | fromYaml -}}
{{- $adminAuth := index $oipData "oidc_db_config_admin_auth" | default dict -}}
{{- $providerIds := list -}}
{{- range $p := $adminAuth.providers | default list -}}
{{- $providerIds = append $providerIds $p.identifier -}}
{{- end -}}
{{- range $item := $adminAuth.items | default list -}}
{{- $flat := list -}}
{{- range $k := list "endpoint_config" "claim_mapping" "username_claim" "groups_claim" "sync_groups" "sync_groups_glob_pattern" "make_users_staff" "superuser_group_names" "default_groups" "oidc_token_use_basic_auth" "oidc_use_nonce" "oidc_nonce_size" "oidc_state_size" -}}
{{- if hasKey $item $k -}}{{- $flat = append $flat $k -}}{{- end -}}
{{- end -}}
{{- if or $flat (not (has $item.oidc_provider_identifier $providerIds)) -}}
{{- fail (printf "openinwoner.configuration.data: oidc_db_config_admin_auth item %q must use the providers schema: a providers entry named in oidc_provider_identifier%s. Migrate the values with scripts/migrate-openinwoner-admin-oidc.py; see docs/_UPGRADE_PATHS/4.9.5-to-4.10.0-values-deltas.md, \"Admin OIDC login: the providers schema\"" ($item.identifier | toString) (ternary (printf ", and no old flat fields (found: %s)" (join ", " $flat)) "" (gt (len $flat) 0))) -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- /* PABC 2.1.0 zaaktype import: with any of these empty PABC starts fine and
     only fails when someone presses the import button. */ -}}
{{- if .Values.pabc.enabled -}}
{{- $zgw := .Values.pabc.settings.zgwZaakregister | default dict -}}
{{- if $zgw.enabled -}}
{{- range $field := list "catalogiBaseUrl" "clientId" "clientSecret" "catalogusDomein" -}}
{{- if not (index $zgw $field) -}}
{{- fail (printf "pabc.settings.zgwZaakregister.%s must be set when pabc.settings.zgwZaakregister.enabled is true" $field) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- /* Frank!Gateway: `gateway` was the reserved single-instance key before the
     traffic-class split became the only shape. It no longer resolves to
     anything — the bare `frankgateway` object names and the `/apisix` etcd
     prefix are gone — so a values file still setting it would quietly render a
     fourth instance named `frankgateway-gateway` on prefix `/frankgateway-gateway`,
     seeding no routes and serving nothing. Fail instead. */ -}}
{{- /* Frank!Gateway reads every external-API credential from OpenBao at request
     time (files/frankgateway/openbao-secret-header.lua). There is no env-var
     fallback any more, so a gateway without OpenBao cannot authenticate to
     BAG, KVK or any other upstream that needs a key — and it would fail at
     request time, per call, rather than at deploy time. Couple them here. */ -}}
{{- /* OpenBao metrics: the metrics-only listener on 9101 is scraped through the
     "metrics" port, which the environment declares with the flag (see
     values-enable-observability.yaml). Without it the ServiceMonitor and the
     PodMonitor point at a port that does not exist. */ -}}
{{- $bao := .Values.openbao | default dict -}}
{{- $baoMetrics := or (dig "global" "serverTelemetry" "prometheusOperator" false $bao) (dig "serverTelemetry" "prometheusOperator" false (.Values.global | default dict)) (dig "serverTelemetry" "serviceMonitor" "enabled" false $bao) -}}
{{- if and $bao.enabled $baoMetrics -}}
{{- $ports := concat (dig "server" "extraPorts" list $bao) (dig "server" "service" "extraPorts" list $bao) -}}
{{- $named := 0 -}}
{{- range $ports }}{{- if eq (toString .name) "metrics" }}{{- $named = add1 $named }}{{- end }}{{- end -}}
{{- if lt $named 2 -}}
{{- fail "openbao metrics are on (openbao.serverTelemetry.serviceMonitor.enabled, or global.serverTelemetry.prometheusOperator in openbao or at the top level), but the \"metrics\" port (9101) is missing: set openbao.server.extraPorts and openbao.server.service.extraPorts as in values-enable-observability.yaml." -}}
{{- end -}}
{{- end -}}
{{- if and .Values.frankgateway.enabled (not .Values.openbao.enabled) -}}
{{- fail "frankgateway requires openbao: external-API keys are fetched from OpenBao at request time and there is no other key path. Set openbao.enabled=true, or frankgateway.enabled=false." -}}
{{- end -}}

{{- /* OpenBao static seal: the server only accepts a 32-byte AES key, given as 32
     raw characters, 64 hex, 44 standard base64 or 43 unpadded URL-safe base64.
     Anything else (e.g. an unsubstituted REP_…_REP placeholder) would render
     fine and then leave every OpenBao pod crash-looping on start, so fail the
     render instead. The seal config is only loaded through server.extraArgs;
     an override that drops it would silently fall back to Shamir. */ -}}
{{- if .Values.openbao.enabled -}}
{{- $seal := .Values.openbao.seal.static -}}
{{- range $field := list "key" "previousKey" -}}
{{- $k := index $seal $field | default "" | toString -}}
{{- if $k -}}
{{- if not (or (eq (len $k) 32) (regexMatch "^[0-9a-fA-F]{64}$" $k) (regexMatch "^[A-Za-z0-9+/]{43}=$" $k) (regexMatch "^[A-Za-z0-9_-]{43}$" $k)) -}}
{{- fail (printf "openbao.seal.static.%s must be a 32-byte AES key: 32 raw characters, 64 hex, 44 standard base64 or 43 unpadded URL-safe base64 (got %d characters)" $field (len $k)) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if and $seal.previousKey (not $seal.previousKeyId) -}}
{{- fail "openbao.seal.static.previousKeyId must be set when openbao.seal.static.previousKey is set" -}}
{{- end -}}
{{- if and $seal.previousKey (eq (toString $seal.previousKeyId) (toString $seal.keyId)) -}}
{{- fail "openbao.seal.static.previousKeyId must differ from keyId: each key needs its own permanent identifier" -}}
{{- end -}}
{{- if and $seal.key (not (contains "-config=/openbao/seal" (toString .Values.openbao.server.extraArgs))) -}}
{{- fail "openbao.seal.static.key is set but openbao.server.extraArgs no longer loads -config=/openbao/seal, so the static seal would be ignored. Keep that argument (and the openbao-seal volumes) in any override." -}}
{{- end -}}
{{- end -}}

{{- if .Values.frankgateway.enabled -}}
{{- if hasKey .Values.frankgateway.instances "gateway" -}}
{{- fail "frankgateway.instances.gateway no longer exists: the traffic-class split (inway/outway/internal) is the only supported shape. Move the overrides under the class they belong to and remove the `gateway` key. See charts/podiumd/docs/apps/frankgateway/frankgateway-traffic-classes.md" -}}
{{- end -}}
{{- if .Values.frankgateway.serviceAlias -}}
{{- fail "frankgateway.serviceAlias no longer exists: the migration alias Service has been removed. Address instances by name (frankgateway-inway / frankgateway-outway / frankgateway-internal)." -}}
{{- end -}}
{{- /* Routes, consumers and client certificates are PER INSTANCE. The shared
     frankgateway block deep-merges into every class, so a map placed there
     would seed the same routes into inway, outway and internal alike. The
     chart also ships no route any more: an environment's values are the
     complete list, so there is nothing for a shared key to add to. */ -}}
{{- range $k := list "routes" "consumers" "clientCertificates" -}}
{{- if hasKey $.Values.frankgateway $k -}}
{{- fail (printf "frankgateway.%s is not a shared key: it would merge into every traffic class. Define it per instance, under frankgateway.instances.<class>.%s. (The former routes.seed / routes.job settings moved to frankgateway.seed.enabled / seed.job, and the chart ships no route files any more — see docs/apps/frankgateway/frankgateway-routes.md.)" $k $k) -}}
{{- end -}}
{{- end -}}
{{- /* The env-var key path (4.9.0 frankgateway.apiKeys -> envFrom -> os.getenv
     in the route) is gone, not deprecated: keys are read from OpenBao at
     request time (files/frankgateway/openbao-secret-header.lua). A leftover
     apiKeys block would otherwise render clean and be ignored, while reading
     in the values file as though it were still the live key path. */ -}}
{{- if hasKey .Values.frankgateway "apiKeys" -}}
{{- fail "frankgateway.apiKeys no longer exists: external-API keys are read from OpenBao at request time by the route's serverless function, not from env vars. Put the values in OpenBao under <frankgateway.openbao.mount>/frankgateway (bag_api_key, kvk_api_key), point the routes at them (docs/apps/frankgateway/frankgateway-routes.md), remove this key, and delete the frankgateway-api-keys Secret and its Key Vault entries once the routes are confirmed working." -}}
{{- end -}}
{{- /* A cert-manager Certificate without an issuer is rejected by the API
     server with a message about the CRD, not about this chart. Say it here.

     The ingressNamespace check below is the same idea applied to a policy: an
     empty or wrong value produces a NetworkPolicy that compiles, deploys and
     silently drops every inbound request, with no log line on either side. */ -}}
{{- range $key, $override := .Values.frankgateway.instances -}}
{{- $fg := include "podiumd.frankgateway.instanceValues" (dict "root" $ "key" $key "override" $override) | fromYaml -}}
{{- $class := include "podiumd.frankgateway.class" (dict "key" $key "instance" $fg) -}}
{{- if and $fg.enabled (not $class) $.Values.frankgateway.networkPolicies.enabled -}}
{{- fail (printf "frankgateway.instances.%s has no traffic class, so no NetworkPolicy can be written for it, yet frankgateway.networkPolicies.enabled is true. Silently leaving one instance unrestricted while every other is locked down is worse than refusing to render. Set `class` on it to one of inway/outway/internal, or name the instance after its class." $key) -}}
{{- end -}}
{{- if and $fg.enabled (eq $class "inway") $.Values.frankgateway.networkPolicies.enabled (not $.Values.frankgateway.networkPolicies.ingressNamespace) -}}
{{- fail (printf "frankgateway.networkPolicies.ingressNamespace must be set when the %s instance runs with networkPolicies enabled. It is the namespace of the pod that OPENS connections to the inway — for NGINX Gateway Fabric 2.x that is the per-Gateway DATA plane pod, which runs in the Gateway's own namespace (e.g. ingress-basic), NOT the nginx-gateway namespace where the control plane runs. Find it with: kubectl get pods -A | grep gateway-nginx" $key) -}}
{{- end -}}
{{- if and $fg.enabled $fg.tls.enabled $fg.tls.certManager.enabled (not $fg.tls.certManager.issuerRef.name) (not $fg.tls.certManager.issuer.create) -}}
{{- fail (printf "frankgateway.instances.%s: tls.certManager.enabled needs an issuer — either name one in tls.certManager.issuerRef.name, or set tls.certManager.issuer.create=true to have the chart render an OpenBao-backed Issuer (see frankgateway-BASICS.md for the OpenBao-side setup)" $key) -}}
{{- end -}}
{{- /* Route ids become APISIX route ids AND ConfigMap keys, so both charsets
     apply; a body whose own `id` disagrees with the key would be PUT under the
     key and rejected by APISIX with a message about the body, not the values. */ -}}
{{- $certs := $fg.clientCertificates | default dict -}}
{{- if not (kindIs "map" $certs) -}}
{{- fail (printf "frankgateway.instances.%s.clientCertificates must be a map of name -> { openbaoPath: <path within the mount> }" $key) -}}
{{- end -}}
{{- range $n, $c := $certs -}}
{{- if not (regexMatch "^[a-zA-Z0-9._-]+$" $n) -}}
{{- fail (printf "frankgateway.instances.%s.clientCertificates: name %q must match ^[a-zA-Z0-9._-]+$ — it becomes the SSL object id client-%s" $key $n $n) -}}
{{- end -}}
{{- if or (not (kindIs "map" $c)) (not $c.openbaoPath) -}}
{{- fail (printf "frankgateway.instances.%s.clientCertificates.%s.openbaoPath is required: the path within the OpenBao mount holding fields `cert` and `key`, e.g. frankgateway/client-certs/%s" $key $n $n) -}}
{{- end -}}
{{- end -}}
{{- $routes := $fg.routes | default dict -}}
{{- if not (kindIs "map" $routes) -}}
{{- fail (printf "frankgateway.instances.%s.routes must be a map of route id -> APISIX route body (see docs/apps/frankgateway/frankgateway-routes.md)" $key) -}}
{{- end -}}
{{- range $id, $route := $routes -}}
{{- if has $id (list "extra" "seed" "job" "dirs") -}}
{{- fail (printf "frankgateway.instances.%s.routes.%s: `%s` is not a route id. routes.extra / routes.seed / routes.job / routes.dirs no longer exist — `routes` is now the map of routes itself, and the hook Job settings live under frankgateway.seed. See docs/apps/frankgateway/frankgateway-routes.md" $key $id $id) -}}
{{- end -}}
{{- if not (regexMatch "^[a-zA-Z0-9._-]+$" $id) -}}
{{- fail (printf "frankgateway.instances.%s.routes: route id %q must match ^[a-zA-Z0-9._-]+$ — it becomes the APISIX route id and a ConfigMap key" $key $id) -}}
{{- end -}}
{{- if not (kindIs "map" $route) -}}
{{- fail (printf "frankgateway.instances.%s.routes.%s must be an APISIX route body (a map)" $key $id) -}}
{{- end -}}
{{- if and (hasKey $route "id") (ne (toString $route.id) $id) -}}
{{- fail (printf "frankgateway.instances.%s.routes.%s: the body's `id` (%v) differs from the key it is filed under; drop it or make them equal" $key $id $route.id) -}}
{{- end -}}
{{- /* A client_cert_id APISIX cannot find is rejected at seed time, per
     route, with a message about the SSL object; a typo is cheaper here. */ -}}
{{- $ccid := dig "upstream" "tls" "client_cert_id" "" $route -}}
{{- if and $ccid (not (and (hasPrefix "client-" $ccid) (hasKey $certs (trimPrefix "client-" $ccid)))) -}}
{{- fail (printf "frankgateway.instances.%s.routes.%s: upstream.tls.client_cert_id %q names no client certificate of this instance. Declare it under frankgateway.instances.%s.clientCertificates.<name> (the SSL object id is then client-<name>)" $key $id $ccid $key) -}}
{{- end -}}
{{- /* The consumer-auth function trusts a header. That is only sound on the
     inway, behind the front door that sets it; anywhere else the header is
     whatever the caller says it is. */ -}}
{{- if and (contains "openbao-consumer-auth" (toJson $route)) (ne $class "inway") -}}
{{- fail (printf "frankgateway.instances.%s.routes.%s uses openbao-consumer-auth, which trusts the client-certificate identity header set by the front door. Only an inway-class instance sits behind that front door; on %s the header would be caller-controlled. See docs/apps/frankgateway/frankgateway-routes.md" $key $id $key) -}}
{{- end -}}
{{- /* Even on the inway the header is only trustworthy when nothing but the
     front door can reach the pod (security review 4.10.0 NW-06). */ -}}
{{- if and $fg.enabled (contains "openbao-consumer-auth" (toJson $route)) (eq $class "inway") (not $.Values.frankgateway.networkPolicies.enabled) -}}
{{- fail (printf "frankgateway.instances.%s.routes.%s uses openbao-consumer-auth, but frankgateway.networkPolicies.enabled is false: any pod in the cluster could then reach the inway and forge the client-certificate headers. Enable frankgateway.networkPolicies (on a cluster that enforces NetworkPolicy)." $key $id) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- /* OIDC client secrets are auto-generated by keycloak-podiumd-realm-secrets.yaml when
     neither configuration.secrets.keycloak_client_secret nor configuration.oidcSecret is set,
     so all Keycloak clients are provisioned regardless of whether the component is enabled. */ -}}

{{- /* Known placeholder credentials: a value that is exactly "changeme",
     "dummy", "openklanttoken", "objectentoken", "<token>" or "<kiss>" (any
     case, surrounding whitespace ignored), or a value that still contains an
     unreplaced REP_..._REP marker (also inside a URL), is a default nobody
     replaced. Such a value renders and deploys fine and then either fails at
     request time or, worse, works: zac.keycloak.adminClient.secret becomes the
     Keycloak secret of a client that can list every realm user. Scan all
     values and fail with every offending path at once. A section with
     `enabled: false`, at any depth (a whole component or a part such as
     zac.office_converter), is skipped: its placeholders are never used.
     The Keycloak clients that keycloak-podiumd-realm-config always imports
     (kiss, zac, zac-admin, ita, pabc) are no exception: for a disabled
     component, keycloak-podiumd-realm-secrets replaces an empty or
     placeholder secret with a generated one. */ -}}
{{- define "podiumd.validation.isPlaceholder" -}}
{{- $placeholders := list "changeme" "dummy" "openklanttoken" "objectentoken" "<token>" "<kiss>" -}}
{{- if and (kindIs "string" .) (or (has (lower (trim .)) $placeholders) (regexMatch "REP_[A-Z0-9_]+_REP" .)) -}}true{{- end -}}
{{- end -}}

{{- define "podiumd.validation.placeholderPaths" -}}
{{- if kindIs "map" .node -}}
{{- if not (and (hasKey .node "enabled") (eq (toString .node.enabled) "false")) -}}
{{- range $k, $v := .node -}}
{{- include "podiumd.validation.placeholderPaths" (dict "node" $v "path" (ternary $k (printf "%s.%s" $.path $k) (eq $.path ""))) -}}
{{- end -}}
{{- end -}}
{{- else if kindIs "slice" .node -}}
{{- range $i, $v := .node -}}
{{- include "podiumd.validation.placeholderPaths" (dict "node" $v "path" (printf "%s[%d]" $.path $i)) -}}
{{- end -}}
{{- else if include "podiumd.validation.isPlaceholder" .node -}}
{{- printf "%s\n" .path -}}
{{- end -}}
{{- end -}}

{{- $placeholderPaths := include "podiumd.validation.placeholderPaths" (dict "node" .Values "path" "") | splitList "\n" | compact -}}
{{- if $placeholderPaths -}}
{{- fail (printf "placeholder credentials (\"changeme\", \"dummy\", \"openklanttoken\", \"objectentoken\", \"<token>\", \"<kiss>\" or an unreplaced REP_..._REP marker) must be replaced with real values before deploying:\n  %s" (join "\n  " (sortAlpha $placeholderPaths))) -}}
{{- end -}}

{{- /* The redis-operator builds the redis-ha PodDisruptionBudget's selector from the CR
     name (app: redis-ha), but the pods get app: <serviceName>. With another serviceName
     the PDB selects no pods, so a drain can evict every Redis pod at once. */ -}}
{{- $redisHaCheck := default (dict) (index (index .Values "redis-operator" | default dict) "redis-ha") -}}
{{- if and $redisHaCheck.enabled ($redisHaCheck.pdb | default dict).enabled $redisHaCheck.serviceName (ne (toString $redisHaCheck.serviceName) "redis-ha") -}}
{{- fail (printf "redis-operator.redis-ha.pdb.enabled needs redis-operator.redis-ha.serviceName \"redis-ha\" (or empty): the redis-operator selects the PodDisruptionBudget's pods with app: redis-ha, the CR name, so with serviceName %q it would protect no pod" (toString $redisHaCheck.serviceName)) -}}
{{- end -}}
{{- /* The master-only readiness check makes a stale master label permanent unless the
     label-master CronJob removes it (the operator skips a NotReady pod). */ -}}
{{- if and $redisHaCheck.enabled ($redisHaCheck.masterReadinessCheck | default dict).enabled (not ($redisHaCheck.labelMasterCronJob | default dict).enabled) -}}
{{- fail "redis-operator.redis-ha.masterReadinessCheck.enabled needs redis-operator.redis-ha.labelMasterCronJob.enabled: an old master that comes back as a replica keeps its redis-role=master label and stays NotReady, and only the label-master CronJob removes that label. Turn the CronJob on, or turn masterReadinessCheck off." -}}
{{- end -}}
