{{- if .Values.frankgateway.enabled }}
{{- /*
  apisix-dashboard for Frank!Gateway, one chain per enabled instance.

  The conf Secret and the shim nginx.conf Secret are rendered from THIS single
  template because both embed the dashboard-internal admin password (the conf
  declares the user, the shim's server-side auto-login posts it): computing the
  password once and reusing the variable guarantees they can never diverge
  within a render.

  The dashboard's own login (admin + this password) never reaches a browser:
  the only external path is oauth2-proxy (Keycloak SSO) -> shim -> dashboard,
  and the shim injects the dashboard JWT server-side.

  apisix-dashboard binds exactly ONE etcd prefix, so a split deployment needs
  one dashboard per instance — that is why this whole chain multiplies rather
  than being shared. The prefix is only written when it differs from the
  dashboard's own `/apisix` default, so the single-instance render is unchanged.
*/ -}}
{{- $root := . }}
{{- range $key, $override := .Values.frankgateway.instances }}
{{- $fg := include "podiumd.frankgateway.instanceValues" (dict "root" $root "key" $key "override" $override) | fromYaml }}
{{- if and $fg.enabled $fg.dashboard.enabled }}
{{- $dash := $fg.dashboard }}
{{- $name := include "podiumd.frankgateway.instanceName" (dict "key" $key "instance" $fg) }}
{{- $prefix := include "podiumd.frankgateway.etcdPrefix" (dict "key" $key "instance" $fg) }}
{{- $creds := include "podiumd.frankgateway.dashboardCreds" (dict "root" $root "instance" $fg "name" $name) | fromYaml }}
{{- $adminPassword := $creds.adminPassword }}
{{- $jwtSecret := $creds.jwtSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-dashboard-conf
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "podiumd.labels" $root | nindent 4 }}
    app.kubernetes.io/component: frankgateway-dashboard
type: Opaque
stringData:
  # Extra keys exist so lookup can keep the generated values stable across
  # upgrades without parsing conf.yaml.
  admin-password: {{ $adminPassword | quote }}
  jwt-secret: {{ $jwtSecret | quote }}
  conf.yaml: |
    conf:
      listen:
        host: 0.0.0.0
        port: 9000
      allow_list:
        - 0.0.0.0/0
      etcd:
        endpoints:
          - "http://frankgateway-etcd:2379"
        # This instance's slice of the shared etcd. Always set explicitly —
        # apisix-dashboard's own default is `/apisix`, which no instance uses.
        prefix: {{ $prefix | quote }}
        mtls:
          key_file: ""
          cert_file: ""
          ca_file: ""
      log:
        error_log:
          level: warn
          file_path: logs/error.log
        access_log:
          file_path: logs/access.log
      security:
        content_security_policy: "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; frame-src *"

    authentication:
      secret: {{ $jwtSecret | quote }}
      expire_time: 3600
      users:
        - username: admin
          password: {{ $adminPassword | quote }}

    plugins:
      - api-breaker
      - authz-keycloak
      - basic-auth
      - batch-requests
      - consumer-restriction
      - cors
      - echo
      - fault-injection
      - grpc-transcode
      - hmac-auth
      - http-logger
      - ip-restriction
      - jwt-auth
      - kafka-logger
      - key-auth
      - limit-conn
      - limit-count
      - limit-req
      - openid-connect
      - prometheus
      - proxy-cache
      - proxy-mirror
      - proxy-rewrite
      - redirect
      - referer-restriction
      - request-id
      - request-validation
      - response-rewrite
      - serverless-post-function
      - serverless-pre-function
      - sls-logger
      - syslog
      - tcp-logger
      - udp-logger
      - uri-blocker
      - wolf-rbac
      - zipkin
      - server-info
      - traffic-split
      - fsc
{{- if $dash.auth.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-shim
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "podiumd.labels" $root | nindent 4 }}
    app.kubernetes.io/component: frankgateway-shim
type: Opaque
stringData:
  nginx.conf: |
{{ regexReplaceAll "(?m)[ \t]+$" (include "podiumd.frankgateway.shimConf" (dict "root" $root "instance" $fg "name" $name "adminPassword" $adminPassword) | indent 4) "" }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-dashboard
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "podiumd.labels" $root | nindent 4 }}
    app.kubernetes.io/component: frankgateway-dashboard
    app.kubernetes.io/name: {{ $name }}-dashboard
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}-dashboard
  ports:
    - name: http
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-dashboard
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "podiumd.labels" $root | nindent 4 }}
    app.kubernetes.io/component: frankgateway-dashboard
    app.kubernetes.io/name: {{ $name }}-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}-dashboard
  template:
    metadata:
      labels:
        {{- include "podiumd.labels" $root | nindent 8 }}
        app.kubernetes.io/component: frankgateway-dashboard
        app.kubernetes.io/name: {{ $name }}-dashboard
    spec:
      containers:
        - name: dashboard
          image: "{{ $dash.image.repository }}:{{ $dash.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9000
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            {{- toYaml $dash.resources | nindent 12 }}
          volumeMounts:
            - name: conf
              mountPath: /usr/local/apisix-dashboard/conf/conf.yaml
              subPath: conf.yaml
      volumes:
        - name: conf
          secret:
            secretName: {{ $name }}-dashboard-conf
{{- end }}
{{- end }}
{{- end }}
