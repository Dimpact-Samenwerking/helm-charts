{{- /*
  Post-deploy configuration Job for OpenBao (mirrors the keycloak-config-cli
  pattern). Runs the `bao` CLI to make the vault usable for Keycloak-federated
  uploaders, idempotently:

    1. enable the kv-v2 secrets engine at configuration.kvPath
    2. write the `uploader` policy (create/update/read on <kvPath>/data/*)
    3. enable + configure the `oidc` auth method against the Keycloak realm
    4. create the `uploader` OIDC role (groups_claim -> external group mapping)
    5. bind the Keycloak `uploadersGroup` to the policy via an external identity
       group + group-alias

  Bootstrap auth: after the one-time `bao operator init` + unseal, mint a
  SCOPED periodic token with scripts/openbao-mint-config-token.sh — it writes
  the podiumd-config-job policy (only the paths this Job touches), seeds the
  token into Secret/<bootstrapTokenSecret> (key `token`), and lets you revoke
  the root token. This Job reads that Secret as BAO_TOKEN: a missing Secret
  skips cleanly (openbao not bootstrapped yet), a present-but-invalid token
  (revoked/expired) fails loudly. The Job renews the periodic token on every
  run so it stays valid between deploys.

  Runs as a post-install/post-upgrade hook so the server StatefulSet (a normal
  resource) is already created; the Job waits for the active node to be unsealed.
*/}}
{{- if and .Values.openbao.enabled .Values.openbao.configuration.enabled }}
{{- $cfg := .Values.openbao.configuration }}
{{- $job := $cfg.job }}
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-config
  labels:
    {{- include "podiumd.labels" . | nindent 4 }}
    app.kubernetes.io/component: openbao
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    # No hook-succeeded: the Job exits 0 both when config was applied and when
    # it skipped (no bootstrap token / still sealed), so the logs must stay
    # readable after success. ttlSecondsAfterFinished garbage-collects the Job
    # instead; before-hook-creation still replaces it on the next deploy.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ $job.backoffLimit }}
  ttlSecondsAfterFinished: {{ $job.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "podiumd.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: openbao-config
    spec:
      restartPolicy: {{ $job.restartPolicy }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: config
          image: {{ include "podiumd.image" $job.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: BAO_ADDR
              value: "http://{{ .Release.Name }}-openbao-active:8200"
            - name: BAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $cfg.bootstrapTokenSecret | quote }}
                  key: token
                  # optional: on first deploy openbao is not yet initialised, so the
                  # bootstrap-token Secret does not exist. Optional lets the pod start
                  # and skip gracefully (below) instead of CreateContainerConfigError.
                  optional: true
            - name: KC_SECRET_OPENBAO
              valueFrom:
                secretKeyRef:
                  name: keycloak-podiumd-realm-secrets
                  key: openbao-oidc-secret
            - name: OIDC_DISCOVERY_URL
              value: "{{ $cfg.keycloak.url | trimSuffix "/" }}/realms/{{ $cfg.keycloak.realm }}"
            - name: OIDC_URL
              value: {{ $cfg.oidcUrl | trimSuffix "/" | quote }}
            - name: KV_PATH
              value: {{ $cfg.kvPath | quote }}
            - name: UPLOADERS_GROUP
              value: {{ $cfg.uploadersGroup | quote }}
          command:
            - /bin/sh
            - -ec
            - |
              # This Job needs an initialised + UNSEALED openbao (Shamir seal;
              # one-time manual `bao operator init`) and the scoped config token
              # minted by scripts/openbao-mint-config-token.sh. On a deploy where
              # that has not happened yet, skip cleanly (exit 0) so the post-install
              # hook never blocks the release — re-run the deploy (or this Job)
              # after the bootstrap to apply the config.
              if [ -z "${BAO_TOKEN:-}" ]; then
                echo "No bootstrap token yet (openbao not initialised) — skipping config; reconcile after init+unseal."
                exit 0
              fi
              echo "Waiting briefly for OpenBao to be unsealed..."
              i=0
              until bao status >/dev/null 2>&1; do
                i=$((i + 1))
                if [ "${i}" -ge 24 ]; then
                  echo "OpenBao still sealed/uninitialised after ~120s — skipping config; reconcile after unseal."
                  exit 0
                fi
                sleep 5
              done
              echo "OpenBao ready."

              # A MISSING token means "not bootstrapped yet" and skips above; a
              # PRESENT but revoked/expired token must fail loudly, not half-run.
              if ! bao token lookup >/dev/null 2>&1; then
                echo "ERROR: BAO_TOKEN from Secret/{{ $cfg.bootstrapTokenSecret }} is invalid (revoked or expired)."
                echo "Re-mint the scoped config token: scripts/openbao-mint-config-token.sh (component doc, section 5)."
                exit 1
              fi
              # Keep the periodic config token alive between deploys; harmless
              # no-op for non-renewable tokens.
              bao token renew >/dev/null 2>&1 || true

              # 1. kv-v2 engine
              if ! bao secrets list -format=table | awk '{print $1}' | grep -qx "${KV_PATH}/"; then
                bao secrets enable -path="${KV_PATH}" kv-v2
              fi

              # 2. uploader policy
              bao policy write uploader - <<EOF
              path "${KV_PATH}/data/*"     { capabilities = ["create", "update", "read"] }
              path "${KV_PATH}/metadata/*" { capabilities = ["list", "read"] }
              EOF

              # 3. oidc auth method
              if ! bao auth list -format=table | awk '{print $1}' | grep -qx "oidc/"; then
                bao auth enable oidc
              fi
              bao write auth/oidc/config \
                oidc_discovery_url="${OIDC_DISCOVERY_URL}" \
                oidc_client_id="openbao" \
                oidc_client_secret="${KC_SECRET_OPENBAO}" \
                default_role="uploader"

              # 4. oidc login role
              bao write auth/oidc/role/uploader \
                role_type="oidc" \
                user_claim="sub" \
                groups_claim="groups" \
                oidc_scopes="openid" \
                token_policies="uploader" \
                allowed_redirect_uris="${OIDC_URL}/ui/vault/auth/oidc/oidc/callback,http://localhost:8250/oidc/callback"

              # 5. external group bound to the Keycloak uploaders group
              ACCESSOR=$(bao auth list -format=table | awk '$1=="oidc/"{print $3}')
              GID=$(bao write -field=id identity/group name="${UPLOADERS_GROUP}" type="external" policies="uploader")
              # group-alias name must equal the Keycloak group name carried in the `groups` claim.
              bao write identity/group-alias name="${UPLOADERS_GROUP}" mount_accessor="${ACCESSOR}" canonical_id="${GID}" || true

              echo "OpenBao configuration complete."
          resources:
            {{- toYaml $job.resources | nindent 12 }}
{{- end }}
