{{- if .Values.mi.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: mi-export-scripts
  labels:
    {{- include "podiumd.labels" . | nindent 4 }}
    app.kubernetes.io/component: mi-export
data:
  # Unified dump script. Two output formats, selected via MI_FORMAT:
  #
  #   csv    — modeled on Maykin's bin/dump_data.sh --csv path: enumerate
  #            pg_tables in the chosen schemas, \COPY each to a per-table CSV
  #            on the /tmp emptyDir (separator `;`, HEADER row), then package
  #            into one tar.gz.
  #            Remote: <SFTP_REMOTE_PATH>/<gemeente>/<YYMMDD>/<component>/<HHMMSS>-<component>.tar.gz
  #            Inside: one CSV per table, named <table>.csv
  #            (or <schema>_<table>.csv when the schema is not public).
  #
  #   pgdump — pg_dump -Fc against the chosen schemas. Single output file in
  #            Postgres custom format (zlib-compressed, restorable via pg_restore).
  #            Remote: <SFTP_REMOTE_PATH>/<gemeente>/<YYMMDD>/<component>/<HHMMSS>-<component>.pgdump
  #
  # Egress is SFTP only — no blob storage. Auth is exactly one of:
  #   keypair  — SSH private key (SFTP_KEY_FILE, mode 0400)
  #   password — SFTP_PASSWORD from the connection Secret, fed to sftp via an
  #              SSH_ASKPASS helper (e.g. Azure Blob SFTP local users)
  # Host-key checking is intentionally disabled (StrictHostKeyChecking=no,
  # UserKnownHostsFile=/dev/null): these are short-lived, single-shot CronJob
  # containers reaching a host fixed by DNS, and the credential already gates
  # who can log in — sufficient for this use case. No known_hosts is mounted
  # or consulted.
  dump.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    : "${SFTP_HOST:?must be set}"
    : "${SFTP_USER:?must be set}"
    : "${SFTP_REMOTE_PATH:?must be set}"
    # Auth mode: the CronJob provides exactly one of SFTP_PASSWORD (password
    # mode, connection Secret) or SFTP_KEY_FILE (keypair mode, mounted key).
    if [[ -z "${SFTP_PASSWORD:-}" && -z "${SFTP_KEY_FILE:-}" ]]; then
      echo "either SFTP_PASSWORD or SFTP_KEY_FILE must be set" >&2
      exit 1
    fi
    : "${MI_GEMEENTE:?must be set}"
    : "${MI_COMPONENT:?must be set}"
    # The component Secret/ConfigMap are mounted with `optional: true`, so the
    # pod starts even when a component exposes no DB_* credentials. All four
    # DB_* absent → the component does not use PostgreSQL through the chart
    # convention: nothing to export, exit green. A *partial* set is a real
    # misconfiguration (typo'd secretName, half-migrated values) and still
    # fails the job.
    db_missing=()
    for v in DB_HOST DB_NAME DB_USER DB_PASSWORD; do
      if [[ -z "${!v:-}" ]]; then
        db_missing+=("${v}")
      fi
    done
    if [[ "${#db_missing[@]}" -eq 4 ]]; then
      echo "skip: component ${MI_COMPONENT} exposes no DB_* credentials — assuming it does not use PostgreSQL, nothing to export"
      exit 0
    elif [[ "${#db_missing[@]}" -gt 0 ]]; then
      echo "partial DB_* credentials for ${MI_COMPONENT} (missing: ${db_missing[*]}) — misconfiguration" >&2
      exit 1
    fi
    SFTP_PORT="${SFTP_PORT:-22}"
    DB_PORT="${DB_PORT:-5432}"
    # Whitespace-separated list, e.g. "public" or "public flowable". Default: public.
    MI_SCHEMAS="${MI_SCHEMAS:-public}"
    MI_FORMAT="${MI_FORMAT:-csv}"

    # One timestamp captured at script start so every table from a single run
    # lands under the same date+time path. Slicing keeps DATE_DIR and TIME_PART
    # consistent (no second-boundary skew between separate `date` calls).
    TS="$(date -u +%Y%m%d-%H%M%S)"
    DATE_DIR="${TS:2:6}"   # YYMMDD
    TIME_PART="${TS:9:6}"  # HHMMSS
    log() { printf '[%s] %s\n' "$(date -u -Iseconds)" "$*"; }

    # iter3-todo: image is mcr.microsoft.com/azure-cli (Azure Linux) with the
    # postgresql tooling, tar, and openssh-clients installed at runtime via
    # tdnf; bake a purpose-built image and drop this bootstrap step (and
    # re-enable runAsNonRoot in the CronJob securityContext). gzip is already
    # present in the base image. The `postgresql` package supplies both psql
    # and pg_dump; `openssh-clients` supplies sftp.
    needs=()
    command -v psql    >/dev/null 2>&1 || needs+=(postgresql)
    command -v pg_dump >/dev/null 2>&1 || needs+=(postgresql)
    command -v tar     >/dev/null 2>&1 || needs+=(tar)
    command -v sftp    >/dev/null 2>&1 || needs+=(openssh-clients)
    # NB: no sshpass — on Azure Linux it requires the `openssh` meta package,
    # which drags in openssh-server, whose install scriptlet (groupadd sshd)
    # fails in the azure-cli image (no /etc/gshadow). Password mode uses
    # OpenSSH's own SSH_ASKPASS mechanism instead (see upload_sftp).
    if [ "${#needs[@]}" -gt 0 ]; then
      # Dedupe: a single `postgresql` install gives us psql + pg_dump.
      uniq_needs=$(printf '%s\n' "${needs[@]}" | sort -u)
      log "installing: ${uniq_needs}"
      # shellcheck disable=SC2086
      tdnf install -y --quiet ${uniq_needs} >/dev/null
    fi

    psql_run() {
      PGPASSWORD="${DB_PASSWORD}" psql \
        --host="${DB_HOST}" --port="${DB_PORT}" \
        --username="${DB_USER}" --dbname="${DB_NAME}" \
        --no-psqlrc --set ON_ERROR_STOP=1 "$@"
    }

    upload_sftp() {
      # upload_sftp <local-file> <remote-relative-path>
      #
      # Uses sftp batch mode (-b -). Ancestor directories are probed with a
      # silent `cd` first and only the missing tail is created, so routine
      # re-runs print no "remote mkdir: Failure" noise — Azure Blob SFTP
      # answers mkdir-on-existing-dir with a generic SSH_FX_FAILURE rather
      # than a friendly "already exists". The mkdirs we do emit keep the
      # leading `-` (continue on error): sibling component jobs fire on the
      # same schedule and share the <gemeente>/<date> ancestors, so one can
      # create a dir between our probe and our mkdir. A genuinely broken
      # mkdir (e.g. permissions) still fails the job, because the `put` that
      # follows aborts the batch with a nonzero exit.
      #
      # Host-key checking is disabled by design (see header): accept any host
      # key and discard it to /dev/null. Trust rests on DNS + the credential.
      # LogLevel=ERROR mutes the "Warning: Permanently added ..." line that
      # combination otherwise prints on every connection.
      local file="$1" remote="$2" size remote_full remote_dir remote_name
      size="$(stat -c%s "${file}" 2>/dev/null || stat -f%z "${file}")"
      remote_full="${SFTP_REMOTE_PATH%/}/${remote}"
      remote_dir="$(dirname "${remote_full}")"
      remote_name="$(basename "${remote_full}")"
      # Auth options MUST come before `-b -`: sftp's -b flag injects
      # BatchMode=yes into the underlying ssh, and ssh uses the FIRST
      # obtained value per option — so a BatchMode=no placed earlier on the
      # command line is what keeps password prompting alive.
      local sftp_cmd=(sftp)
      if [[ -n "${SFTP_PASSWORD:-}" ]]; then
        # Password mode: OpenSSH (>= 8.4) reads the password from the
        # SSH_ASKPASS helper when SSH_ASKPASS_REQUIRE=force, no TTY or
        # sshpass needed. The helper prints the SFTP_PASSWORD env var at
        # call time — the password itself is never written to disk.
        if [[ -z "${MI_ASKPASS:-}" ]]; then
          MI_ASKPASS="$(mktemp /tmp/mi-askpass.XXXXXX)"
          cat > "${MI_ASKPASS}" <<'ASKPASS'
    #!/bin/sh
    printf '%s\n' "${SFTP_PASSWORD}"
    ASKPASS
          chmod 700 "${MI_ASKPASS}"
        fi
        sftp_cmd=("${sftp_cmd[@]}"
          -o "BatchMode=no"
          -o "PubkeyAuthentication=no"
          -o "NumberOfPasswordPrompts=1")
      else
        # Keypair mode: identity file only, no password fallback.
        sftp_cmd=("${sftp_cmd[@]}"
          -i "${SFTP_KEY_FILE}"
          -o "PasswordAuthentication=no"
          -o "BatchMode=yes")
      fi
      sftp_cmd=("${sftp_cmd[@]}"
        -b -
        -o "UserKnownHostsFile=/dev/null"
        -o "StrictHostKeyChecking=no"
        -o "LogLevel=ERROR"
        -o "ConnectTimeout=20"
        -P "${SFTP_PORT}")

      run_batch() {
        # One sftp connection; batch commands on stdin. stdout is sftp's
        # command echo — discard. stderr passes through to the job log.
        if [[ -n "${SFTP_PASSWORD:-}" ]]; then
          SSH_ASKPASS="${MI_ASKPASS}" SSH_ASKPASS_REQUIRE=force DISPLAY=:0 \
            "${sftp_cmd[@]}" "${SFTP_USER}@${SFTP_HOST}" >/dev/null
        else
          "${sftp_cmd[@]}" "${SFTP_USER}@${SFTP_HOST}" >/dev/null
        fi
      }

      remote_dir_exists() {
        # Probe on a throwaway connection: batch mode exits nonzero when the
        # `cd` fails. A miss is the expected signal here, not an error —
        # silence stderr so probes never write to the job log.
        printf 'cd %s\n' "$1" | run_batch 2>/dev/null
      }

      local batch=""
      if ! remote_dir_exists "${remote_dir}"; then
        # Walk ancestors top-down; once one level is missing every deeper
        # level must be too (blob dirs are virtual — a child implies its
        # parent), so stop probing there and mkdir the rest.
        local IFS_BACK="${IFS}"
        IFS='/' read -ra parts <<< "${remote_dir#/}"
        IFS="${IFS_BACK}"
        local cur="/" missing=0 p
        for p in "${parts[@]}"; do
          [ -z "${p}" ] && continue
          cur="${cur%/}/${p}"
          if [[ "${missing}" -eq 0 ]] && remote_dir_exists "${cur}"; then
            continue
          fi
          missing=1
          batch="${batch}-mkdir ${cur}"$'\n'
        done
      fi
      batch="${batch}put ${file} ${remote_full}"$'\n'
      log "uploading ${remote_full} (${size} bytes) to ${SFTP_USER}@${SFTP_HOST}:${SFTP_PORT}"
      printf '%s' "${batch}" | run_batch
      log "uploaded ${remote_name}"
    }

    log "starting MI export: component=${MI_COMPONENT} schemas=${MI_SCHEMAS} format=${MI_FORMAT}"

    case "${MI_FORMAT}" in
      csv)
        # Per-run scratch area on the /tmp emptyDir. Holds CSVs while we
        # accumulate them, plus the final tar.gz. Both are wiped on exit.
        WORK="$(mktemp -d /tmp/mi-csv.XXXXXX)"
        TARBALL="$(mktemp -u -p /tmp mi-XXXXXX.tar.gz)"
        trap 'rm -rf "${WORK}" "${TARBALL}"' EXIT

        list_tables() {
          # Returns 'schema<TAB>table' lines for every base table in the requested schemas.
          local in_clause
          # shellcheck disable=SC2086  # MI_SCHEMAS is whitespace-separated by contract; word splitting is intentional.
          in_clause="$(printf "'%s'," ${MI_SCHEMAS})"
          in_clause="${in_clause%,}"
          psql_run -At -F $'\t' --command="
            SELECT schemaname, tablename
            FROM pg_catalog.pg_tables
            WHERE schemaname IN (${in_clause})
            ORDER BY schemaname, tablename
          "
        }

        dump_one_to_disk() {
          # dump_one_to_disk <schema> <table>  → ${WORK}/<label>.csv
          # label drops the schema prefix for public (same convention as before).
          # Separator is `;` (per IN-2119 — Excel/EU-locale default).
          local schema="$1" table="$2" label
          if [ "${schema}" = "public" ]; then label="${table}"; else label="${schema}_${table}"; fi
          log "dumping ${schema}.${table} -> ${label}.csv"
          psql_run --command="\\COPY \"${schema}\".\"${table}\" TO STDOUT WITH (FORMAT csv, HEADER, DELIMITER ';')" \
            > "${WORK}/${label}.csv"
        }

        rows="$(list_tables)"
        if [ -z "${rows}" ]; then
          log "no tables found in schemas (${MI_SCHEMAS}) of ${MI_COMPONENT} DB"
          exit 1
        fi

        n=0
        while IFS=$'\t' read -r schema table; do
          [ -z "${schema}" ] && continue
          dump_one_to_disk "${schema}" "${table}"
          n=$((n+1))
        done <<< "${rows}"

        # gzip's deflate window is 32 KiB regardless of input size — memory
        # stays bounded at ~256 KiB whether we package 5 tables or 5,000.
        log "packaging ${n} CSV(s) into ${MI_COMPONENT}.tar.gz"
        tar -czf "${TARBALL}" -C "${WORK}" .

        REMOTE="${MI_GEMEENTE}/${DATE_DIR}/${MI_COMPONENT}/${TIME_PART}-${MI_COMPONENT}.tar.gz"
        upload_sftp "${TARBALL}" "${REMOTE}"
        log "done: ${n} table(s) packaged in ${REMOTE}"
        ;;

      pgdump)
        # Single pg_dump in custom format (-Fc) — zlib-compressed, restorable
        # with pg_restore, includes schema + data + ownership/privileges.
        # One -n flag per requested schema; tables outside those schemas are
        # excluded (matches the csv path's filtering).
        DUMPFILE="$(mktemp -u -p /tmp mi-XXXXXX.pgdump)"
        trap 'rm -f "${DUMPFILE}"' EXIT

        schema_args=()
        # shellcheck disable=SC2086  # MI_SCHEMAS is whitespace-separated by contract; word splitting is intentional.
        for s in ${MI_SCHEMAS}; do
          schema_args+=(-n "${s}")
        done

        log "running pg_dump -Fc on ${DB_NAME} (schemas: ${MI_SCHEMAS})"
        PGPASSWORD="${DB_PASSWORD}" pg_dump \
          --host="${DB_HOST}" --port="${DB_PORT}" \
          --username="${DB_USER}" --dbname="${DB_NAME}" \
          --format=custom \
          --no-owner --no-privileges \
          "${schema_args[@]}" \
          --file="${DUMPFILE}"

        REMOTE="${MI_GEMEENTE}/${DATE_DIR}/${MI_COMPONENT}/${TIME_PART}-${MI_COMPONENT}.pgdump"
        upload_sftp "${DUMPFILE}" "${REMOTE}"
        log "done: pg_dump uploaded to ${REMOTE}"
        ;;

      *)
        log "unsupported MI_FORMAT='${MI_FORMAT}' (expected csv or pgdump)"
        exit 2
        ;;
    esac
{{- end }}
