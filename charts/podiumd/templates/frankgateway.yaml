{{- if .Values.frankgateway.enabled }}
{{- /*
  Frank!Gateway (Apache APISIX 3.16 + WeAreFrank patches) — gateway Deployment
  + Service, one pair per enabled instance in frankgateway.instances. etcd-backed
  traditional mode so the Admin API + dashboard work. Data plane on 9080, Admin
  API on 9180, both ClusterIP-only; external exposure (HTTPRoute/Ingress + cert
  SANs) is deploy-side.

  Instances share the single etcd StatefulSet and are isolated by etcd prefix.
  Every instance is named after its key (`frankgateway-<key>`); there is no
  single-instance shape.

  External-API keys (BAG/KVK) come from the out-of-band Secret named by
  apiKeys.existingSecret (optional — absent Secret does not block startup); the
  config Secret's main_configuration_snippet exposes the var NAMES to nginx
  workers so routes read them via os.getenv at request time.

  The checksum/config annotation is computed from THIS instance's config only
  (via the podiumd.frankgateway.config helper) rather than from the whole
  rendered config template: a range over instances in one file would give every
  Deployment the same file-wide checksum, so a route or plugin change on one
  traffic class would needlessly restart the others.
*/ -}}
{{- $root := . }}
{{- range $key, $override := .Values.frankgateway.instances }}
{{- $fg := include "podiumd.frankgateway.instanceValues" (dict "root" $root "key" $key "override" $override) | fromYaml }}
{{- if $fg.enabled }}
{{- $name := include "podiumd.frankgateway.instanceName" (dict "key" $key "instance" $fg) }}
{{- $prefix := include "podiumd.frankgateway.etcdPrefix" (dict "key" $key "instance" $fg) }}
{{- $creds := include "podiumd.frankgateway.adminCreds" (dict "root" $root "instance" $fg "name" $name) | fromYaml }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "podiumd.labels" $root | nindent 4 }}
    app.kubernetes.io/component: frankgateway
    app.kubernetes.io/name: {{ $name }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: gateway
      port: 9080
      targetPort: 9080
    - name: admin
      port: 9180
      targetPort: 9180
    {{- if $fg.tls.enabled }}
    - name: gateway-tls
      port: {{ $fg.tls.port }}
      targetPort: {{ $fg.tls.port }}
    {{- end }}
    {{- if $fg.metrics.enabled }}
    - name: metrics
      port: 9091
      targetPort: 9091
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "podiumd.labels" $root | nindent 4 }}
    app.kubernetes.io/component: frankgateway
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: {{ $fg.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "podiumd.labels" $root | nindent 8 }}
        app.kubernetes.io/component: frankgateway
        app.kubernetes.io/name: {{ $name }}
      annotations:
        # Roll the pod when the rendered APISIX config changes.
        checksum/config: {{ include "podiumd.frankgateway.config" (dict "root" $root "instance" $fg "name" $name "prefix" $prefix "admin" $creds.admin "viewer" $creds.viewer) | sha256sum }}
    spec:
      containers:
        - name: frankgateway
          image: "{{ $fg.image.repository }}:{{ $fg.image.tag }}"
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: {{ $fg.apiKeys.existingSecret }}
                optional: true
          ports:
            - name: gateway
              containerPort: 9080
            - name: admin
              containerPort: 9180
            {{- if $fg.tls.enabled }}
            - name: gateway-tls
              containerPort: {{ $fg.tls.port }}
            {{- end }}
            {{- if $fg.metrics.enabled }}
            - name: metrics
              containerPort: 9091
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: 9080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9080
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            {{- toYaml $fg.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /usr/local/apisix/conf/config.yaml
              subPath: config.yaml
      volumes:
        - name: config
          secret:
            secretName: {{ $name }}-config
{{- end }}
{{- end }}
{{- end }}
