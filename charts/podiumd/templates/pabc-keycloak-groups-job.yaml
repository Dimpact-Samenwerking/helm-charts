{{- $operatorJobs := (index .Values "keycloak-operator").jobs }}
{{- if and .Values.pabc.enabled .Values.pabc.seedJob.enabled .Values.pabc.seedJob.keycloak.enabled (index .Values "keycloak-operator").enabled $operatorJobs.ensureOperatorSa.enabled $operatorJobs.ensureOperatorSa.clientSecret }}
{{- $dataset := .Files.Get "files/pabc-dataset.json" | fromJson }}
{{- $script := include "podiumd.pabcKeycloakGroups.script" (dict "dataset" $dataset) }}
---
# Job: Keycloak side of the PABC seed. Only for test environments that seed
# PABC (pabc.seedJob.enabled); municipalities set up PABC through its UI and
# keep this off.
#
# ZAC sends the user's Keycloak REALM roles (realm_access.roles) to PABC as
# functional roles, not the group names. For every functional role in
# files/pabc-dataset.json this Job makes sure the podiumd realm has a realm
# role and a group with exactly that name, with the role attached to the
# group, so putting a user in the group is enough. It uses kcadm.sh from the
# Keycloak image as the keycloak-operator service account and only ever adds:
# existing roles, groups and mappings are left alone.
#
# With keycloak.config.skipRoles/skipGroups: false the realm import creates the
# same roles and groups, so there this Job changes nothing.
#
# The Job name carries a checksum of the rendered script, so it runs once per
# change of the functional roles. It is kept separate from pabc-seed-job on
# purpose: that Job's name hashes its own pod template, and folding this in
# would re-seed (and wipe) PABC.
apiVersion: batch/v1
kind: Job
metadata:
  name: pabc-keycloak-groups-job-{{ $script | sha256sum | trunc 10 }}
  labels:
    {{- include "podiumd.labels" . | nindent 4 }}
    app.kubernetes.io/component: pabc
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        {{- include "podiumd.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: pabc
    spec:
      {{- if .Values.keycloak.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.keycloak.nodeSelector | nindent 8 }}
      {{- else if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      volumes:
      - name: tmp
        emptyDir: {}
      containers:
      - name: pabc-keycloak-groups
        image: {{ include "podiumd.image" .Values.keycloak.image }}
        resources:
          {{- toYaml .Values.pabc.seedJob.keycloak.resources | nindent 10 }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        command: ["/bin/bash", "-c"]
        args:
        - |
          {{- $script | nindent 10 }}
        env:
        - name: HOME
          value: /tmp
        - name: KEYCLOAK_URL
          value: {{ $operatorJobs.keycloakUrl | default "http://keycloak-service:8080" | quote }}
        - name: REALM
          value: {{ .Values.keycloak.config.realm | quote }}
        - name: CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: keycloak-operator-client-secret
              key: client-secret
        volumeMounts:
        - name: tmp
          mountPath: /tmp
{{- end }}

{{- define "podiumd.pabcKeycloakGroups.script" -}}
set -euo pipefail
kc() { /opt/keycloak/bin/kcadm.sh "$@" --config /tmp/kcadm.config; }

# The realm itself comes from the realm import job, which may still be running.
echo "Logging in to $KEYCLOAK_URL as keycloak-operator..."
for i in $(seq 1 60); do
  if kc config credentials --server "$KEYCLOAK_URL" --realm master \
       --client keycloak-operator --secret "$CLIENT_SECRET" >/dev/null 2>&1 \
     && kc get "realms/$REALM" --fields realm >/dev/null 2>&1; then
    break
  fi
  if [ "$i" = 60 ]; then echo "Timed out waiting for Keycloak realm $REALM"; exit 1; fi
  echo "Waiting for Keycloak realm $REALM ($i/60)..."
  sleep 10
done

ensure_role_and_group() {
  local id
  if ! kc get "roles/$1" -r "$REALM" >/dev/null 2>&1; then
    kc create roles -r "$REALM" -s "name=$1" >/dev/null
    echo "Created realm role $1"
  fi
  id=$(kc get "group-by-path/$1" -r "$REALM" --fields id --format csv --noquotes 2>/dev/null || true)
  if [ -z "$id" ]; then
    id=$(kc create groups -r "$REALM" -s "name=$1" -i)
    echo "Created group $1"
  fi
  kc add-roles -r "$REALM" --gid "$id" --rolename "$1"
  echo "Group $1 has realm role $1"
}
{{ range $fr := .dataset.functionalRoles }}
ensure_role_and_group {{ $fr.name | quote }}
{{- end }}

echo "Done."
{{- end -}}
