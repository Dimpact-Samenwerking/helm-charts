{{/*
Pod template of the Keycloak groups Job, rendered separately so its checksum
can go into the Job name (see below). Context: dict "root" (the chart) and
"script" (the rendered script).
*/}}
{{- define "podiumd.pabcKeycloakGroups.podTemplate" -}}
{{- $root := .root -}}
metadata:
  labels:
    {{- include "podiumd.selectorLabels" $root | nindent 4 }}
    app.kubernetes.io/component: pabc
spec:
  {{- if $root.Values.keycloak.nodeSelector }}
  nodeSelector:
    {{- toYaml $root.Values.keycloak.nodeSelector | nindent 4 }}
  {{- else if $root.Values.nodeSelector }}
  nodeSelector:
    {{- toYaml $root.Values.nodeSelector | nindent 4 }}
  {{- end }}
  restartPolicy: Never
  volumes:
  - name: tmp
    emptyDir: {}
  containers:
  - name: pabc-keycloak-groups
    image: {{ include "podiumd.image" $root.Values.keycloak.image }}
    resources:
      {{- toYaml $root.Values.pabc.seedJob.keycloak.resources | nindent 6 }}
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
    command: {{ include "podiumd.retryCommand" (list "/bin/bash" "-c") }}
    args:
    - |
      {{- .script | nindent 6 }}
    env:
    - name: HOME
      value: /tmp
    - name: KEYCLOAK_URL
      value: {{ (index $root.Values "keycloak-operator").jobs.keycloakUrl | default "http://keycloak-service:8080" | quote }}
    - name: REALM
      value: {{ $root.Values.keycloak.config.realm | quote }}
    - name: CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: keycloak-operator-client-secret
          key: client-secret
    volumeMounts:
    - name: tmp
      mountPath: /tmp
{{- end }}

{{- $operatorJobs := (index .Values "keycloak-operator").jobs }}
{{- $importCreatesAll := and $operatorJobs.importPodiumdRealm.enabled (not .Values.keycloak.config.skipRoles) (not .Values.keycloak.config.skipGroups) }}
{{- if and .Values.pabc.enabled .Values.pabc.seedJob.enabled .Values.pabc.seedJob.keycloak.enabled (index .Values "keycloak-operator").enabled $operatorJobs.ensureOperatorSa.enabled $operatorJobs.ensureOperatorSa.clientSecret (not $importCreatesAll) }}
---
{{- $dataset := .Files.Get "files/pabc-dataset.json" | fromJson }}
{{- $script := include "podiumd.pabcKeycloakGroups.script" (dict "dataset" $dataset) }}
{{- $podTemplate := include "podiumd.pabcKeycloakGroups.podTemplate" (dict "root" . "script" $script) }}
# Job: Keycloak side of the PABC seed. Only for test environments that seed
# PABC (pabc.seedJob.enabled); municipalities set up PABC through its UI and
# keep this off.
#
# ZAC sends the user's Keycloak REALM roles (realm_access.roles) to PABC as
# functional roles, not the group names. For every functional role in
# files/pabc-dataset.json this Job makes sure the podiumd realm has a realm
# role and a group with exactly that name, with the role attached to the
# group, so putting a user in the group is enough. It uses kcadm.sh from the
# Keycloak image, authenticating with the keycloak-operator client secret, and only ever adds:
# existing roles, groups and mappings are left alone.
#
# With keycloak.config.skipRoles and skipGroups both false the realm import
# creates the same roles and groups, so this Job is left out: running both
# made the import fail with 409 on a role this Job had just created. With only
# one of them false, the import's rerun (podiumd.retryCommand) gets past it.
#
# The Job name carries a checksum of its whole pod template, script included,
# so it runs once per change of the functional roles, and also when the
# Keycloak image or the resources change: spec.template on a batch/v1 Job is
# immutable, so a name that hashed only the script made the next helm upgrade
# fail with "field is immutable" after a Keycloak image bump. It is kept
# separate from pabc-seed-job on purpose: that Job's name hashes its own pod
# template, and folding this in would re-seed (and wipe) PABC.
apiVersion: batch/v1
kind: Job
metadata:
  name: pabc-keycloak-groups-job-{{ $podTemplate | sha256sum | trunc 10 }}
  labels:
    {{- include "podiumd.labels" . | nindent 4 }}
    app.kubernetes.io/component: pabc
spec:
  backoffLimit: 10
  template:
    {{- $podTemplate | nindent 4 }}
{{- end }}

{{- define "podiumd.pabcKeycloakGroups.script" -}}
set -euo pipefail
{{ include "podiumd.kcadmLogin" . }}

ensure_role_and_group() {
  local id
  # A create can lose a race with the realm import creating the same role or
  # group (409); in that case the lookup afterwards finds the one it made.
  if ! kc get "roles/$1" -r "$REALM" >/dev/null 2>&1; then
    if kc create roles -r "$REALM" -s "name=$1" >/dev/null 2>&1; then
      echo "Created realm role $1"
    else
      kc get "roles/$1" -r "$REALM" >/dev/null
    fi
  fi
  id=$(kc get "group-by-path/$1" -r "$REALM" --fields id --format csv --noquotes 2>/dev/null || true)
  if [ -z "$id" ]; then
    if id=$(kc create groups -r "$REALM" -s "name=$1" -i 2>/dev/null); then
      echo "Created group $1"
    else
      id=$(kc get "group-by-path/$1" -r "$REALM" --fields id --format csv --noquotes)
    fi
  fi
  kc add-roles -r "$REALM" --gid "$id" --rolename "$1"
  echo "Group $1 has realm role $1"
}
{{ range $fr := .dataset.functionalRoles }}
ensure_role_and_group {{ $fr.name | quote }}
{{- end }}

echo "Done."
{{- end -}}
