{{- if .Values.frankgateway.enabled }}
{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" }}
{{- /*
  Scrape config for the APISIX prometheus exporter (Service port `metrics`,
  9091), one ServiceMonitor per enabled instance so each traffic class produces
  its own series. Consumed by any prometheus-operator instance whose
  serviceMonitor selectors are permissive (the monitoring-logging chart sets
  serviceMonitorSelectorNilUsesHelmValues: false, so no extra labels needed).
  Guarded on the CRD so envs without prometheus-operator still template.
*/ -}}
{{- $root := . }}
{{- range $key, $override := .Values.frankgateway.instances }}
{{- $fg := include "podiumd.frankgateway.instanceValues" (dict "root" $root "key" $key "override" $override) | fromYaml }}
{{- if and $fg.enabled $fg.metrics.enabled $fg.metrics.serviceMonitor.enabled }}
{{- $name := include "podiumd.frankgateway.instanceName" (dict "key" $key "instance" $fg) }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "podiumd.labels" $root | nindent 4 }}
    app.kubernetes.io/component: frankgateway
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  endpoints:
    - port: metrics
      path: /apisix/prometheus/metrics
      interval: {{ $fg.metrics.serviceMonitor.interval }}
      # Which traffic class produced the metric, stamped at scrape time so it
      # lands on EVERY series from this instance. The APISIX prometheus plugin
      # can only add extra_labels to http_status, which would leave
      # apisix_http_latency_bucket, apisix_bandwidth and the nginx connection
      # gauges unlabelled — a dashboard filtering by class would silently show
      # empty latency and bandwidth panels. Doing it here instead covers all of
      # them with one rule.
      relabelings:
        - targetLabel: instance_name
          replacement: {{ $name }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
