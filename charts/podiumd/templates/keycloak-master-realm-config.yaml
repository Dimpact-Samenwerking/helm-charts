{{- if and (index .Values "keycloak-operator").enabled (index .Values "keycloak-operator").jobs.importMasterRealm.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-master-realm-config
  labels:
    {{- include "podiumd.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-config-cli
data:
  master.yaml: |-
    realm: master
    attributes:
      frontendUrl: {{ .Values.keycloak.config.adminFrontendUrl | quote }}
    browserSecurityHeaders:
      xContentTypeOptions: "nosniff"
      xRobotsTag: "none"
      xFrameOptions: "SAMEORIGIN"
      contentSecurityPolicy: "frame-src 'self'; frame-ancestors 'self'; object-src 'none';"
      xXSSProtection: "1; mode=block"
      strictTransportSecurity: "max-age=31536000; includeSubDomains"
    bruteForceProtected: true
    failureFactor: 5
    revokeRefreshToken: true
    eventsEnabled: true
    adminEventsEnabled: true
    adminEventsDetailsEnabled: true
    eventsExpiration: 2592000
    offlineSessionMaxLifespanEnabled: true
    offlineSessionMaxLifespan: 7776000
    # Disable offline_access (persistent refresh-token) grants realm-wide — see
    # keycloak-podiumd-realm-config.yaml for the rationale and
    # docs/apps/keycloak/keycloak-security-updates.md § "Offline Access Disabled".
    defaultOptionalClientScopes: &defaultOptionalClientScopes
      - address
      - phone
      - microprofile-jwt
    ssoSessionMaxLifespan: 36000
    ssoSessionIdleTimeout: 1800
    passwordPolicy: "length(14) and notUsername(undefined) and notEmail(undefined) and passwordHistory(5)"
    requiredActions:
      - name: "Configure OTP"
        providerId: CONFIGURE_TOTP
        enabled: "true"
        defaultAction: "true"
        alias: CONFIGURE_TOTP
    clients:
      # admin-cli ships with the browser-redirect flows enabled by default, but the
      # only legitimate use in this chart is Direct Access Grants (ROPC): the
      # one-time podiumd-admin bootstrap login in keycloak-ensure-operator-sa.yaml,
      # and the /kc-idp-secret operator fallback. Disable standard/implicit flow so
      # a stray redirect-URI addition can't turn this public client into an
      # authorization-code-interception target.
      - clientId: admin-cli
        optionalClientScopes: *defaultOptionalClientScopes
        standardFlowEnabled: false
        implicitFlowEnabled: false
        directAccessGrantsEnabled: true
{{- with .Values.keycloak.config.adminIdentityProviders }}
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- with .Values.keycloak.config.adminIdentityProviderMappers }}
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- end -}}
