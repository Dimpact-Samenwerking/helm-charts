      - clientId: {{ .Values.pabc.settings.keycloakAdmin.clientId }}
        name: PABC Keycloak Admin REST API client
        enabled: true
        clientAuthenticatorType: client-secret
        secret: $(KC_SECRET_PABC_ADMIN)
        serviceAccountsEnabled: true
        # Service-account-only client (PABC's own backend calls the Keycloak Admin
        # REST API) — no interactive login is ever performed with it. Disable the
        # browser flow explicitly instead of leaving it on Keycloak's own default.
        standardFlowEnabled: false
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
{{- if and .Values.frankgateway.enabled .Values.frankgateway.dashboard.enabled .Values.frankgateway.dashboard.auth.enabled }}
      - clientId: frankgateway-dashboard
        name: Frank!Gateway Dashboard
        description: OIDC client used by oauth2-proxy in front of the Frank!Gateway (APISIX) dashboard to authenticate operator browser sessions.
        enabled: true
        clientAuthenticatorType: client-secret
        secret: $(KC_SECRET_FRANKGATEWAY_DASHBOARD)
        # Standard authorization-code flow for the dashboard browser session.
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        publicClient: false
        # Redirects come back to the public oauth2-proxy callback path. The proxy
        # then validates the session and forwards to the frankgateway-shim ->
        # dashboard in-cluster. dashboard.auth.hostname is required when the SSO
        # chain is enabled, so this is non-empty whenever this block is rendered.
        redirectUris:
          - "https://{{ .Values.frankgateway.dashboard.auth.hostname }}/oauth2/callback"
          - "http://localhost:8080/oauth2/callback"
        webOrigins:
          - "+"
        protocolMappers:
          - name: "username"
            protocol: "openid-connect"
            protocolMapper: oidc-usermodel-property-mapper
            config:
              introspection.token.claim: "true"
              userinfo.token.claim: "true"
              user.attribute: "username"
              id.token.claim: "true"
              lightweight.claim: "false"
              access.token.claim: "true"
              claim.name: "preferred_username"
              jsonType.label: "String"
          - name: "groups"
            protocol: "openid-connect"
            protocolMapper: "oidc-group-membership-mapper"
            consentRequired: false
            config:
              introspection.token.claim: "true"
              userinfo.token.claim: "true"
              id.token.claim: "true"
              access.token.claim: "true"
              claim.name: "groups"
              full.path: "false"
{{- end }}
