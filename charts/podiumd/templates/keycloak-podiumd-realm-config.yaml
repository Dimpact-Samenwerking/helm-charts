        webOrigins:
          - "{{ .Values.keycloak.config.clients.datamigratie.oidcUrl | trimSuffix "/" }}/*"
        authorizationServicesEnabled: "true"
        serviceAccountsEnabled: "true"
        protocolMappers:
          - name: "realm-roles"
            protocol: "openid-connect"
            protocolMapper: "oidc-usermodel-realm-role-mapper"
            consentRequired: false
            config:
              introspection.token.claim: "true"
              multivalued: "true"
              userinfo.token.claim: "true"
              id.token.claim: "true"
              lightweight.claim: "false"
              access.token.claim: "true"
              claim.name: "roles"
              jsonType.label: "String"
          - name: "all-users-are-viewers"
            protocol: "openid-connect"
            protocolMapper: "oidc-hardcoded-role-mapper"
            consentRequired: false
            config:
              role: "DMT-Functioneel-Beheerder"
{{- if .Values.zaakbrug.enabled }}
      - clientId: zaakbrug
        name: {{ .Values.keycloak.config.clients.zaakbrug.name | quote }}
        enabled: {{ .Values.keycloak.config.clients.zaakbrug.enabled }}
        secret: $(KC_SECRET_ZAAKBRUG)
        clientAuthenticatorType: client-secret
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        redirectUris:
          - "{{ .Values.keycloak.config.clients.zaakbrug.oidcUrl | trimSuffix "/" }}/*"
        webOrigins:
          - "{{ .Values.keycloak.config.clients.zaakbrug.oidcUrl | trimSuffix "/" }}/*"
        protocolMappers:
          # Flattens zaakbrug client roles into a top-level "roles" claim.
          # Frank!Framework authoritiesClaimName=roles reads this; Frank rejects
          # claim names with more than one dot, so the default nested
          # resource_access.zaakbrug.roles cannot be used.
          - name: "zaakbrug-client-roles-to-roles"
            protocol: "openid-connect"
            protocolMapper: "oidc-usermodel-client-role-mapper"
            consentRequired: false
            config:
              introspection.token.claim: "true"
              multivalued: "true"
              userinfo.token.claim: "true"
              id.token.claim: "true"
              lightweight.claim: "false"
              access.token.claim: "true"
              claim.name: "roles"
              jsonType.label: "String"
              usermodel.clientRoleMapping.clientId: "zaakbrug"
{{- end }}
