        webOrigins:
          - "{{ .Values.keycloak.config.clients.monitoring.oidcUrl | trimSuffix "/" }}/*"
        authorizationServicesEnabled: "true"
        serviceAccountsEnabled: "true"
        protocolMappers:
          - name: "user-roles"
            protocol: "openid-connect"
            protocolMapper: "oidc-usermodel-client-role-mapper"
            consentRequired: false
            config:
              introspection.token.claim: "true"
              multivalued: "true"
              userinfo.token.claim: "true"
              id.token.claim: "true"
              lightweight.claim: "false"
              access.token.claim: "true"
              claim.name: "monitoring_roles"
              jsonType.label: "String"
              usermodel.clientRoleMapping.clientId: "monitoring"
          - name: "all-users-are-viewers"
            protocol: "openid-connect"
            protocolMapper: "oidc-hardcoded-role-mapper"
            consentRequired: false
            config:
              role: "monitoring.viewer"
      - clientId: datamigratie
        name: {{ .Values.keycloak.config.clients.datamigratie.name|quote }}
        enabled: {{ .Values.keycloak.config.clients.datamigratie.enabled }}
        secret: $(KC_SECRET_DATAMIGRATIE)
        clientAuthenticatorType: client-secret
