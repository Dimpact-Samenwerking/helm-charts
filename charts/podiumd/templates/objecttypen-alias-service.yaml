{{- /* In-cluster alias for the retired objecttypen service (IN-2597). Open Object 4
     serves the ObjectTypes API from the objecten pods on the same paths
     (/api/v2/objecttypes), so a Service named objecttypen that selects those
     pods keeps http://objecttypen.<namespace>.svc.cluster.local URLs working:
     consumer configuration and stored objecttype URLs need no rewrite. The
     objecttypen host must be in objecten.settings.allowedHosts. The public
     <env>-objecttypen hostname is a DNS CNAME to <env>-objecten, outside this
     chart. */ -}}
{{- if and .Values.objecten.enabled .Values.objecten.objecttypenAlias.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: objecttypen
  labels:
    {{- include "podiumd.labelsNamed" (dict "context" $ "name" "objecttypen") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: objecten
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
{{- end }}
