{{- /* podiumd-chart-50 (interim): the Maykin charts render their setup_configuration Job as a
     post-install/post-upgrade hook, and Helm runs hooks one after another: nine of them took
     about 2 minutes of every upgrade. podiumd turns those hooks off
     (<app>.configuration.job.enabled: false) and renders the same Jobs from the sub-charts'
     own templates as plain Jobs, which start together. One hook then waits for all of them
     and fails when one fails, so a failing configuration still fails the deploy. An
     environment that still sets job.enabled: true keeps the sub-chart's hook for that app.
     Remove this file when the Maykin charts can turn off the hook. */ -}}
{{- $cfg := .Values.maykinConfigJobs }}
{{- $names := list }}
{{- range $alias := splitList " " (include "podiumd.maykinConfigJobApps" .) }}
{{- $found := include "podiumd.maykinConfigJob" (dict "root" $ "alias" $alias) | fromYaml }}
{{- if $found.plain }}
{{- $names = append $names $found.job.metadata.name }}
---
{{ toYaml $found.job }}
{{- end }}
{{- end }}
{{- if $names }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maykin-config-jobs-wait
  labels:
    {{- include "podiumd.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: maykin-config-jobs-wait
  labels:
    {{- include "podiumd.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maykin-config-jobs-wait
  labels:
    {{- include "podiumd.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: maykin-config-jobs-wait
subjects:
  - kind: ServiceAccount
    name: maykin-config-jobs-wait
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: maykin-config-jobs-wait
  labels:
    {{- include "podiumd.labels" . | nindent 4 }}
  annotations:
    # The hook that keeps a failing configuration failing the deploy, as the Maykin hooks did.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "podiumd.labels" . | nindent 8 }}
    spec:
      serviceAccountName: maykin-config-jobs-wait
      automountServiceAccountToken: true
      restartPolicy: Never
      {{- with $cfg.wait.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: wait
          image: {{ include "podiumd.image" $cfg.wait.image }}
          resources:
            {{- toYaml $cfg.wait.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: JOBS
              value: {{ join " " $names | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -u
              # Helm's --timeout bounds this hook, as it bounded each Maykin hook. The Jobs retry
              # (restartPolicy OnFailure, podiumd-chart-31: Keycloak may not be ready yet), so a
              # broken configuration restarts until the timeout: print the log of every new
              # restart, so the cause is in this hook's log before Helm gives up.
              PENDING="$JOBS"; FAILED=""; SEEN=""
              while [ -n "$PENDING" ]; do
                LEFT=""
                for JOB in $PENDING; do
                  STATE=$(kubectl get job "$JOB" -n "$NAMESPACE" -o jsonpath='{.status.conditions[?(@.status=="True")].type}' 2>/dev/null) || STATE=""
                  case "$STATE" in
                    *Failed*)
                      echo "job/$JOB failed; its last log lines:"
                      # A log without a final newline would run into the next line.
                      LOG=$(kubectl logs "job/$JOB" -n "$NAMESPACE" --tail=30 2>&1); echo "$LOG"
                      FAILED="$FAILED $JOB" ;;
                    *Complete*) echo "job/$JOB complete" ;;
                    *)
                      LEFT="$LEFT $JOB"
                      RESTARTS=$(kubectl get pods -n "$NAMESPACE" -l "job-name=$JOB" -o jsonpath='{range .items[*]}{range .status.containerStatuses[*]}{.restartCount}{"\n"}{end}{end}' 2>/dev/null | awk '{ n += $1 } END { print n + 0 }')
                      case " $SEEN " in
                        *" $JOB=$RESTARTS "*) ;;
                        *)
                          if [ "$RESTARTS" -gt 0 ]; then
                            echo "job/$JOB restarted $RESTARTS time(s); its last log lines:"
                            POD=$(kubectl get pods -n "$NAMESPACE" -l "job-name=$JOB" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
                            # The previous run's log is not always kept on the node; every run fails the
                            # same way, so the current one's log shows the cause too.
                            if [ -n "$POD" ]; then
                              LOG=$(kubectl logs "$POD" -n "$NAMESPACE" --previous --tail=15 2>/dev/null) \
                                || LOG=$(kubectl logs "$POD" -n "$NAMESPACE" --tail=15 2>&1)
                              echo "$LOG"
                            fi
                          fi
                          SEEN="$(echo " $SEEN " | sed "s| $JOB=[0-9]* | |") $JOB=$RESTARTS" ;;
                      esac ;;
                  esac
                done
                PENDING="${LEFT# }"
                [ -z "$PENDING" ] || sleep 5
              done
              [ -z "$FAILED" ] || { echo "setup_configuration failed:$FAILED"; exit 1; }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
