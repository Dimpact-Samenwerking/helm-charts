{{- /*
  Static seal for OpenBao, rendered from .Values.openbao.seal.static.*.

  Renders only when openbao.enabled and seal.static.key are both set. Carries
  `seal.hcl` (the `seal "static"` stanza, loaded by the server as a second
  -config directory) and the key itself as a file, which the stanza references
  with file:// so the key stays out of the HCL, the pod spec and the process
  environment. The mounts are in values: openbao.server.volumes/volumeMounts.

  The key is supplied by the deploy pipeline (ExternalsPodiumD application.yml
  substitutes REP_OPENBAO_SEAL_KEY_REP from Azure Key Vault); never commit a
  real key here. Key format is checked in validations.yaml.
*/}}
{{- if and .Values.openbao.enabled .Values.openbao.seal.static.key }}
{{- $s := .Values.openbao.seal.static }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $s.secretName | quote }}
  labels:
    {{- include "podiumd.labels" . | nindent 4 }}
    app.kubernetes.io/component: openbao
type: Opaque
stringData:
  seal.hcl: |
    seal "static" {
      current_key_id = {{ $s.keyId | toString | quote }}
      current_key    = "file:///openbao/seal-key/key"
      {{- if $s.previousKey }}
      previous_key_id = {{ $s.previousKeyId | toString | quote }}
      previous_key    = "file:///openbao/seal-key/previous-key"
      {{- end }}
    }
  key: {{ $s.key | quote }}
  {{- if $s.previousKey }}
  previous-key: {{ $s.previousKey | quote }}
  {{- end }}
{{- end }}
