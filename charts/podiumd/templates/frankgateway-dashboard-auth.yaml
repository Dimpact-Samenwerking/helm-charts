{{- if .Values.frankgateway.enabled }}
{{- /*
  Keycloak SSO chain in front of each Frank!Gateway dashboard:

    https://<dashboard.auth.hostname>
      -> oauth2-proxy   (Keycloak OIDC; the only login the user sees)
        -> frankgateway-shim  (nginx: auto-logs into the dashboard server-side
                               and injects the dashboard JWT, so the built-in
                               dashboard login never surfaces)
          -> frankgateway-dashboard (apisix-dashboard manager-api)

  One chain per enabled instance: each dashboard binds a single etcd prefix, so
  a split deployment needs its own hostname, OIDC client and redirect URI per
  traffic class.

  The OIDC client secret is mirrored from keycloak-podiumd-realm-secrets
  (key <client>-oidc-secret) so Keycloak and oauth2-proxy share it. The Keycloak
  session is kept server-side in redis: Keycloak id+refresh tokens overflow
  cookie storage (chunked cookies drop behind NGF -> login loops -> colliding
  code redemptions -> invalid_grant).
*/ -}}
{{- $root := . }}
{{- /*
  Guard: two instances must not share a dashboard hostname.

  `hostname` sits in the shared block, so an instance that does not override it
  INHERITS it — which silently renders two oauth2-proxy Deployments and two
  ingress routes claiming the same host. Whichever the ingress resolves last
  wins, so one dashboard shows another class's routes, and the split looks
  broken in a way that points at etcd rather than at values. Fail instead.
*/ -}}
{{- $seenHosts := dict }}
{{- range $key, $override := .Values.frankgateway.instances }}
{{- $inst := include "podiumd.frankgateway.instanceValues" (dict "root" $root "key" $key "override" $override) | fromYaml }}
{{- if and $inst.enabled $inst.dashboard.enabled $inst.dashboard.auth.enabled }}
{{- $h := $inst.dashboard.auth.hostname | default "" }}
{{- if ne $h "" }}
{{- if hasKey $seenHosts $h }}
{{-   fail (printf "frankgateway: instances '%s' and '%s' both use dashboard.auth.hostname '%s'. Each instance needs its own hostname (its dashboard binds one etcd prefix, so a shared host would serve one class's routes under both names). Give every enabled instance its own frankgateway.instances.<class>.dashboard.auth.hostname, or set dashboard.auth.enabled=false on the ones you only need for debugging." (get $seenHosts $h) $key $h) }}
{{- end }}
{{- $_ := set $seenHosts $h $key }}
{{- end }}
{{- end }}
{{- end }}
{{- range $key, $override := .Values.frankgateway.instances }}
{{- $fg := include "podiumd.frankgateway.instanceValues" (dict "root" $root "key" $key "override" $override) | fromYaml }}
{{- if and $fg.enabled $fg.dashboard.enabled $fg.dashboard.auth.enabled }}
{{- $auth := $fg.dashboard.auth }}
{{- $name := include "podiumd.frankgateway.instanceName" (dict "key" $key "instance" $fg) }}
{{- $clientId := include "podiumd.frankgateway.oidcClientId" (dict "key" $key) }}
{{- $hostname := $auth.hostname | default "" }}
{{- if eq $hostname "" }}
{{-   fail (printf "frankgateway.instances.%s.dashboard.auth.hostname is required when dashboard.auth.enabled is true (e.g. frankgateway-%s-admin.<env>.<domain>). For a dashboard you only need while debugging, set dashboard.auth.enabled=false instead — that needs no hostname, no certificate SAN and no Keycloak client, and you reach it with: kubectl -n <ns> port-forward deploy/%s-dashboard 9000:9000" $key $key $key) }}
{{- end }}
{{- $realm := $root.Values.keycloak.config.realm }}
{{- $realmUrl := $root.Values.keycloak.config.realmFrontendUrl | trimSuffix "/" }}
{{- $issuer := printf "%s/realms/%s" $realmUrl $realm }}
{{- $redirect := printf "https://%s/oauth2/callback" $hostname }}
{{- $redisUrl := $auth.sessionRedisUrl | default (printf "redis://redis-ha-master.%s.svc.cluster.local:6379/3" $root.Release.Namespace) }}
{{- $creds := include "podiumd.frankgateway.dashboardCreds" (dict "root" $root "instance" $fg "name" $name) | fromYaml }}
{{- $clientSecret := "" }}
{{- $existingRealm := lookup "v1" "Secret" $root.Release.Namespace "keycloak-podiumd-realm-secrets" }}
{{- with $existingRealm }}
{{-   $clientSecret = index .data (printf "%s-oidc-secret" $clientId) | default "" | b64dec }}
{{- end }}
{{- if eq $clientSecret "" }}
{{- /* keycloak-podiumd-realm-secrets is rendered in this same release — same
       lookup-or-generate logic keeps first-install ordering safe. */ -}}
{{-   $clientSecret = randAlphaNum 32 }}
{{- end }}
{{- $cookieSecret := "" }}
{{- $existingProxy := lookup "v1" "Secret" $root.Release.Namespace (printf "%s-oauth2-proxy" $name) }}
{{- with $existingProxy }}
{{-   $cookieSecret = index .data "cookie-secret" | default "" | b64dec }}
{{- end }}
{{- if eq $cookieSecret "" }}
{{-   $cookieSecret = randAlphaNum 32 }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-oauth2-proxy
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "podiumd.labels" $root | nindent 4 }}
    app.kubernetes.io/component: frankgateway-oauth2-proxy
type: Opaque
stringData:
  client-secret: {{ $clientSecret | quote }}
  cookie-secret: {{ $cookieSecret | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-shim
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "podiumd.labels" $root | nindent 4 }}
    app.kubernetes.io/component: frankgateway-shim
    app.kubernetes.io/name: {{ $name }}-shim
spec:
  replicas: {{ $auth.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}-shim
  template:
    metadata:
      labels:
        {{- include "podiumd.labels" $root | nindent 8 }}
        app.kubernetes.io/component: frankgateway-shim
        app.kubernetes.io/name: {{ $name }}-shim
      annotations:
        checksum/shim-conf: {{ include "podiumd.frankgateway.shimConf" (dict "root" $root "instance" $fg "name" $name "adminPassword" $creds.adminPassword) | sha256sum }}
    spec:
      topologySpreadConstraints:
        {{- include "podiumd.frankgateway.spread" (dict "name" (printf "%s-shim" $name) "override" $fg.topologySpreadConstraints) | nindent 8 }}
      containers:
        - name: nginx
          image: "{{ $auth.shim.image.repository }}:{{ $auth.shim.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml $auth.shim.resources | nindent 12 }}
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: conf
          secret:
            secretName: {{ $name }}-shim
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-shim
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "podiumd.labels" $root | nindent 4 }}
    app.kubernetes.io/component: frankgateway-shim
    app.kubernetes.io/name: {{ $name }}-shim
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}-shim
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-oauth2-proxy
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "podiumd.labels" $root | nindent 4 }}
    app.kubernetes.io/component: frankgateway-oauth2-proxy
    app.kubernetes.io/name: {{ $name }}-oauth2-proxy
spec:
  replicas: {{ $auth.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}-oauth2-proxy
  template:
    metadata:
      labels:
        {{- include "podiumd.labels" $root | nindent 8 }}
        app.kubernetes.io/component: frankgateway-oauth2-proxy
        app.kubernetes.io/name: {{ $name }}-oauth2-proxy
    spec:
      topologySpreadConstraints:
        {{- include "podiumd.frankgateway.spread" (dict "name" (printf "%s-oauth2-proxy" $name) "override" $fg.topologySpreadConstraints) | nindent 8 }}
      containers:
        - name: oauth2-proxy
          image: "{{ $auth.oauth2Proxy.image.repository }}:{{ $auth.oauth2Proxy.image.tag }}"
          imagePullPolicy: IfNotPresent
          args:
            - --provider=oidc
            - --oidc-issuer-url={{ $issuer }}
            - --client-id={{ $clientId }}
            - --redirect-url={{ $redirect }}
            - --upstream=http://{{ $name }}-shim:8080
            - --http-address=0.0.0.0:4180
            - --email-domain=*
            - --scope=openid profile email
            - --cookie-secure=true
            - --skip-provider-button=true
            - --whitelist-domain={{ $hostname }}
            - --reverse-proxy=true
            - --session-store-type=redis
            - --redis-connection-url={{ $redisUrl }}
            - --cookie-csrf-per-request=true
            - --cookie-samesite=lax
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}-oauth2-proxy
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}-oauth2-proxy
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml $auth.oauth2Proxy.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-oauth2-proxy
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "podiumd.labels" $root | nindent 4 }}
    app.kubernetes.io/component: frankgateway-oauth2-proxy
    app.kubernetes.io/name: {{ $name }}-oauth2-proxy
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}-oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: 4180
{{- end }}
{{- end }}
{{- end }}
