{{- if .Values.frankgateway.enabled }}
{{- /*
  Admin API credentials + APISIX config.yaml for Frank!Gateway, one pair of
  Secrets per enabled instance.

  Both Secrets are rendered from THIS single template because the config.yaml
  embeds the admin/viewer keys inline: computing the keys once (in
  podiumd.frankgateway.adminCreds) and reusing the variables guarantees the
  credentials Secret and the config file can never diverge within a render.
  (That is also why the config is a Secret, not a ConfigMap.)

  Keys: values override (admin.adminKey/viewerKey, shared or per-instance) wins;
  otherwise random 32-char values are generated on first install and kept stable
  across upgrades via lookup — the upstream public default keys (edd1c9f0… /
  4054f7cf…) are never used.

  Instances share one etcd; each config points at its own prefix, which is what
  keeps their routes, consumers and SSL objects isolated.
*/ -}}
{{- $root := . }}
{{- range $key, $override := .Values.frankgateway.instances }}
{{- $fg := include "podiumd.frankgateway.instanceValues" (dict "root" $root "key" $key "override" $override) | fromYaml }}
{{- if $fg.enabled }}
{{- $name := include "podiumd.frankgateway.instanceName" (dict "key" $key "instance" $fg) }}
{{- $prefix := include "podiumd.frankgateway.etcdPrefix" (dict "key" $key "instance" $fg) }}
{{- $creds := include "podiumd.frankgateway.adminCreds" (dict "root" $root "instance" $fg "name" $name) | fromYaml }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-admin-credentials
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "podiumd.labels" $root | nindent 4 }}
    app.kubernetes.io/component: frankgateway
type: Opaque
stringData:
  admin: {{ $creds.admin | quote }}
  viewer: {{ $creds.viewer | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-config
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "podiumd.labels" $root | nindent 4 }}
    app.kubernetes.io/component: frankgateway
type: Opaque
stringData:
  config.yaml: |
{{ regexReplaceAll "(?m)[ \t]+$" (include "podiumd.frankgateway.config" (dict "root" $root "instance" $fg "name" $name "prefix" $prefix "admin" $creds.admin "viewer" $creds.viewer) | indent 4) "" }}
{{- end }}
{{- end }}
{{- end }}
