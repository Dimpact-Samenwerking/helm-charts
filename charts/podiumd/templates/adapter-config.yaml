{{- if .Values.kiss.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: adapter-config
  labels:
    {{- include "podiumd.labels" . | nindent 4 }}
data:
  {{- range $index, $contactverzoektype := .Values.kiss.adapter.esuite.contactverzoektypen }}
  {{ printf "CONTACTVERZOEK_TYPES__%d" $index }}: {{ $contactverzoektype | quote }}
  {{- end  }}
  ESUITE_BASE_URL: {{ .Values.kiss.adapter.esuite.baseUrl | quote }}
  {{- /* H.7: both fall back to the merged "objecten" in-cluster host post-merge. */}}
  INTERNE_TAAK_OBJECT_TYPE_URL: {{ printf "%s/api/v2/objecttypes/%s" (default (printf "http://objecten.%s.svc.cluster.local" .Release.Namespace) .Values.kiss.adapter.objecten.baseUrlIntern) .Values.kiss.adapter.objecten.interneTaakUUID | quote }}
  SMOELENBOEK_BASE_URL: {{ default (printf "http://objecten.%s.svc.cluster.local" .Release.Namespace) .Values.kiss.adapter.objecten.baseUrl | quote }}
  SMOELENBOEK_OBJECT_TYPE_URL: {{ printf "%s/api/v2/objecttypes/%s" .Values.kiss.adapter.objecten.baseUrlExtern .Values.kiss.adapter.objecten.medewerkerUUID | quote }}
{{- end }}
