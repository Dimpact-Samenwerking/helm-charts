{{- if (index .Values "keycloak-operator").enabled }}
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: {{ default "keycloak" .Values.keycloak.name }}
spec:
  instances: {{ .Values.keycloak.instances }}
  {{- /* Auto first runs an update Job with the running image to check whether old and
       new can run side by side. Across a major or minor version that check cannot
       pass (the operator recreates Keycloak anyway), and on the 26.7 -> 26.8 hop
       the Job itself fails and stays behind as a failed Job. So when the running
       Keycloak (lookup; empty in a render without a cluster) has another
       major.minor than the new image, use RecreateOnImageChange for this deploy:
       the same recreate, without the update Job. */}}
  {{- $update := deepCopy (.Values.keycloak.update | default dict) }}
  {{- if eq (toString $update.strategy) "Auto" }}
  {{- $running := lookup "k8s.keycloak.org/v2beta1" "Keycloak" .Release.Namespace (default "keycloak" .Values.keycloak.name) }}
  {{- $oldVersion := regexFind "[0-9]+\\.[0-9]+" (regexFind ":[0-9]+\\.[0-9]+\\.[0-9]+" (toString (dig "spec" "image" "" ($running | default dict)))) }}
  {{- $newVersion := regexFind "^[0-9]+\\.[0-9]+" (toString .Values.keycloak.image.tag) }}
  {{- if and $oldVersion $newVersion (ne $oldVersion $newVersion) }}
  {{- $_ := set $update "strategy" "RecreateOnImageChange" }}
  {{- end }}
  {{- end }}
  {{- with $update }}
  update:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  image: {{ include "podiumd.image" .Values.keycloak.image }}
  # With spec.image set the operator starts Keycloak with --optimized, which
  # needs a pre-built image. The stock image is not, so Keycloak builds at
  # start. A build in an init container instead breaks the operator's update
  # Job, which runs the old image over the new image's build.
  startOptimized: false
  {{- if (index .Values "keycloak-operator").enabled }}
  bootstrapAdmin:
    user:
      secret: keycloak-podiumd-admin
  {{- end }}
  hostname:
    {{- if .Values.keycloak.hostname.useRealmFrontendUrl }}
    hostname: {{ coalesce .Values.keycloak.hostname.hostname .Values.keycloak.config.realmFrontendUrl .Values.keycloak.config.adminFrontendUrl }}
    {{- else }}
    hostname: {{ coalesce .Values.keycloak.hostname.hostname .Values.keycloak.config.adminFrontendUrl }}
    {{- end }}
    admin: {{ coalesce .Values.keycloak.hostname.admin .Values.keycloak.config.adminFrontendUrl }}
  http:
    httpEnabled: {{ .Values.keycloak.http.httpEnabled }}
  proxy:
    headers: {{ .Values.keycloak.proxy.headers }}
  {{- with .Values.keycloak.features.enabled }}
  features:
    enabled:
    {{- range . }}
    - {{ . }}
    {{- end }}
  {{- end }}
  db:
    {{- include "podiumd.keycloak.db" . | nindent 4 }}
  ingress:
    enabled: {{ .Values.keycloak.ingress.enabled }}
  {{- $np := .Values.networkPolicies | default dict }}
  {{- if and $np.enabled ($np.namespaceIsolation | default dict).enabled }}
  {{- $kcFrom := (.Values.keycloak.networkPolicy | default dict).extraFrom | default dict }}
  # Under namespace isolation the operator's own NetworkPolicy gets the same
  # peers, so 8080/8443/9000 are no longer open to the whole cluster.
  networkPolicy:
    enabled: true
    http:
      {{- include "podiumd.networkPolicy.keycloakPeers" (dict "np" $np "port" "http" "extra" $kcFrom.http) | nindent 6 }}
    https:
      {{- include "podiumd.networkPolicy.keycloakPeers" (dict "np" $np "port" "http" "extra" $kcFrom.http) | nindent 6 }}
    management:
      {{- include "podiumd.networkPolicy.keycloakPeers" (dict "np" $np "port" "management" "extra" $kcFrom.management) | nindent 6 }}
  {{- end }}
  {{- if .Values.keycloak.resources }}
  resources:
{{ toYaml .Values.keycloak.resources | indent 4 }}
  {{- end }}
  {{- with .Values.keycloak.serviceMonitor }}
  serviceMonitor:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  additionalOptions:
  {{- range .Values.keycloak.additionalOptions }}
    - name: {{ .name }}
      value: {{ .value | quote }}
  {{- end }}
  unsupported:
    podTemplate:
      metadata:
        labels:
{{ toYaml .Values.keycloak.podTemplate.metadata.labels | indent 10 }}
        {{ with .Values.keycloak.podTemplate.metadata.annotations }}
        annotations:
{{ toYaml . | indent 10 }}
        {{ end }}
      spec:
        securityContext:
{{ toYaml .Values.keycloak.podTemplate.spec.securityContext | indent 10 }}
        affinity:
{{ toYaml .Values.keycloak.podTemplate.spec.affinity | indent 10 }}
        # nodeSelector support: prefer .Values.keycloak.nodeSelector then fallback to .Values.nodeSelector
{{- if .Values.keycloak.nodeSelector }}
        nodeSelector:
{{ toYaml .Values.keycloak.nodeSelector | indent 10 }}
{{- else if .Values.nodeSelector }}
        nodeSelector:
{{ toYaml .Values.nodeSelector | indent 10 }}
{{- end }}
        containers:
{{- if .Values.keycloak.podTemplate.spec.containers }}
{{ toYaml .Values.keycloak.podTemplate.spec.containers | indent 8 }}
{{- else }}
          - name: keycloak
{{- if .Values.keycloak.resources }}
            resources:
{{ toYaml .Values.keycloak.resources | indent 14 }}
{{- end }}
{{- end }}
{{- end }}
