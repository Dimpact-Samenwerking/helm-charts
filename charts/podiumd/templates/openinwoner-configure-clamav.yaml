{{/*
Open Inwoner's ClamAV fields (enable_virus_scan/clamav_host/clamav_port/
clamav_timeout) live on the SiteConfiguration singleton, but upstream's
SiteConfigurationStep (open_inwoner/configurations/bootstrap/siteconfig.py)
never manages them — they're absent from both its required_settings and
optional_settings lists, so setting them under configuration.data.site_config
is silently ignored regardless of site_config_enable. This Job seeds them
directly through `manage.py shell`, using the app's own image so Django
settings/DB env vars line up exactly with the running app.

SiteConfiguration.clean() only checks clamav_host is non-empty when
enable_virus_scan=True — it does not ping clamd (unlike Open Forms'
GlobalConfiguration.clean()) — so this script does that check itself via
clamd.ClamdNetworkSocket(...).ping(), exiting non-zero if ClamAV isn't
reachable yet and relying on the Job's backoffLimit/activeDeadlineSeconds to
retry until both ClamAV and the openinwoner DB migrations are ready — same
"eventually consistent, plain Job" approach as
openformulieren-configure-clamav.yaml and the create-required-*.yaml jobs
elsewhere in this chart.

Writes with save(update_fields=[...]) rather than full_clean()/save() to
avoid tripping model-wide validators on unrelated SiteConfiguration fields
this job doesn't touch (SiteConfiguration has ~70 fields, several required).
*/}}
{{- if and (or .Values.openinwoner.enabled (not (hasKey .Values.openinwoner "enabled"))) .Values.openinwoner.clamavConfigJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: openinwoner-configure-clamav
  labels:
    {{- include "podiumd.labels" . | nindent 4 }}
    app.kubernetes.io/component: openinwoner
spec:
  backoffLimit: {{ .Values.openinwoner.clamavConfigJob.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.openinwoner.clamavConfigJob.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.openinwoner.clamavConfigJob.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "podiumd.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: openinwoner
    spec:
      serviceAccountName: {{ include "podiumd.serviceAccountName" . }}
      restartPolicy: OnFailure
      {{- if .Values.openinwoner.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.openinwoner.nodeSelector | nindent 8 }}
      {{- else if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      containers:
        - name: configure-clamav
          image: {{ include "podiumd.image" .Values.openinwoner.image }}
          imagePullPolicy: {{ .Values.openinwoner.image.pullPolicy | default "IfNotPresent" }}
          command: ["/app/src/manage.py"]
          args:
            - shell
            - -c
            - |
              import clamd
              from open_inwoner.configurations.models import SiteConfiguration

              config = SiteConfiguration.get_solo()
              config.enable_virus_scan = True
              config.clamav_host = {{ .Values.openinwoner.clamavConfigJob.clamavHost | quote }}
              config.clamav_port = {{ .Values.openinwoner.clamavConfigJob.clamavPort }}
              config.clamav_timeout = {{ .Values.openinwoner.clamavConfigJob.clamavTimeout }}

              scanner = clamd.ClamdNetworkSocket(
                  host=config.clamav_host,
                  port=config.clamav_port,
                  timeout=config.clamav_timeout,
              )
              try:
                  pong = scanner.ping()
              except Exception as exc:
                  raise SystemExit(f"Cannot connect to ClamAV: {exc}")
              if pong != "PONG":
                  raise SystemExit(f"Unexpected ClamAV ping response: {pong!r}")

              config.save(
                  update_fields=[
                      "enable_virus_scan",
                      "clamav_host",
                      "clamav_port",
                      "clamav_timeout",
                  ]
              )
              print("ClamAV virus scan configuration applied.")
          envFrom:
            - secretRef:
                name: openinwoner
            - configMapRef:
                name: openinwoner
          resources:
            {{- toYaml .Values.openinwoner.clamavConfigJob.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.openinwoner.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
