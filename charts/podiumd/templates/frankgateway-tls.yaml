{{- if .Values.frankgateway.enabled }}
{{- /*
  Data-plane certificate for the re-encrypted hop (NGF -> gateway :9443).

  Two objects, because the certificate existing is not the same as the gateway
  serving it:

  1. cert-manager Certificate — issues it and renews it on schedule, instead of
     someone installing it by hand at build time with nothing watching the
     expiry date afterwards.
  2. A CronJob that PUTs the current material into etcd as an APISIX SSL
     object. APISIX in traditional mode does not read certificate files; it
     serves per-SNI certificates from etcd. A renewed Secret therefore changes
     nothing on its own — and cert-manager renews weeks after a deploy, so the
     post-install Job cannot be what carries it either. Without this CronJob,
     automatic renewal produces a valid Secret and an expired gateway.

  The routes Job runs the same script at deploy time, so a fresh install serves
  TLS immediately rather than waiting for the first CronJob tick.
*/ -}}
{{- $root := . }}
{{- $cmShared := .Values.frankgateway.tls.certManager }}
{{- /*
  Whether to create the shared Issuer is decided from the MERGED per-instance
  values, not from the top-level block. `issuer.create` is a supported
  per-instance override, and validations.yaml and the Certificate's issuerRef
  both read the merged value: gating this on the unmerged one lets an instance
  pass validation, reference an Issuer that was never created, and never get a
  certificate.
*/ -}}
{{- $issuerWanted := false }}
{{- range $key, $override := .Values.frankgateway.instances }}
{{- $inst := include "podiumd.frankgateway.instanceValues" (dict "root" $root "key" $key "override" $override) | fromYaml }}
{{- if and $inst.enabled $inst.tls.enabled $inst.tls.certManager.enabled $inst.tls.certManager.issuer.create }}
{{- $issuerWanted = true }}
{{- end }}
{{- end }}
{{- if $issuerWanted }}
{{- /*
  One OpenBao-backed Issuer for the whole namespace: the three classes want
  certificates from the same CA, and an Issuer holds no per-instance state.

  cert-manager exchanges a ServiceAccount token for a short-lived OpenBao
  token on each issuance, so no static credential is stored anywhere. The
  OpenBao side (pki engine, role, kubernetes auth binding) is set up once per
  environment — commands in frankgateway-BASICS.md.
*/ -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $cmShared.issuer.kubernetes.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "podiumd.labels" . | nindent 4 }}
    app.kubernetes.io/component: frankgateway
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: frankgateway-openbao
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "podiumd.labels" . | nindent 4 }}
    app.kubernetes.io/component: frankgateway
spec:
  vault:
    server: {{ $cmShared.issuer.server | default (printf "http://%s-openbao-active:8200" .Release.Name) | quote }}
    path: {{ $cmShared.issuer.path | quote }}
    {{- with $cmShared.issuer.caBundleSecretRef }}
    caBundleSecretRef:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    auth:
      kubernetes:
        role: {{ $cmShared.issuer.kubernetes.role | quote }}
        mountPath: {{ $cmShared.issuer.kubernetes.mountPath | quote }}
        serviceAccountRef:
          name: {{ $cmShared.issuer.kubernetes.serviceAccountName }}
{{- end }}
{{- range $key, $override := .Values.frankgateway.instances }}
{{- $fg := include "podiumd.frankgateway.instanceValues" (dict "root" $root "key" $key "override" $override) | fromYaml }}
{{- if and $fg.enabled $fg.tls.enabled }}
{{- $name := include "podiumd.frankgateway.instanceName" (dict "key" $key "instance" $fg) }}
{{- $secretName := include "podiumd.frankgateway.tlsSecretName" (dict "instance" $fg "name" $name) }}
{{- if $fg.tls.certManager.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $name }}-tls
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "podiumd.labels" $root | nindent 4 }}
    app.kubernetes.io/component: frankgateway
    app.kubernetes.io/name: {{ $name }}
spec:
  secretName: {{ $secretName }}
  duration: {{ $fg.tls.certManager.duration | quote }}
  # Renewal starts this far ahead of expiry, so a failing issuer is visible for
  # weeks before it can cause an outage.
  renewBefore: {{ $fg.tls.certManager.renewBefore | quote }}
  privateKey:
    rotationPolicy: Always
  issuerRef:
    {{- include "podiumd.frankgateway.certIssuerRef" (dict "instance" $fg) | nindent 4 }}
  dnsNames:
    {{- include "podiumd.frankgateway.certDnsNames" (dict "root" $root "instance" $fg "name" $name) | nindent 4 }}
{{- end }}
{{- if $fg.tls.sslSync.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-ssl-sync
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "podiumd.labels" $root | nindent 4 }}
    app.kubernetes.io/component: frankgateway-ssl-sync
data:
  sync.sh: |
{{ include "podiumd.frankgateway.sslSyncScript" (dict "root" $root "instance" $fg "name" $name) | indent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}-ssl-sync
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "podiumd.labels" $root | nindent 4 }}
    app.kubernetes.io/component: frankgateway-ssl-sync
spec:
  schedule: {{ $fg.tls.sslSync.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ $fg.tls.sslSync.successfulJobsHistoryLimit }}
  # Keep more failures than successes: a silent renewal failure is the thing
  # this whole mechanism exists to prevent, so its evidence outlives its cause.
  failedJobsHistoryLimit: {{ $fg.tls.sslSync.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            {{- include "podiumd.labels" $root | nindent 12 }}
            app.kubernetes.io/component: frankgateway-ssl-sync
        spec:
          restartPolicy: Never
          containers:
            - name: sync
              image: {{ include "podiumd.image" $fg.seed.job.image }}
              imagePullPolicy: IfNotPresent
              env:
                - name: ADMIN_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ $name }}-admin-credentials
                      key: admin
              command: ["sh", "/scripts/sync.sh"]
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: tls
                  mountPath: /tls
                  readOnly: true
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
          volumes:
            - name: scripts
              configMap:
                name: {{ $name }}-ssl-sync
            - name: tls
              secret:
                secretName: {{ $secretName }}
                optional: true
          {{- with $fg.tls.sslSync.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
