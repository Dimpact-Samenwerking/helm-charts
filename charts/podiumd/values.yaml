# yaml-language-server: $schema=./kiss.schema.json
global:
  configuration:
    enabled: true
    overwrite: true
    organization: Example gemeente

  settings:
    databaseHost: ""

  imageRegistry: ""

  # Shared image references, reused via YAML anchors
  images:
    nginx: &nginxImage
      repository: nginxinc/nginx-unprivileged
      tag: "1.31.3@sha256:49c9bef1797e11117a7f490fd00f282e377ac402fec472c72636f90cdbf72e10"
      pullPolicy: IfNotPresent
    curl: &curlImage
      repository: curlimages/curl
      tag: "8.21.0@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13"
      pullPolicy: IfNotPresent
    busybox: &busyboxImage
      repository: library/busybox
      tag: "1.38.0-glibc@sha256:3ba030337caebbfc2232b22b1e435eb213b28e5844a34942c74555bf904a265a"
      pullPolicy: IfNotPresent

tags:
  eck-operator.enabled: false
  redis: false

persistentVolume:
  volumeAttributeShareName: ""
  volumeAttributeResourceGroup: ""
  nodeStageSecretRefName: ""
  nodeStageSecretRefNamespace: ""

keycloak-operator:
  enabled: true
  # Adfinis Helm chart wrapping the official Keycloak Operator manifests.
  # Chart: https://charts.adfinis.com / adfinis/keycloak-operator (chart 1.12.1, appVersion 26.6.4)
  # Note: it appears that the podname automatically appends -operator.
  # Official operator image: quay.io/keycloak/keycloak-operator:26.6.4
  # Note: adfinis chart 1.12.1 targets appVersion 26.6.4; operator + server image pinned to 26.6.4 below.
  # override: values-enable-observability.yaml sets enableServiceMonitor: true
  enableServiceMonitor: false
  fullnameOverride: keycloak
  operator:
    image:
      repository: quay.io/keycloak/keycloak-operator
      # IMPORTANT: do NOT embed @sha256 in this tag. Unlike podiumd's own
      # `keycloak.image` (which uses the podiumd.image helper, repository:tag),
      # the adfinis subchart appends its own digest from a SEPARATE `operator.image.sha`
      # field: `repository:tag@sha256:{{ .sha }}`. Putting @sha256 in the tag
      # produces an invalid DOUBLE digest (…:26.6.4@sha256:xxx@sha256:xxx).
      # The chart's default operator.image.sha already pins the matching 26.6.4
      # digest (sha256:831827a0a…). To DISABLE digest pinning (e.g. on aks-blue
      # / ACR-mirror envs where the mirrored digest differs), set
      # `operator.image.sha: ""`. See docs/_UPGRADE_PATHS/4.7.3-to-4.7.4-upgrade.md.
      tag: "26.6.4"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        # IN-2233: operator OOMKilled at 256Mi limit (excessive restarts across clusters); raised to 768Mi.
        memory: 768Mi
    # Default Keycloak SERVER image the operator stamps onto Keycloak CRs it
    # provisions (RELATED_IMAGE_KEYCLOAK env on the operator Deployment). Must
    # match podiumd's own `keycloak.image` digest above. The adfinis subchart's
    # built-in default still carries the pre-PR#344 digest (sha256:5fdbf2d…), so
    # we override it here to the refreshed 26.6.4 digest (sha256:0aae0de…).
    # NOTE: sha is a SEPARATE field; the template appends it as @sha256:{{ .sha }},
    # so do NOT embed @sha256 in tag (would produce a double digest).
    config:
      keycloakImage:
        repository: quay.io/keycloak/keycloak
        tag: "26.6.4"
        sha: "0aae0de7fca85525f727d3354df17896092de8bb26ae4c12d89c77e5df8cbce4"
  serviceAccount:
    create: false
  jobs:
    # -- Keycloak URL used by the realm-import jobs (keycloak-config-cli).
    # Empty = in-cluster service (http://keycloak-service:8080). Set only when
    # the jobs must reach Keycloak via another URL; note the public admin host
    # can sit behind a gateway IP-allowlist that blocks cluster egress (403).
    keycloakUrl: ""
    ensurePodiumdAdminUser:
      enabled: true
      # Init container: Python (stdlib only, no pip install) — computes the PBKDF2 hash
      # and writes the SQL to a shared volume.
      initImage:
        registry: ""
        repository: python
        # Digest-pinned to match docs/images/images-4.8.0.yaml (python 3.14-slim).
        tag: "3.14-slim@sha256:b877e50bd90de10af8d82c57a022fc2e0dc731c5320d762a27986facfc3355c1"
      # Main container: runs psql to execute the generated SQL against the Keycloak DB.
      image:
        registry: ""
        repository: postgres
        tag: "16"
    ensureOperatorSa:
      enabled: true
      # Container: curl-based job to provision the keycloak-operator service account client.
      image: *curlImage
      # Client secret for the keycloak-operator client. Set this to a known value so Helm
      # can create the K8s secret directly. The job will enforce this secret in Keycloak.
      clientSecret: ""
    importPodiumdRealm:
      enabled: true
    importMasterRealm:
      enabled: true
    # -- Resources applied to lightweight keycloak job containers (curl, python, psql): ensure-operator-sa, ensure-podiumd-admin-user.
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    # -- Resources for the kc-config-cli containers (Spring Boot JVM app) in import-podiumd-realm and import-master-realm jobs.
    configCliResources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 512Mi

keycloak:
  additionalOptions:
    - name: health-enabled
      value: "true"
    - name: metrics-enabled
      value: "true"
    - name: cache
      value: "ispn"
    - name: cache-stack
      value: ""
  auth:
    adminUser: admin
    adminPassword: ""
  config:
    adminFrontendUrl: https://keycloak-admin.example.nl
    # Access token lifespan (seconds) for the podiumd realm. Default 60s is a
    # security hardening, but is short for BFF apps (e.g. KISS) whose silent
    # refresh can't keep up -> constant "sessie verlopen". Override per-env.
    accessTokenLifespan: 60
    # Example configuration
    #     identityProviders:
    #     - alias: "oidc-admin-users"
    #      displayName: "podiumd admin users"
    #      providerId: "oidc"
    #      enabled: true
    #      updateProfileFirstLoginMode: "on"
    #      config:
    #        tokenUrl: "https://login.microsoftonline.com/organizations/oauth2/v2.0/token"
    #        jwksUrl: "https://login.microsoftonline.com/organizations/discovery/v2.0/keys"
    #        issuer: "https://login.microsoftonline.com/{ tenantId }/v2.0"
    #        clientSecret: "{ clientSecret }"
    #        clientId: "{ clientId }"
    #        syncMode: "FORCE"
    #        userInfoUrl: "https://graph.microsoft.com/oidc/userinfo"
    #        metadataDescriptorUrl: "https://login.microsoftonline.com/organizations/v2.0/.well-known/openid-configuration"
    #        authorizationUrl: "https://login.microsoftonline.com/organizations/oauth2/v2.0/authorize"
    #        logoutUrl: "https://login.microsoftonline.com/organizations/oauth2/v2.0/logout"
    # -- identity providers for the admin realm (usually master)
    #adminIdentityProviders: {}
    # Example configuration
    #    identityProviderMappers:
    #    - name: "admin-group-mapper"
    #      identityProviderAlias: "oidc-admin-users"
    #      identityProviderMapper: "oidc-hardcoded-role-idp-mapper"
    #      config:
    #        syncMode: "FORCE"
    #        role: "admin"
    # -- identity provider mapper for the admin realm
    #adminIdentityProviderMappers: {}
    realm: podiumd
    realmDisplayName: PodiumD
    realmFrontendUrl: https://keycloak.example.nl
    # Dont include the realmIdentityProviders and realmIdentityProviderMappers by default as it overwrites currently configured entra providers for multiple gemeentes
    # realmIdentityProviders: {}
    # realmIdentityProviderMappers: {}
    skipGroups: true
    skipRoles: true
    smtp:
      server: mail.example.nl
      port: "587"
      from: "noreply@example.nl"
      fromDisplayName: "Example Gemeente"
      starttls: "true"
      ssl: "false"
    clients:
      monitoring:
        name: Monitoring (Grafana)
        enabled: true
        secret: ""
        oidcUrl: "https://monitoring.example.nl"
      datamigratie:
        name: Datamigratie
        enabled: true
        secret: ""
        oidcUrl: "https://datamigratie.example.nl"
      # zaakbrug Frank!Framework console OAuth2 client. Only rendered into the
      # podiumd realm import when zaakbrug.enabled=true. Env values supply the
      # secret (REP placeholder from Key Vault: zaakbrug-oauth-client-secret)
      # and oidcUrl (the zaakbrug ingress host).
      zaakbrug:
        name: Zaakbrug Frank!Framework console
        enabled: true
        secret: ""
        oidcUrl: "https://zaakbrug.example.nl"
  name: "keycloak"
  features:
    enabled: []
  # -- new hostname configuration for keycloak-operator, falls back to config.adminFrontendUrl if not defined
  hostname:
    hostname: ""
    admin: ""
  http:
    httpEnabled: true
  # image parameters for keycloak-operator
  # Official Keycloak image: quay.io/keycloak/keycloak:26.6.4
  image:
    registry: ""
    repository: quay.io/keycloak/keycloak
    tag: "26.6.4@sha256:0aae0de7fca85525f727d3354df17896092de8bb26ae4c12d89c77e5df8cbce4"
  # -- instances is the new operator-style replica count (falls back to replicaCount)
  instances: "2"
  ingress:
    enabled: false
  externalDatabase:
    vendor: "postgres"
    host: "postgres"
    port: 5432
    database: ""
    user: ""
    password: ""
  # -- db uses the new keycloak-operator CRD structure (falls back to externalDatabase.*)
  db:
    vendor: ""
    host: ""
    port: ""
    database: ""
    usernameSecret:
      name: ""
      key: ""
    passwordSecret:
      name: ""
      key: ""
  keycloakConfigCli:
    # image parameters for keycloak-config-cli
    # Official keycloak-config-cli image: adorsys/keycloak-config-cli:6.5.1-26
    image:
      registry: ""
      repository: adorsys/keycloak-config-cli
      tag: "6.5.1-26"
  podTemplate:
    metadata:
      labels:
        app: keycloak
        version: 26.6.4
      # override: values-enable-observability.yaml adds prometheus.io scrape annotations
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - keycloak
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: keycloak-builder
          # image is intentionally not set here - it will be automatically populated
          # by the keycloak-cr.yaml template to match the main Keycloak image version
          # (see line 69 in templates/keycloak-cr.yaml)
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          command:
            - /bin/bash
            - -c
            - |
              set -e
              export KC_DB=postgres
              export KC_PROXY_HEADERS=xforwarded
              export KC_CACHE=ispn
              export KC_METRICS_ENABLED=true
              export KC_HEALTH_ENABLED=true
              /opt/keycloak/bin/kc.sh build
              rm -rf /opt/keycloak/build/quarkus /opt/keycloak/build/providers
              mkdir -p /opt/keycloak/build/quarkus /opt/keycloak/build/providers
              cp -a /opt/keycloak/lib/quarkus/. /opt/keycloak/build/quarkus/
              cp -a /opt/keycloak/providers/. /opt/keycloak/build/providers/ 2>/dev/null || true
          volumeMounts:
            - name: keycloak-build-data
              mountPath: /opt/keycloak/build
              subPath: ""
      containers:
        - name: keycloak
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
              scheme: HTTP
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/started
              port: 9000
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: keycloak-build-data
              mountPath: /opt/keycloak/lib/quarkus
              subPath: quarkus
            - name: keycloak-build-data
              mountPath: /opt/keycloak/providers
              subPath: providers
      volumes:
        - name: keycloak-build-data
          emptyDir: {}
  # -- new keycloak entrypoint configuration, falls back to proxyHeaders if headers is not set
  proxy:
    headers: "xforwarded"
  resources:
    requests:
      cpu: 500m
      memory: 1700Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  secretsName: "keycloak-secrets"

redis-operator:
  enabled: true
  featureGates:
    GenerateConfigInInitContainer: true
  redisOperator:
    imageName: quay.io/opstree/redis-operator
    imageTag: "v0.25.0"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # -- Shared Redis HA cluster using the RedisReplication CRD from the OT Redis Operator.
  # When redis-operator.redis-ha.enabled is true, individual Redis subcharts per service should be disabled:
  #   servicename:
  #     tags:
  #       redis: false   # disables template references to .Subcharts.redis
  #     redis:
  #       enabled: false # prevents subchart installation
  #
  # Database allocation:
  #   objecttypen        : db 0  (cache)
  #   objecten           : db 1  (cache), db 2  (celery)
  #   opennotificaties   : db 3  (cache), db 6  (celery result backend; broker nu ook Redis i.p.v. RabbitMQ vanaf chart 2.0.0)
  #   openzaak           : db 4  (cache), db 5  (celery)
  #   openklant          : db 7  (cache), db 8  (celery)
  #   openformulieren    : db 9  (cache), db 10 (celery)
  #   openinwoner        : db 11 (cache), db 12 (celery)
  #   openarchiefbeheer  : db 13 (cache+axes), db 14 (choices + celery)
  #   referentielijsten  : db 15 (cache), db 16 (reserved — celery not yet used)
  #   openbeheer         : db 17 (cache), db 18 (reserved — celery not yet used)
  #   <future component> : db 19 (cache), db 20 (celery)
  #   db 21–31           : unallocated
  # See docs/apps/redis/redis-ha-databases.md for the full allocation table and guidance.
  redis-ha:
    enabled: true
    replicaCount: 3
    # -- Grafana/Loki `app` + `service_name` label for the redis-ha pods (IN-2060).
    # Without an explicit value the pods inherit `app.kubernetes.io/name: podiumd`
    # from the shared chart labels and show up in Grafana as "podiumd" instead of
    # "redis-ha". Set to "" to omit the override.
    serviceName: redis-ha
    image:
      registry: quay.io
      repository: opstree/redis
      tag: "v8.6.2"
    # override: values-enable-observability.yaml sets redisExporter.enabled: true
    redisExporter:
      enabled: false
      image:
        registry: quay.io
        repository: opstree/redis-exporter
        tag: "v1.82.0"
      # -- PodMonitor for the redis_exporter sidecar (port 9121).
      # Requires Prometheus Operator CRDs (monitoring.coreos.com/v1).
      # Enable via values-enable-observability.yaml.
      podMonitor:
        enabled: false
        interval: 30s
        scrapeTimeout: 10s
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: managed-csi-premiumv2
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              # -- Default storage per Redis replica. To increase, override in your environment values file.
              # Note: managed-csi-premiumv2 supports online volume expansion — patch the PVC directly after resizing:
              #   kubectl patch pvc <pvc-name> -n <namespace> -p '{"spec":{"resources":{"requests":{"storage":"8Gi"}}}}'
              storage: 2Gi
    # -- Number of Redis databases to configure. Applied via an initContainer because `databases` is a
    # startup-only parameter and the OT redis-operator does not include the additionalRedisConfig
    # ConfigMap in the main redis.conf (operator limitation in v0.24.0).
    databases: 32
    # -- Image used by the initContainer that appends `databases N` to redis.conf.
    # Override this in environments that restrict public Docker Hub pulls (e.g. point to an ACR mirror).
    initContainerImage: *busyboxImage
    # -- Resources for the initContainer that configures redis.conf.
    initContainerResources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 32Mi
    # -- Pod security context for Redis pods. fsGroup must match the redis container's GID (1000)
    # so that mounted PVC data directories are writable by the redis process.
    podSecurityContext:
      fsGroup: 1000
    redisConfig:
      # -- Optional extra redis.conf directives for runtime-configurable parameters.
      # Note: startup-only parameters (e.g. databases) will NOT take effect here due to an operator
      # limitation; use the databases field above instead.
      additionalRedisConfig: ""
    # -- CronJob that periodically reconciles redis-role labels on redis-ha pods.
    # Workaround for a known OT Redis Operator 0.24.0 bug (PR #1720, not yet released) where
    # the operator fails to apply redis-role labels after a simultaneous pod restart, leaving
    # the redis-ha-master Service with no endpoints. Runs every 2 minutes and always reconciles
    # from RedisReplication.status.masterNode — no early-exit if a label already exists.
    # Remove once a redis-operator release containing PR #1720 is available.
    labelMasterCronJob:
      enabled: true
      # Default: every 2 minutes, always on (suitable for production).
      # For test environments that are suspended outside business hours, use:
      #   schedule: "* 7-18 * * 1-5"   # every minute, Mon–Fri 07:00–18:59 only
      schedule: "*/2 * * * *"
      image:
        repository: docker.io/alpine/k8s
        tag: "1.36.2@sha256:44ef4942e171939b9c665a4a84beb80e2dcdb9a24330d4651cfdfd2e9deecc47"
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi

