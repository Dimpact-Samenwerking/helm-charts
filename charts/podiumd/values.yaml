    # Total wall-clock window in which the job is allowed to keep retrying (seconds). Default: 15 minutes.
    activeDeadlineSeconds: 900
    # Number of retries before the job is marked failed. Aligned with django-config jobs.
    backoffLimit: 10
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    e2eTestZaaktype:
      # set to false to disable automatic creation and publishing of the e2e-test zaaktype if it does not exist yet
      create: true
  settings:
    allowedHosts: openzaak-nginx.podiumd.svc.cluster.local
    email:
      port: 587
      useTLS: true
    disable2fa: false
    cache:
      default: redis-ha-master.podiumd.svc.cluster.local:6379/4
      axes: redis-ha-master.podiumd.svc.cluster.local:6379/4
    celery:
      brokerUrl: redis://redis-ha-master.podiumd.svc.cluster.local:6379/5
      resultBackendl: redis://redis-ha-master.podiumd.svc.cluster.local:6379/5
      # -- Set to debug for test/acceptance environments
      logLevel: warning
    uwsgi:
      processes: "2"
      threads: "4"
      maxRequests: "1000"
    # -- Backend for the Documenten API. Supported values: filesystem | azure_blob_storage
    documentApiBackend: filesystem
    # azureBlobStorage:
    #   accountName: ""
    #   clientSecret: ""
    #   clientId: ""
    #   tenantId: ""
    #   container: "openzaak"
    # -- Emit cloud events (requires Open Notificaties with cloud events support)
    # enableCloudEvents: false
    # notificationsSource: "openzaak"
  persistence:
    size: 10Gi
    existingClaim: openzaak
    storageClassName: podiumd-standard
  persistentVolume:
    volumeAttributeShareName: openzaak
    storageClassName: podiumd-standard
  image:
    tag: "1.27.4@sha256:f847e5148d857da07847b5d298d8d7a0b66a299fb48e02e4a28176cc09e8decf"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
  worker:
    replicaCount: 1
    livenessProbe:
      enabled: true
    maxWorkerLivenessDelta: "300"
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
  # -- Override OPENZAAK_PORT to prevent Kubernetes service-discovery injection
  # (tcp://<ip>:80) from being passed to uwsgi as the port number.
  # Since Open Zaak 1.27.3 the app reads OPENZAAK_PORT for uwsgi_port; K8s
  # auto-injects OPENZAAK_PORT=tcp://<svc-ip>:80 for the openzaak Service,
  # which uwsgi cannot parse. See https://github.com/open-zaak/open-zaak/issues/2415
  extraEnvVars:
    - name: OPENZAAK_PORT
      value: "8000"
  nameOverride: openzaak
  fullnameOverride: openzaak
  flower:
    enabled: false
  beat:
    resources:
      requests:
        cpu: 10m
        memory: 160Mi
  nginx:
    image: *nginxImage
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
  tags:
    redis: false
  # override: values-enable-observability.yaml sets disabled: false and configures the OTLP endpoint
  otel:
    disabled: true

