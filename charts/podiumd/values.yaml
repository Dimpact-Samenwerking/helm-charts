clamav:
  # override: values-enable-observability.yaml enables metrics exporter sidecar (metrics.enabled: true)
  # and ServiceMonitor (metrics.serviceMonitor.enabled: true). Supported since clamav chart v3.7.1.
  # serviceMonitor requires the Prometheus Operator CRD (monitoring.coreos.com/v1 ServiceMonitor).
  image:
    tag: "1.5.2"
  metrics:
    enabled: false
    image:
      repository: docker.io/sergeymakinen/clamav_exporter
      tag: "v2.1.3"
    serviceMonitor:
      enabled: false
  nameOverride: clamav
  fullnameOverride: clamav
  clamdConfig: |
    ###############
    # General
    ###############

    DatabaseDirectory /var/lib/clamav
    TemporaryDirectory /tmp
    LogTime yes
    # CUSTOM: Use pid file in tmp
    PidFile /tmp/clamd.pid
    LocalSocket /tmp/clamd.sock
    TCPSocket 3310
    Foreground yes
    # Reload database sequentially to avoid double memory usage (~1.2 GiB vs ~2.4 GiB)
    # Scans are briefly blocked during reload, which is acceptable
    ConcurrentDatabaseReload no
    MaxThreads 10

    ###############
    # Results
    ###############

    DetectPUA yes
    ExcludePUA NetTool
    ExcludePUA PWTool
    HeuristicAlerts yes
    Bytecode yes

    ###############
    # Scan
    ###############

    ScanPE yes
    DisableCertCheck yes
    ScanELF yes
    AlertBrokenExecutables yes
    ScanOLE2 yes
    ScanPDF yes
    ScanSWF yes
    ScanMail yes
    PhishingSignatures yes
    PhishingScanURLs yes
    ScanHTML yes
    ScanArchive yes

    ###############
    # Limits
    ###############

    MaxScanSize 150M
    MaxFileSize 100M
    # Match MaxFileSize so stream scans have the same ceiling as file scans
    StreamMaxLength 100M
    MaxRecursion 10
    MaxFiles 15000
    MaxEmbeddedPE 10M
    MaxHTMLNormalize 10M
    MaxHTMLNoTags 2M
    MaxScriptNormalize 5M
    MaxZipTypeRcg 1M
    MaxPartitions 128
    MaxIconsPE 200
    PCREMatchLimit 10000
    PCRERecMatchLimit 10000
  freshclamConfig: |
    ###############
    # General
    ###############

    DatabaseDirectory /var/lib/clamav
    PidFile /tmp/freshclam.pid
    # CUSTOM: Set defined user
    DatabaseOwner 2000

    ###############
    # Updates
    ###############

    DatabaseMirror database.clamav.net
    ScriptedUpdates yes
    NotifyClamd /etc/clamav/clamd.conf
    Bytecode yes
  persistentVolume:
    enabled: true
    size: 2Gi
    storageClass: managed-csi
  # The chart hardcodes the clamav-data volume mount at /data, but the official clamav/clamav
  # entrypoint checks /var/lib/clamav/main.cvd to decide whether to run freshclam synchronously
  # before starting clamd (cold-start bootstrap). By also mounting the PVC at /var/lib/clamav,
  # the entrypoint correctly waits for freshclam on first boot with an empty volume.
  extraVolumeMounts:
    - name: clamav-data
      mountPath: /var/lib/clamav
  startupProbe:
    initialDelaySeconds: 60
    periodSeconds: 30
    # Cold start loads 3.2M signatures from disk; first boot can take >3 min before page cache is warm.
    # 60 + (9-1)*30 = 300s = 5 min total allowance.
    failureThreshold: 9
    timeoutSeconds: 5
  resources:
    requests:
      cpu: 250m
      memory: 2Gi
    limits:
      cpu: 1000m
      memory: 3Gi

apiproxy:
  enabled: false
  replicaCount: 1
  imagePullSecrets: []
  nodeSelector: {}
  affinity: {}
  tolerations: []
  image: *nginxImage
  service:
    port: 80
    containerPort: 8080
  resources:
    limits:
      cpu: "0.5"
      memory: "256Mi"
    requests:
      cpu: "0.1"
      memory: "128Mi"
  # -- Secret containing client certificate (`client.crt`/`client.key`) and CA bundle (`ca.crt`)
  # for upstream mTLS. Leave empty to disable mTLS and skip the cert volume mount.
  # When set, `sslVerify` auto-derives to "on"; when empty it auto-derives to "off".
  nginxCertsSecret: ""
  # -- Maximum length of the upstream server certificate chain validated by nginx
  # (`proxy_ssl_verify_depth`). Government API gateways occasionally chain through
  # cross-signed intermediates; the nginx default of 1 is too shallow.
  # Per-location overrides: set `apiproxy.locations.<loc>.sslVerifyDepth` to override
  # this global value for a single upstream (e.g. bag, brp, kvkSearch).
  sslVerifyDepth: 6
  # -- nginx error_log level (debug|info|notice|warn|error|crit|alert|emerg).
  # "debug" logs full request/response headers (incl. injected API keys/toepassing
  # headers) and is very high-volume — use only for short-lived troubleshooting,
  # never leave enabled given the BRP/citizen-data traffic this proxy carries.
  errorLogLevel: notice
  livenessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
  resolverIp: 10.0.0.10 # KubeDNS resolver
  locations:
    commonSettings: &commonLocation
      sslVerify: "" # Leave empty to auto-derive from nginxCertsSecret (on if set, off if not); override per-location if needed
      hostHeader: "lab.api.mijniconnect.nl"
    bag:
      <<: *commonLocation
      path: /lvbag/individuelebevragingen/v2/
      targetUrl: "https://lab.api.mijniconnect.nl/iconnect/apibagib/v2/"
      # BAG URL rewriting in response bodies - replaces external URLs with internal proxy URLs
      urlRewrite:
        enabled: false # Set to true to enable response URL rewriting
        # The internal URL that will be used in rewritten responses
        # Should be the public-facing URL where this api-proxy is accessible
        internalUrl: "http://api-proxy/lvbag/individuelebevragingen/v2/"
    brp:
      <<: *commonLocation
      path: /haalcentraal/api/brp/
      targetUrl: "https://lab.api.mijniconnect.nl/iconnect/apihcbrp/actueel/prtcl/v2/"
      toepassingHeaderName: "" # empty = no header is added, for iConnect use "X-Toepassing"
      toepassingDefaultValue: "" # value for header for 1 PodiumD application can be set as default
    kvkSearch:
      <<: *commonLocation
      targetUrl: "https://lab.api.mijniconnect.nl/iconnect/apikvk/zoeken/v2/zoeken"
    kvkBasic:
      <<: *commonLocation
      targetUrl: "https://lab.api.mijniconnect.nl/iconnect/apikvk/basprof/v1/v1/basisprofielen"
    kvkBranch:
      <<: *commonLocation
      targetUrl: "https://lab.api.mijniconnect.nl/iconnect/apikvk/vesprof/v1/v1/vestigingsprofielen"

