    oidcUrl: https://openinwoner.example.nl
    # -- Enable PKCE (S256) on the Keycloak client. Requires mozilla_django_oidc >= 4.0.0 and oidc_use_pkce: true in configuration.data.
    pkceEnabled: false
  settings:
    allowedHosts: openinwoner-nginx.podiumd.svc.cluster.local
    brpVersion: ""
    digidMock: ""
    eherkenningMock: ""
    email:
      port: 587
      useTLS: true
    searchIndexInitContainer: true
    oidcFrontendLogoutWithHints: true
    # -- New in openinwoner 2.3.0 (chart 2.2.0): runs an init container executing
    # `manage.py cms4_migration` for the Django CMS v3 → v4 migration. Keep true for
    # the first rollout to 2.3.0 so the one-time migration runs; flip to false in a
    # follow-up release once every environment has completed it. Re-running is a no-op.
    cms4MigrationInitContainer: true
    # -- New in openinwoner 2.3.0: per-request timeout (seconds) for cached ZGW zaken.
    # Empty uses the application default (300s, raised from 60s upstream).
    cacheZgwZakenTimeout: ""
    # -- New in openinwoner 2.3.0: Celery queue for cache-seeding tasks. Empty defaults
    # to the low-latency worker queue (see lowLatencyWorker below).
    cacheSeedingQueue: ""
    cache:
      default: redis-ha-master.podiumd.svc.cluster.local:6379/11
      axes: redis-ha-master.podiumd.svc.cluster.local:6379/11
    celery:
      brokerUrl: redis://redis-ha-master.podiumd.svc.cluster.local:6379/12
      resultBackendl: redis://redis-ha-master.podiumd.svc.cluster.local:6379/12
      # -- Set to debug for test/acceptance environments
      logLevel: warning
    # override: values-enable-observability.yaml sets disabled: false and configures the OTEL endpoint
    otel:
      disabled: true
  persistence:
    size: 10Gi
    existingClaim: openinwoner
    storageClassName: podiumd-standard
  persistentVolume:
    volumeAttributeShareName: openinwoner
    storageClassName: podiumd-standard
  image:
    tag: "2.4.2"
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
  worker:
    replicaCount: 1
    livenessProbe:
      enabled: true
    maxWorkerLivenessDelta: "300"
    resources:
      requests:
        cpu: 200m
        memory: 640Mi
  # -- New in openinwoner 2.3.0 (chart 2.2.0): dedicated low-latency Celery worker for
  # cache-seeding/warmup tasks. The chart creates this deployment by default
  # (replicaCount 1) on upgrade; resources pinned here to match podiumd conventions.
  lowLatencyWorker:
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
  beat:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
  celeryMonitor:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
  nameOverride: openinwoner
  fullnameOverride: openinwoner
  nginx:
    image: *nginxImage
    config:
      basicAuth:
        # Enable this when digid mock is set to digidMock: "true"
        enabled: false
        # You need to generate the encrypted basic auth password yourself with htpasswd or openssl.
        # This is an example user
        users: |-
          dimpact:$apr1$E03dZmYK$npjTaXfI05tMJ63gB8dxm.
      clientMaxBodySize: 100M
    resources:
      requests:
        cpu: 30m
        memory: 8Mi
  tags:
    redis: false
  eck-elasticsearch:
    enabled: true
    version: "9.2.0"
    # -- image: overrides the Elasticsearch image. ECK does NOT append :version when spec.image is set — include the full tag.
    # For ACR: image: acrprodmgmt.azurecr.io/elasticsearch/elasticsearch:9.2.0
    http:
      tls:
        selfSignedCertificate:
          disabled: true
    # -- nodeSets must be configured per environment. Example (override in your environment values file):
    # nodeSets:
    # - name: default
    #   count: 1   # increase for larger environments (e.g. 3 for HA)
    #   config:
    #     cluster.initial_master_nodes:
    #     - openinwoner-elasticsearch-es-default-0
    #     node.roles:
    #     - master
    #     - data
    #     - ingest
    #     node.store.allow_mmap: false
    #     xpack.security.authc:
    #       anonymous:
    #         username: anonymous
    #         roles: superuser
    #         authz_exception: false
    #   podTemplate:
    #     spec:
    #       terminationGracePeriodSeconds: 60
    #       nodeSelector:
    #         kubernetes.azure.com/mode: user
    #       containers:
    #       - name: elasticsearch
    #         resources:
    #           # tune for larger environments; memory should match ES_JAVA_OPTS heap settings
    #           requests:
    #             cpu: 200m
    #             memory: 1536Mi
    #           limits:
    #             cpu: 1000m
    #             memory: 1536Mi
    #         env:
    #         - name: ES_JAVA_OPTS
    #           value: "-Xms1g -Xmx1g"   # set heap to ~75% of memory limit; increase for larger envs
    #         - name: PRE_STOP_ADDITIONAL_WAIT_SECONDS
    #           value: "15"
    #   # volumeClaimTemplates is immutable — changing it requires deleting the StatefulSet and PVC manually.
    #   volumeClaimTemplates:
    #   - metadata:
    #       name: elasticsearch-data
    #     spec:
    #       accessModes:
    #       - ReadWriteOnce
    #       storageClassName: managed-csi
    #       resources:
    #         requests:
    #           storage: 8Gi
  # OIP uses the central eck-operator (root-level `eck-operator`, with
  # managedNamespaces: [podiumd]). The openinwoner subchart bundles its own
  # eck-operator (`openinwoner-elastic-operator`); it MUST stay disabled,
  # otherwise two operators run on the same namespace. OIP only provides its own
  # Elasticsearch resource (`openinwoner-elasticsearch`), which is reconciled by
  # the central operator. See docs/apps/elastic/migrating-to-eck-stack.md.
  eck-operator:
    enabled: false

