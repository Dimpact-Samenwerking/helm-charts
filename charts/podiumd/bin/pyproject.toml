# Combined ruff + pylint config for the podiumd release-tooling scripts
# (verify-podiumd and its own lib/, plus every sibling top-level script and
# its tests) under THIS directory, charts/podiumd/bin/, only. Both tools
# auto-discover this file by walking up from each file they check, so it
# only ever applies here -- no repo-root pyproject.toml is needed, and it
# does NOT reach charts/podiumd/scripts/ (a different, older, unrelated set
# of one-off migration scripts -- fix-oidc-config.py, migrate-*.py -- that
# predate this toolset and were never moved here; they get each tool's
# bare defaults if ever linted, not this config).
#
# Previously two separate files (ruff.toml, pylintrc); converged here so
# both tools' settings live in one place, same convention either tool
# would use at a real project root.

[tool.ruff]
# This codebase's own docstrings/comments are deliberately long, explanatory
# prose (see git history) -- ruff's own default 88-char line-length would
# flag nearly every one of them as noise, not a real issue. 120 is generous
# enough to leave the deliberate style alone while still catching genuine
# outliers (a handful of lines even past that). Shared by [tool.ruff.format]
# below too, so linter and formatter agree.
line-length = 120

# F = pyflakes: unused imports (F401), unused locals (F841), etc. This exists
#     specifically so a lib/ refactor can't silently leave dead imports
#     behind again (see git history on this file's directory).
# E, W = pycodestyle errors/warnings.
# I = isort: import sorting/grouping.
# N = pep8-naming.
# UP = pyupgrade: outdated syntax for the actual supported Python version.
# B = flake8-bugbear: likely-real bugs (mutable default args, bare except,
#     loop-variable closures, etc.) pyflakes alone doesn't catch.
# C4 = flake8-comprehensions: unnecessary/inefficient comprehension patterns.
# SIM = flake8-simplify: needlessly convoluted control flow.
[tool.ruff.lint]
select = ["F", "E", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Every one of these test conftest.py files inserts its own script's
# directory onto sys.path before importing that script's own sibling lib.*
# modules -- these aren't installed as a package, so this is the only way
# for a conftest.py to import them at all. E402 (import not at top of file)
# is the deliberate, necessary consequence of that, not a real ordering
# problem -- confirmed the only 4 files this affects, all of them this
# exact same pattern.
"tests/lib/conftest.py" = ["E402"]
"tests/render-podiumd/conftest.py" = ["E402"]
"tests/update-component-version/conftest.py" = ["E402"]
"tests/verify-podiumd/conftest.py" = ["E402"]

# ruff format (AST-preserving -- unlike `ruff check --fix`, it re-serializes
# the same parse tree, never changes behavior; confirmed it also leaves
# docstring/comment PROSE completely untouched, only restructures code
# layout). Shares line-length above with the linter, so both agree on 120.
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# pylint is added on top ONLY for the one thing ruff has no equivalent rule
# for at all: total module line count. Narrow and deliberate on purpose,
# matching ruff's own "one rule, one documented reason" precedent above --
# not a general-purpose second linter running in parallel with the first.
#
# Invoke explicitly against the extensionless top-level scripts too (pylint
# won't discover them via a bare directory/glob scan the way it does *.py
# files) -- and against tests/ (several test modules are themselves well
# over 1000 lines). See README-coding.md and run_python_checks for the full
# command (filtered to a `python` shebang, so a non-Python executable like
# run_python_checks itself isn't handed to a Python linter).
[tool.pylint."messages control"]
disable = ["all"]
enable = ["too-many-lines"]

[tool.pylint.format]
# Matches [tool.ruff] line-length above (see that section's own comment for
# why 120: this codebase's deliberate long-docstring style). max-module-
# lines is left at pylint's own upstream default (1000) -- not re-tuned here.
max-line-length = 120

# vulture: dead-code detection. Like pylint above, it can't discover the
# extensionless top-level scripts via a bare directory scan (it only walks
# *.py files under a directory), so it's invoked the same explicit way. See
# README-coding.md and run_python_checks for the full command.
#
# tests/ is deliberately never passed to vulture at all -- pytest fixtures
# and mock/stub function signature params are structurally indistinguishable
# from real dead code to vulture's static analysis (neither is ever "called"
# in vulture's own sense), and dominated any real signal the one time this
# was tried against the whole tree (see git history).
#
# The names below are the exact, individually-confirmed false positives this
# scoped (lib/ + scripts only) invocation produces every time, because their
# only real callers live in the deliberately-excluded tests/ tree, or --
# for the three HTMLParser overrides -- are dispatched by name from stdlib
# internals, never called directly by this codebase at all:
#   - pull_chart_values: called only from tests/lib/test_chart.py.
#   - find_matches: called only from tests/lib/test_image_version.py.
#   - handle_starttag, handle_endtag, handle_data: _TableExtractor's own
#     HTMLParser method overrides in lib/confluence_tables.py, dispatched
#     by name from HTMLParser.feed() itself.
[tool.vulture]
ignore_names = ["pull_chart_values", "find_matches", "handle_starttag", "handle_endtag", "handle_data"]
