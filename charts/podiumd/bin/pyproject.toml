# ruff, pylint, isort, vulture, bandit and basedpyright config for
# charts/podiumd/bin/ (scripts, lib/, tests/). Not applied to
# charts/podiumd/scripts/.

[tool.ruff]
# Shared with [tool.ruff.format] and pylint max-line-length.
line-length = 120
indent-width = 4
force-exclude = true

[tool.ruff.lint]
select = [
    "A",     # flake8-builtins
    "AIR",
    # "ANN", # flake8-annotations
    "ARG",
    "ASYNC",
    "B",    # flake8-bugbear
    "BLE",
    "C4",   # flake8-comprehensions
    "C90",  # maccabe
    "COM",  # flake8-commas
    #"D",    # pydocstyle
    "DJ",
    "DTZ",
    "E",    # pycodestyle
    "EM",
    "ERA",  # flake8-eradicate
    "EXE",  # flake8-executable
    "F",    # Pyflakes
    "FA",   # flake8-future-annotations
    "FBT",  # flake8-boolean-trap
    "FLY",  # pyflint
    "FURB", # refurb
    "G",    # flake8-logging-format
    "I",    # isort
    "ICN",  # flake8-import-conventions
    "ISC",  # flake8-implicit-str-concat
    "INP",
    "INT",
    "LOG",  # flake8-logging
    "N",    # pep8-naming
    "NPY",
    "PD",
    "PERF", # perflint
    "PGH",
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "PYI",
    "Q",    # flake8-quotes
    "RET",  # flake8-return
    "RSE",  # flake8-raise
    "RUF",  # ruff
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "SLF",  # flake8-self
    "SLOT", # flake8-slots
    "T10",
    "T20",
    "TCH",
    "TID",
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle
    "YTT",  # flake8-2020
]
ignore = [
    "COM812", # Conflicts when used with the formatter
    "ISC001", # Rule may cause conflicts when used with the formatter, disable is recommended by ruff
    "T201", # 'print' statement found, sometimes these are deliberate
    "EXE001", # shebang permission mismatch between host and Docker container
    "E501", # line-too-long: pylint's job now (C0301), avoid flagging the same line twice
    "ERA001", # commented-out-code: current hits are prose that resembles code
]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
# Mirror [tool.isort] below so ruff and isort agree on import layout.
force-single-line = true
lines-between-types = 1

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true  # Enable additional checks for try-except-pass

[tool.ruff.lint.per-file-ignores]
# These patch sys.path before importing lib.* (not a package), so E402 is unavoidable.
"tests/lib/conftest.py" = ["E402"]
"tests/render-podiumd/conftest.py" = ["E402"]
"tests/update-component-version/conftest.py" = ["E402"]
"tests/verify-podiumd/conftest.py" = ["E402"]
"change-podiumd-baseline" = ["E402"]
"create-doc-version" = ["E402"]
"create-podiumd-version" = ["E402"]
"export-confluence-release-table" = ["E402"]
"fix-doc-consistency" = ["E402"]
"fix-helm-doc" = ["E402"]
"fix-image-digests" = ["E402"]
"fix-markdown" = ["E402"]
"fix-node-selector" = ["E402"]
"fix-oidc-url-coverage" = ["E402"]
"fix-utf8-bom" = ["E402"]
"fix-vendored-tgz" = ["E402"]
"list-helmchart-images" = ["E402"]
"list-podiumd-images" = ["E402"]
"query-release-table" = ["E402"]
"render-podiumd" = ["E402"]
"show-component-baseline-version" = ["E402"]
"show-image-baseline-version" = ["E402"]
"update-component-version" = ["E402"]
"update-image-version" = ["E402"]
"verify-component-version" = ["E402"]
"verify-helm-secret-size" = ["E402"]
"verify-image-version" = ["E402"]
"verify-podiumd" = ["E402"]
"verify-podiumd-dead-values" = ["E402"]
"verify-release-table-with-podiumd" = ["E402"]

# tests/: pytest asserts, fixture/mock params (ARG), private-helper access
# (SLF001), no __init__.py (INP001), composite asserts (PT018), unused
# unpacked vars (RUF059), fixed-argv `git` calls (S603/S607), fake tokens
# (S106). bandit does not scan tests/ either.
"tests/**" = ["S101", "ARG001", "ARG005", "SLF001", "INP001", "PT018", "RUF059", "S603", "S607", "S106"]

# S310: these urlopen() calls only target config-derived trusted hosts.
"lib/registry.py" = ["S310"]
"lib/repo_access.py" = ["S310"]
"lib/confluence_tables.py" = ["S310"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# pylint covers checks ruff lacks; overlapping rules are owned by one tool.
# Extensionless scripts must be passed explicitly (see run_python_checks).
# tests/-only disables live in run_python_checks (TESTS_PYLINT_DISABLE):
# pylint has no per-directory config.

[tool.pylint.basic]
# Allow hyphens for the kebab-case script names (e.g. "verify-podiumd").
module-rgx = "^(([a-z_][a-z0-9_-]*)|(__.*__))$"

[tool.pylint.format]
# Matches [tool.ruff] line-length.
max-line-length = 120

[tool.isort]
# Compatible with 'ruff format'; mirrored by [tool.ruff.lint.isort]. The two
# attach comments between imports differently: fence such blocks with
# "# isort: off" / "# isort: on".
line_length = 120
multi_line_output = 3
lines_between_types = 1
use_parentheses = true
include_trailing_comma = true
force_single_line = true
default_section = "THIRDPARTY"
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

# vulture runs on lib/ + scripts only (see run_python_checks): tests/
# fixtures and mock params look like dead code. False positives:
#   - pull_chart_values, find_matches, clear_tag_exists_cache: only called
#     from tests/.
#   - handle_starttag, handle_endtag, handle_data: HTMLParser overrides in
#     lib/confluence_tables.py, dispatched by HTMLParser.feed().
[tool.vulture]
ignore_names = [
    "pull_chart_values",
    "find_matches",
    "clear_tag_exists_cache",
    "handle_starttag",
    "handle_endtag",
    "handle_data"
]

[tool.bandit]
skips = [
    # covered by ruff:
    "B108",
    "B110",  # S110 in ruff
    "B501",
]

[tool.basedpyright]
exclude = [
    "**/__pycache__",
]
typeCheckingMode = "strict"
reportUnusedImport = false  # done by ruff F401
reportUntypedBaseClass = false # dony by ruff N801

# tests/: fakes, parametrize args and monkeypatch lambdas are unannotated
# and scripts load as ModuleType, so Unknown types remain.
[[tool.basedpyright.executionEnvironments]]
root = "tests"
# Imports resolve from the environment root; tests import lib.* from here.
extraPaths = ["."]
reportMissingParameterType = false
reportUnknownLambdaType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
