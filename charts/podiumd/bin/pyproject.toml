# Combined ruff + pylint config for the podiumd release-tooling scripts
# (verify-podiumd and its own lib/, plus every sibling top-level script and
# its tests) under THIS directory, charts/podiumd/bin/, only. Both tools
# auto-discover this file by walking up from each file they check, so it
# only ever applies here -- no repo-root pyproject.toml is needed, and it
# does NOT reach charts/podiumd/scripts/ (a different, older, unrelated set
# of one-off migration scripts -- fix-oidc-config.py, migrate-*.py -- that
# predate this toolset and were never moved here; they get each tool's
# bare defaults if ever linted, not this config).
#
# Previously two separate files (ruff.toml, pylintrc); converged here so
# both tools' settings live in one place, same convention either tool
# would use at a real project root.

[tool.ruff]
# This codebase's own docstrings/comments are deliberately long, explanatory
# prose (see git history) -- ruff's own default 88-char line-length would
# flag nearly every one of them as noise, not a real issue. 120 is generous
# enough to leave the deliberate style alone while still catching genuine
# outliers (a handful of lines even past that). Shared by [tool.ruff.format]
# below too, so linter and formatter agree.
line-length = 120
indent-width = 4
force-exclude = true

[tool.ruff.lint]
select = [
    "A",     # flake8-builtins
    "AIR",
    # "ANN", # flake8-annotations
    "ARG",
    "ASYNC",
    "B",    # flake8-bugbear
    "BLE",
    "C4",   # flake8-comprehensions
    "C90",  # maccabe
    "COM",  # flake8-commas
    #"D",    # pydocstyle
    "DJ",
    "DTZ",
    "E",    # pycodestyle
    "EM",
    "ERA",  # flake8-eradicate
    "EXE",  # flake8-executable
    "F",    # Pyflakes
    "FA",   # flake8-future-annotations
    "FBT",  # flake8-boolean-trap
    "FLY",  # pyflint
    "FURB", # refurb
    "G",    # flake8-logging-format
    "I",    # isort
    "ICN",  # flake8-import-conventions
    "ISC",  # flake8-implicit-str-concat
    "INP",
    "INT",
    "LOG",  # flake8-logging
    "N",    # pep8-naming
    "NPY",
    "PD",
    "PERF", # perflint
    "PGH",
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "PYI",
    "Q",    # flake8-quotes
    "RET",  # flake8-return
    "RSE",  # flake8-raise
    "RUF",  # ruff
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "SLF",  # flake8-self
    "SLOT", # flake8-slots
    "T10",
    "T20",
    "TCH",
    "TID",
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle
    "YTT",  # flake8-2020
]
ignore = [
    "COM812", # Conflicts when used with the formatter
    "ISC001", # Rule may cause conflicts when used with the formatter, disable is recommended by ruff
    "T201", # 'print' statement found, sometimes these are deliberate
    "EXE001", # shebang permission mismatch between host and Docker container
    "E501", # line-too-long: pylint's job now (C0301), avoid flagging the same line twice
    "ERA001", # commented-out-code: all current hits are explanatory prose (e.g. a rendered-
              # output line-number comment) that structurally resembles code, not real dead code
]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
# Mirror [tool.isort] below, so `ruff check --select I --fix` and `isort`
# produce the same import layout. Without these, ruff's own isort defaults
# merge single-line imports ("from x import a, b") and drop the blank line
# between "import x" and "from x import y" lines.
force-single-line = true
lines-between-types = 1

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true  # Enable additional checks for try-except-pass

[tool.ruff.lint.per-file-ignores]
# Every one of these test conftest.py files, and every extensionless
# top-level script below, inserts its own directory onto sys.path before
# importing its sibling lib.* modules -- these aren't installed as a
# package, so this is the only way to import them at all. E402 (import not
# at top of file) is the deliberate, necessary consequence of that, not a
# real ordering problem.
"tests/lib/conftest.py" = ["E402"]
"tests/render-podiumd/conftest.py" = ["E402"]
"tests/update-component-version/conftest.py" = ["E402"]
"tests/verify-podiumd/conftest.py" = ["E402"]
"change-podiumd-baseline" = ["E402"]
"create-doc-version" = ["E402"]
"create-podiumd-version" = ["E402"]
"export-confluence-release-table" = ["E402"]
"fix-doc-consistency" = ["E402"]
"fix-helm-doc" = ["E402"]
"fix-image-digests" = ["E402"]
"fix-markdown" = ["E402"]
"fix-node-selector" = ["E402"]
"fix-utf8-bom" = ["E402"]
"fix-vendored-tgz" = ["E402"]
"list-helmchart-images" = ["E402"]
"list-podiumd-images" = ["E402"]
"query-release-table" = ["E402"]
"render-podiumd" = ["E402"]
"show-component-baseline-version" = ["E402"]
"show-image-baseline-version" = ["E402"]
"update-component-version" = ["E402"]
"update-image-version" = ["E402"]
"verify-component-version" = ["E402"]
"verify-helm-secret-size" = ["E402"]
"verify-image-version" = ["E402"]
"verify-podiumd" = ["E402"]
"verify-podiumd-dead-values" = ["E402"]
"verify-release-table-with-podiumd" = ["E402"]

# S101 (assert), ARG001/ARG005 (unused argument), SLF001 (private-member-
# access -- tests reach into a module's own _private helpers on purpose to
# verify them directly), INP001 (no __init__.py -- deliberate, these dirs
# are never imported as a package, only loaded ad hoc via SourceFileLoader/
# conftest.py fixtures), PT018 (composite assert -- this codebase's own
# established one-assert-per-behavior-with-context style), and RUF059
# (unused unpacked variable -- e.g. `_old, new = ...`, kept for readability
# even when only one side is asserted on): tests/ is pytest's own
# assert-per-check style plus fixture/mock/stub signature params that are
# structurally indistinguishable from a real unused arg -- same false-
# positive class [tool.vulture]'s own ignore_names comment above documents
# for this directory, just under a different tool.
# S603/S607 (subprocess call, partial executable path): tests run `git`
# with a fixed argv to build throwaway repos under tmp_path. S106
# (hardcoded password argument): fake tokens passed to the code under
# test. bandit, the security scan these rules mirror, never scans tests/
# either.
"tests/**" = ["S101", "ARG001", "ARG005", "SLF001", "INP001", "PT018", "RUF059", "S603", "S607", "S106"]

# S310 (audit URL open for permitted schemes): every urlopen() call in these
# 3 files targets a known, config-derived trusted host (container registry
# API, helm repo index.yaml, Confluence API base URL) -- never an attacker-
# controllable scheme. Scoped here, not a global ignore, since S310 is a
# real check worth keeping everywhere else.
"lib/registry.py" = ["S310"]
"lib/repo_access.py" = ["S310"]
"lib/confluence_tables.py" = ["S310"]

# ruff format (AST-preserving -- unlike `ruff check --fix`, it re-serializes
# the same parse tree, never changes behavior; confirmed it also leaves
# docstring/comment PROSE completely untouched, only restructures code
# layout). Shares line-length above with the linter, so both agree on 120.
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# pylint runs alongside ruff for checks ruff has no equivalent for (total
# module line count, subprocess-run-check, etc.). Where the two genuinely
# overlap, one tool owns the rule and the other is disabled for it here --
# same "one rule, one documented reason" precedent as [tool.ruff.lint]
# ignore above (see its own E501 entry for the same pattern in reverse).
#
# Invoke explicitly against the extensionless top-level scripts too (pylint
# won't discover them via a bare directory/glob scan the way it does *.py
# files) -- and against tests/ (several test modules are themselves well
# over 1000 lines). See README-coding.md and run_python_checks for the full
# command (filtered to a `python` shebang, so a non-Python executable like
# run_python_checks itself isn't handed to a Python linter).
#
# This file has no per-directory scoping (unlike ruff's [tool.ruff.lint.
# per-file-ignores]) -- pylint reads one config for the whole run. 7 checks
# are false positives ONLY under tests/ (pytest fixture signatures,
# sys.path-hack conftest imports, shared assertion boilerplate) and must
# stay enabled for lib/ and the top-level scripts, so they're disabled via
# a second, tests/-only `--disable` CLI flag in run_python_checks instead
# of here: missing-function-docstring, wrong-import-position,
# unused-argument, protected-access, unused-variable, redefined-outer-name,
# duplicate-code. See run_python_checks for the two invocations and each
# flag's own reasoning.

[tool.pylint.basic]
# Default module-rgx is snake_case-only and flags every extensionless
# top-level script's deliberate kebab-case name (e.g. "verify-podiumd") as
# invalid-name. Widened to allow hyphens; variable/function/class naming
# (variable-rgx, function-rgx, class-rgx, ...) is untouched and still checked.
module-rgx = "^(([a-z_][a-z0-9_-]*)|(__.*__))$"

[tool.pylint.format]
# Matches [tool.ruff] line-length above (see that section's own comment for
# why 120: this codebase's deliberate long-docstring style). max-module-
# lines is left at pylint's own upstream default (1000) -- not re-tuned here.
max-line-length = 120

[tool.isort]
# Configured to be compatible with 'ruff format', and mirrored by
# [tool.ruff.lint.isort] above so ruff's own import sorting agrees. The two
# still attach comment lines between imports differently -- fence such
# blocks with "# isort: off" / "# isort: on" (both tools honor it).
line_length = 120
multi_line_output = 3
lines_between_types = 1
use_parentheses = true
include_trailing_comma = true
force_single_line = true
default_section = "THIRDPARTY"
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

# vulture: dead-code detection. Like pylint above, it can't discover the
# extensionless top-level scripts via a bare directory scan (it only walks
# *.py files under a directory), so it's invoked the same explicit way. See
# README-coding.md and run_python_checks for the full command.
#
# tests/ is deliberately never passed to vulture at all -- pytest fixtures
# and mock/stub function signature params are structurally indistinguishable
# from real dead code to vulture's static analysis (neither is ever "called"
# in vulture's own sense), and dominated any real signal the one time this
# was tried against the whole tree (see git history).
#
# The names below are the exact, individually-confirmed false positives this
# scoped (lib/ + scripts only) invocation produces every time, because their
# only real callers live in the deliberately-excluded tests/ tree, or --
# for the three HTMLParser overrides -- are dispatched by name from stdlib
# internals, never called directly by this codebase at all:
#   - pull_chart_values: called only from tests/lib/test_chart.py.
#   - find_matches: called only from tests/lib/test_image_version.py.
#   - handle_starttag, handle_endtag, handle_data: _TableExtractor's own
#     HTMLParser method overrides in lib/confluence_tables.py, dispatched
#     by name from HTMLParser.feed() itself.
[tool.vulture]
ignore_names = [
    "pull_chart_values",
    "find_matches",
    "handle_starttag",
    "handle_endtag",
    "handle_data"
]

[tool.bandit]
skips = [
    # covered by ruff:
    "B108",
    "B110",  # S110 in ruff
    "B501",
]

[tool.basedpyright]
exclude = [
    "**/__pycache__",
]
typeCheckingMode = "strict"
reportOptionalMemberAccess = false
reportAttributeAccessIssue = false
reportMissingTypeArgument = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnusedImport = false  # done by ruff F401
reportUntypedBaseClass = false # dony by ruff N801
