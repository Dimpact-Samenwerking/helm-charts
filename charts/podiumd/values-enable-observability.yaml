# Enable observability (OpenTelemetry + Prometheus) for all supported components.
#
# Usage: helm upgrade podiumd charts/podiumd -f values.yaml -f values-enable-observability.yaml -n podiumd
#
# Collector endpoint: the OpenTelemetry Collector deployed by the monitoring-logging chart
# in the monitoring namespace, accepting OTLP over gRPC on port 4317.
# Adjust the endpoint if your collector runs elsewhere.

_otelEndpoint: &otelEndpoint "http://monitoring-opentelemetry-collector.monitoring.svc.cluster.local:4317"

# The settings.otel block every Maykin app below shares; change it here once.
_maykinOtel: &maykinOtel
  disabled: false
  exporterOtlpEndpoint: *otelEndpoint
  exporterOtlpProtocol: grpc
  exporterOtlpMetricsInsecure: true
  metricExportInterval: 60000
  metricExportTimeout: 10000

# ---------------------------------------------------------------------------
# Maykin apps — Django-based, all share the same settings.otel schema
# ---------------------------------------------------------------------------

openzaak:
  settings:
    otel: *maykinOtel

openklant:
  settings:
    otel: *maykinOtel

openformulieren:
  settings:
    otel: *maykinOtel

opennotificaties:
  settings:
    otel: *maykinOtel

objecten:
  settings:
    otel: *maykinOtel

openinwoner:
  settings:
    otel: *maykinOtel

openarchiefbeheer:
  settings:
    otel: *maykinOtel

referentielijsten:
  settings:
    otel: *maykinOtel

openvtb:
  settings:
    otel: *maykinOtel

# ---------------------------------------------------------------------------
# ZAC — OpenTelemetry to the shared collector in the monitoring namespace
#
# ZAC runs on WildFly (MicroProfile Telemetry), which reads otel.* from
# MicroProfile Config; system properties rank above environment variables.
# javaOptions therefore turns the SDK on, points it at the shared collector,
# and turns the OTLP metrics exporter on (without it ZAC sent no metrics on
# QA, only spans). The zac chart's own route (opentelemetry-collector.enabled: true
# to make it emit OTEL_SDK_DISABLED/OTEL_EXPORTER_OTLP_ENDPOINT) also deploys
# a bundled collector: its chart ignores replicaCount: 0 (the template only
# writes replicas when the value is truthy), its image path is not in the
# ACR mirror, and it has no resource requests. So that collector stays off.
# Keep the endpoint below equal to &otelEndpoint.
# ---------------------------------------------------------------------------

zac:
  # javaOptions extends the chart default (-Xmx1024m -Xms1024m -Xlog:gc::time,uptime).
  javaOptions: >-
    -Xmx1024m -Xms1024m -Xlog:gc::time,uptime
    -Dotel.sdk.disabled=false
    -Dotel.exporter.otlp.endpoint=http://monitoring-opentelemetry-collector.monitoring.svc.cluster.local:4317
    -Dotel.metrics.exporter=otlp
    -Dotel.service.name=zac
  # Solr Operator — hardcodes prometheus.io/scrape: "true" in its deployment template already.
  # Only port and path need to be added via annotations (port 8080).
  solr-operator:
    annotations:
      prometheus.io/port: "8080"
      prometheus.io/path: /metrics
    # Zookeeper Operator: no scrape annotations. infonl/zookeeper-operator binds
    # its metrics to 127.0.0.1:6000 (--metrics-bind-address), so they are not
    # reachable from outside the pod, and its chart cannot pass that flag.

# ---------------------------------------------------------------------------
# Keycloak — two-part wiring:
#   1. keycloak-operator.enableServiceMonitor (default true since 4.10.0) grants
#      RBAC so the operator can create the ServiceMonitor (see
#      templates/keycloak-operator-servicemonitor-rbac.yaml); set here explicitly.
#   2. keycloak.serviceMonitor renders spec.serviceMonitor on the Keycloak CR,
#      which the operator uses as its cue to generate the actual ServiceMonitor
#      for the Keycloak pods (port 9000, /metrics, enabled via additionalOptions
#      metrics-enabled: true in values.yaml).
# Requires the keycloak-cr.yaml template to pass spec.serviceMonitor through.
# ---------------------------------------------------------------------------

keycloak-operator:
  enableServiceMonitor: true

keycloak:
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s

# ---------------------------------------------------------------------------
# Redis operator — scrape the operator deployment (port 8080) and enable the
# redis_exporter sidecar on each redis-ha pod (port 9121) with a PodMonitor.
# Note: the redis-operator itself uses annotation-based scraping (no ServiceMonitor
# supported by the operator chart). Requires additionalScrapeConfigs in the
# monitoring chart for the annotations to be picked up by kube-prometheus-stack.
# The redis-ha PodMonitor requires the Prometheus Operator CRDs.
# ---------------------------------------------------------------------------

redis-operator:
  redisOperator:
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8080"
      prometheus.io/path: /metrics
  redis-ha:
    redisExporter:
      enabled: true
      podMonitor:
        enabled: true

# ---------------------------------------------------------------------------
# ClamAV — sergeymakinen/clamav_exporter sidecar + ServiceMonitor (port 9906)
# Supported since clamav chart v3.7.1 (current). The sidecar runs alongside
# clamd and exposes metrics at :9906/metrics. ServiceMonitor requires the
# Prometheus Operator CRD (monitoring.coreos.com/v1 ServiceMonitor).
# ---------------------------------------------------------------------------

clamav:
  metrics:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 32Mi
    serviceMonitor:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s

# ---------------------------------------------------------------------------
# ECK operator — enable metrics port and create a PodMonitor
# for the ECK operator pod itself. The eck-operator-podmonitor-rbac template in
# the podiumd chart grants the elastic-operator SA permission to also create
# PodMonitors for managed Elasticsearch/Kibana instances at runtime.
# Requires: eck-operator.enabled: true and Prometheus Operator CRDs installed.
#
# eck-operator 3.x reads config.metrics.port and ignores the deprecated
# config.metricsPort whenever metrics.port is set; its default for
# config.metrics.port is the string "0", which counts as set. So set
# config.metrics.port: with only metricsPort the operator exposes no metrics
# and no PodMonitor is rendered.
# ---------------------------------------------------------------------------

eck-operator:
  config:
    metrics:
      port: "8080"
  podMonitor:
    enabled: true
    interval: 1m
    scrapeTimeout: 30s

# ---------------------------------------------------------------------------
# Frank!Gateway — APISIX prometheus exporter on the frankgateway Service, the
# prometheus plugin as a global rule (per-route metrics) and a ServiceMonitor.
# Requires: frankgateway.enabled: true.
# ---------------------------------------------------------------------------

frankgateway:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s

# ---------------------------------------------------------------------------
# OpenBao — ServiceMonitor for /v1/sys/metrics on the metrics-only listener
# (port 9101, Service port "metrics"). The same flag adds the telemetry stanza
# and that listener to the chart's server config (openbao.server.ha.config);
# the API listener on 8200 keeps requiring a token for metrics. A PodMonitor
# (templates/openbao-podmonitor.yaml) also scrapes the standby pods.
# Turning this on restarts all OpenBao pods. With the Shamir seal (no
# openbao.seal.static.key) every pod comes back SEALED while readiness reports
# it ready: run `bao operator unseal` on each pod right after the deploy.
# Requires: openbao.enabled: true.
# ---------------------------------------------------------------------------

openbao:
  serverTelemetry:
    serviceMonitor:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s
