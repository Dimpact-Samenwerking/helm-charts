# Tunable policy constants for charts/podiumd/bin (read via lib/settings.py).

cve_scan:
  high_severity_levels: ["CRITICAL", "HIGH"]
  max_cves_per_package_before_summarizing: 5
  # An unchanged digest keeps its content, but trivy's DB does not.
  scan_cache_ttl_days: 7

image_upgrade_check:
  # New tags can appear any time; this only avoids re-querying within a day.
  tag_check_cache_ttl_days: 1

chart_upgrade_check:
  # New chart versions can appear any time; this only avoids re-querying within a day.
  cache_ttl_days: 1

root_containers:
  # Containers known to run as root and accepted, reported as accepted instead of as findings:
  # "<rendered source template>:<container name>": "<why>"
  accepted: {}

repo_access:
  # Avoids Docker Hub's anonymous rate limit on quick re-runs.
  cache_ttl_minutes: 30
  request_timeout_seconds: 10
  never_probe_host_suffixes: ["azurecr.io"]

render_report:
  top_n_largest_templates_shown: 5
  # render-podiumd's output in the chart root; excluded from the release
  # Secret estimate (gitignored debug artifact).
  default_output_file_name: "rendered-helm.yaml"

dry_check:
  # Calibrated on templates/: the old duplicated storage.yaml files scored
  # ~0.82 (worth deduping), the two Keycloak realm-import jobs ~0.63
  # (borderline).
  similarity_threshold: 0.6
  high_similarity_threshold: 0.75
  # Shorter templates look similar by line ratio alone.
  min_significant_lines: 8

release_secret:
  kubernetes_secret_limit_bytes: 1048576
  warn_at_fraction_of_limit: 0.90

dependency_fetch:
  # `helm dependency update` fails intermittently (network, throttling).
  retry_attempts: 3
  retry_backoff_seconds: [5, 15, 45]

quality_gates:
  # statusError: unparseable resource or schema fetch failure;
  # statusInvalid: schema violation.
  kubeconform_failing_statuses: ["statusError", "statusInvalid"]
  shellcheck_failing_levels: ["error", "warning"]
  # A container `command` must invoke one of these to count as a shell script.
  shellcheck_shell_names: ["sh", "bash", "dash", "ksh"]
  yamllint_failing_rules: ["key-duplicates", "syntax"]
  markdown_disabled_rules: ["md013", "md014"]
  # The only kube-score check this repo has a policy for.
  kube_score_check_id: "container-resources"

helm_doc:
  # A renamed key can ripple through hundreds of rows; show an excerpt.
  max_diff_lines_shown: 40

vendor_classification:
  # Case-insensitive substring of the resolved repository URL ("@alias"
  # via helm_repos.urls_by_alias). Unmatched sub-charts are count-only.
  keywords:
    "maykinmedia": "Maykin"
    "infonl": "Info(NL)"
    "worth-nl": "Worth"
    "wearefrank": "WeAreFrank"
    "dimpact": "Dimpact"
    "icatt-menselijk-digitaal": "ICATT"
  # By chart name (alias if set), for URLs that hide the vendor (KISS is ICATT).
  chart_overrides:
    "kiss": "ICATT"

helm_repos:
  # URLs for Chart.yaml "@alias" repository references.
  urls_by_alias:
    "adfinis": "https://charts.adfinis.com"
    "wiremind": "https://wiremind.github.io/wiremind-helm-charts"
    "dimpact": "https://Dimpact-Samenwerking.github.io/helm-charts/"
    "maykinmedia": "https://maykinmedia.github.io/charts/"
    "kiss-elastic": "https://raw.githubusercontent.com/Klantinteractie-Servicesysteem/.github/main/docs/scripts/elastic"
    "zac": "https://infonl.github.io/dimpact-zaakafhandelcomponent/"
    "zgw-office-addin": "https://infonl.github.io/zgw-office-addin"
    "worth-nl": "https://worth-nl.github.io/helm-charts"
    "opstree": "https://ot-container-kit.github.io/helm-charts/"

digest_pinning:
  # Paths exempt from the "<tag>@sha256:<digest>" convention. sibling_field
  # names the field carrying the digest, as the upstream template expects.
  # writable: update-component-version may write tag+digest. omc.image
  # cannot be digest-pinned at all.
  exceptions:
    "keycloak-operator.operator.image": {sibling_field: "sha", writable: true}
    "keycloak-operator.operator.config.keycloakImage": {sibling_field: "sha", writable: true}
    "keycloak.image": {sibling_field: "sha", writable: true}
    "eck-operator.image": {sibling_field: "digest", writable: true}
    "omc.image": {}

component_resolution:
  # Chart version == app image version. update-component-version refuses
  # differing versions; verify-podiumd's "Lockstep versions" catches drift.
  chart_version_lockstep_components: ["kiss-chart", "pabc", "eck-operator", "internetaakafhandeling"]
  # Components implemented by podiumd's own templates, without a Chart.yaml
  # dependency. keycloak is the server CR, image and keycloak-config-cli on
  # top of the keycloak-operator dependency.
  native_components: ["frankgateway", "keycloak"]
  # component (name) -> sibling path holding a version_paths entry's
  # repository, when podiumd's values.yaml overrides it.
  version_repository_paths:
    "redis-operator": "redisOperator.imageName"
  # component -> {version field: nested sub-subchart} for bare versions the
  # operator maps to images internally (ECK); the image is only documented
  # in the nested sub-subchart's values.yaml inside the .tgz.
  version_path_nested_subcharts:
    "eck-stack":
      "eck-elasticsearch.version": "eck-elasticsearch"
      "eck-kibana.version": "eck-kibana"
      "eck-enterprise-search.version": "eck-enterprise-search"
  # component (name or alias) -> the image path(s) that carry its app
  # version, for multi-image components; others use default_image_paths.
  # Multiple paths form a lockstep group.
  image_paths:
    "zgw-office-addin": ["frontend.image", "backend.image"]
    # The operator only; the server is native keycloak's keycloak.image and
    # moves independently. Uses the split "tag:" + "sha:" convention.
    "keycloak-operator": ["operator.image"]
    # The bao-config Job runs the same binary and must match the server.
    "openbao": ["server.image", "configuration.job.image"]
    "internetaakafhandeling": ["web.image", "poller.image"]
    # Not the Elastic Open Crawler images: separate version lines.
    "kiss-chart": ["image", "settings.syncJobs.image"]
    # Not initContainers.waitFor.image (k8s-wait-for): separate version line.
    "pabc": ["image", "migrations.image"]
    # Same as the default, but registration enables actual_app_version's
    # vendored-subchart fallback: eck-operator has no values.yaml image
    # override, so its version only resolves from the .tgz default.
    "eck-operator": ["image"]
  default_image_paths: ["image"]
  # Image path whose tag embeds another image's version -> that image's
  # path. keycloak-config-cli tags are "<own>-<keycloak-version>": pin the
  # explicit build (e.g. 6.5.1-26.5.5), not the floating "-26" alias.
  # "Lockstep versions" fails when the embedded version is missing, has
  # another major, or is newer than the image.
  embedded_version_images:
    "keycloak.keycloakConfigCli.image": "keycloak.image"
  # component (name) -> paths of bare version strings, tried after
  # image_paths finds no tag; first that resolves wins.
  # - eck-stack: per-resource CRD "version:" (enterprise-search is disabled
  #   by default, so not listed).
  # - redis-operator: split "imageName:"/"imageTag:" fields.
  version_paths:
    "eck-stack": ["eck-elasticsearch.version", "eck-kibana.version"]
    "redis-operator": ["redisOperator.imageTag"]
