# Tunable policy constants for charts/podiumd/bin (cache TTLs, CVE
# severity sets, retry counts, quality-gate pass/fail sets, thresholds)
# — each key here mirrors a former hard-coded Python constant, so an
# operator can retune one without touching code (see lib/settings.py).

cve_scan:
  high_severity_levels: ["CRITICAL", "HIGH"]
  max_cves_per_package_before_summarizing: 5
  # Long enough that a routine run doesn't re-pull/re-scan every image
  # every time; short enough that a stale "no findings" cache entry
  # doesn't silently hide a CVE disclosed against that digest since it
  # was last scanned. The image content never changes for an unchanged
  # digest, but trivy's own vulnerability DB does.
  scan_cache_ttl_days: 7

image_upgrade_check:
  # A new tag can be published at any moment, so this is deliberately
  # much shorter than cve_scan.scan_cache_ttl_days above -- caching here
  # is purely about not re-querying every registry on every single local
  # run within the same day, not about the answer being stable over any
  # longer window.
  tag_check_cache_ttl_days: 1

repo_access:
  # Short TTL -- long enough to skip a network round trip on a
  # verify-podiumd re-run minutes or a couple of hours later while
  # iterating on something unrelated (the actual, observed trigger for
  # hitting Docker Hub's anonymous pull-rate limit during a real dev
  # session), short enough that a real access change is still caught
  # again soon.
  cache_ttl_minutes: 30
  request_timeout_seconds: 10
  never_probe_host_suffixes: ["azurecr.io"]

render_report:
  top_n_largest_templates_shown: 5

dry_check:
  # Thresholds calibrated against this repo's own templates/ directory
  # using two known reference points: the 9 pre-refactor storage.yaml
  # files (see podiumd.storagePVC) -- a confirmed real dedup win -- score
  # ~0.82 against each other; the two Keycloak realm-import jobs -- same
  # Job skeleton, but genuinely different env/secret content, NOT worth
  # forcing into one template -- score ~0.63. high_similarity_threshold
  # sits between the two so the storage-file case is correctly flagged
  # "likely worth deduping" and the Keycloak case stays "borderline".
  similarity_threshold: 0.6
  high_similarity_threshold: 0.75
  # Below this many significant lines, near-any two short templates look
  # "similar" by line-ratio alone -- not worth reporting as a candidate.
  min_significant_lines: 8

release_secret:
  kubernetes_secret_limit_bytes: 1048576
  warn_at_fraction_of_limit: 0.90

dependency_fetch:
  # `helm dependency update` fails intermittently on some repos (transient
  # network blips, registry throttling) -- retried with this backoff
  # before it's treated as a real failure.
  retry_attempts: 3
  retry_backoff_seconds: [5, 15, 45]

quality_gates:
  # statusError covers both "resource couldn't even be parsed" and a
  # schema-fetch network failure; statusInvalid is a genuine schema
  # violation. statusSkipped (no schema, expected for CRDs) and
  # statusValid are not findings at all.
  kubeconform_failing_statuses: ["statusError", "statusInvalid"]
  # error/warning are shellcheck's own "likely a real bug" tiers; info/style
  # are cosmetic suggestions and are never reported at all.
  shellcheck_failing_levels: ["error", "warning"]
  # A container's `command` must invoke one of these to be treated as an
  # embedded shell script at all (this chart's own command/args convention).
  shellcheck_shell_names: ["sh", "bash", "dash", "ksh"]
  yamllint_failing_rules: ["key-duplicates", "syntax"]
  markdown_disabled_rules: ["md013", "md014"]
  # The only kube-score check this repo has a documented policy for --
  # every other kube-score opinion (NetworkPolicy, ImagePullPolicy,
  # SecurityContext, ...) is ignored (67+ unrelated findings otherwise).
  kube_score_check_id: "container-resources"

helm_doc:
  # Past this many diff lines, printing every one stops being useful (a
  # renamed top-level key can ripple through hundreds of rows) -- show a
  # capped, representative excerpt instead.
  max_diff_lines_shown: 40

vendor_classification:
  # Matched case-insensitively as a substring of a dependency's RESOLVED
  # repository URL (an "@alias" is resolved via helm_repos.urls_by_alias
  # first) -- every vendored sub-chart not covered here stays
  # aggregate-count-only in every own/partner/other-bucketed check.
  keywords:
    "maykinmedia": "Maykin"
    "infonl": "Info(NL)"
    "worth-nl": "Worth"
    "wearefrank": "WeAreFrank"
    "dimpact": "Dimpact"
    "icatt-menselijk-digitaal": "ICATT"
  # By chart name (alias if the dependency has one) -- for a dependency
  # whose own repository URL doesn't reveal its real vendor at all (KISS
  # is developed by ICATT, but neither "kiss" nor its own
  # oci://ghcr.io/klantinteractie-servicesysteem repository URL says so).
  chart_overrides:
    "kiss": "ICATT"

helm_repos:
  # Every Chart.yaml dependency that references a repo by "@alias" needs
  # this to resolve to a real URL before `helm repo add`/`helm dependency
  # update` can use it.
  urls_by_alias:
    "adfinis": "https://charts.adfinis.com"
    "wiremind": "https://wiremind.github.io/wiremind-helm-charts"
    "dimpact": "https://Dimpact-Samenwerking.github.io/helm-charts/"
    "maykinmedia": "https://maykinmedia.github.io/charts/"
    "kiss-elastic": "https://raw.githubusercontent.com/Klantinteractie-Servicesysteem/.github/main/docs/scripts/elastic"
    "zac": "https://infonl.github.io/dimpact-zaakafhandelcomponent/"
    "zgw-office-addin": "https://infonl.github.io/zgw-office-addin"
    "worth-nl": "https://worth-nl.github.io/helm-charts"
    "opstree": "https://ot-container-kit.github.io/helm-charts/"

digest_pinning:
  # A path here is exempt from the ordinary "@sha256:... embedded in tag"
  # convention. sibling_field (when present) names the separate values.yaml
  # field that actually carries the digest for this path, matching whatever
  # its own upstream chart's template expects (see resolved_digest_pin).
  # writable: true marks a path update-component-version may safely
  # auto-write a fresh tag+digest to during a version bump — every other
  # exempt path is read-only here (either it has no code path that ever
  # writes it, or writing it isn't safe/meaningful, e.g. omc.image can't be
  # digest-pinned in any form, and keycloak.image is a YAML *alias* of
  # keycloak-operator.operator.config.keycloakImage's own anchor, so it
  # never needs (or gets) its own separate write -- see update-component-
  # version's own alias-detection).
  exceptions:
    "keycloak-operator.operator.image": {sibling_field: "sha", writable: true}
    "keycloak-operator.operator.config.keycloakImage": {sibling_field: "sha", writable: true}
    "keycloak.image": {sibling_field: "sha", writable: true}
    "eck-operator.image": {sibling_field: "digest", writable: true}
    "omc.image": {}

release_table_verification:
  # basename -> the dotted values.yaml "...tag" path to read its version
  # from directly, for an image basenames_under_scope_any_tag can't find via
  # the normal scope_key-scoped scan because it lives nested inside a
  # DIFFERENT component's own subtree than its release-table row name.
  special_case_basename_tag_paths:
    "keycloak": "keycloak-operator.operator.config.keycloakImage.tag"

component_resolution:
  # Component names whose Chart.yaml dependency chart version and their
  # own resolved app image version are released as the SAME number (e.g.
  # kiss-chart, pabc: chart version == image tag observed today) -- never
  # assumed for a component that vendors a THIRD PARTY app at its own
  # independent version (keycloak-operator, eck-stack).
  chart_version_lockstep_components: ["kiss-chart", "pabc", "eck-operator"]
