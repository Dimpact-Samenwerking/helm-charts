# Dummy values for `helm lint`. All fields satisfy minLength/minItems constraints
# from the kiss subchart schema without providing real secrets or URLs.
#
# Also sets allowInsecureImages for rabbitmq: the opennotificaties chart bundles
# rabbitmq-16.0.12 whose Chart.yaml annotation still lists docker.io/bitnami/rabbitmq,
# but its own values.yaml defaults to bitnamilegacy/rabbitmq. This mismatch triggers a
# fail in the Bitnami image-check template; allowInsecureImages bypasses it for linting.
#
# Storage templates (templates/<chart>-storage.yaml) are guarded by separate
# `lookup` checks for the PV (cluster-scoped, name `<namespace>-<chart>`) and the
# PVC (namespaced, name from `<chart>.persistence.existingClaim`). In `helm lint`
# both lookups return empty (no cluster context), so both PV and PVC always render
# during lint. In a cluster-aware render (`helm template --dry-run=server` or
# `helm install --dry-run`), pre-existing PV+PVC names will be detected and the
# matching block is skipped — pre-creating both is enough to suppress storage
# template output during a smoke test.
#
# PVC names per chart come from <chart>.persistence.existingClaim in base
# values.yaml (e.g. openzaak / opennotificaties / objecten / openarchiefbeheer /
# openklant / openformulieren / openinwoner / referentielijsten / openbeheer).
# PV names are derived as `<Release.Namespace>-<chart>` and are not configurable.

zac:
  auth:
    secret: "placeholder"

# zgw-office-addin: the chart values.yaml provides the URL fields
# (common.frontendUrl, backend.zgwApis.url); only the MSAL/secret placeholders
