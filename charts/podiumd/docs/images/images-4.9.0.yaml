# Baseline: podiumd 4.8.2 (main @ 4184f87). Re-verify before release:
#   git diff 4184f87..HEAD -- charts/podiumd/Chart.yaml charts/podiumd/values.yaml
#
# Images new or changed in podiumd 4.9.0 vs 4.8.2.
#
# Changes:
#   1. ZAC (Zaakafhandelcomponent) 5.0.1 -> 5.1.0 (chart 1.0.251 -> 1.0.257).
#   2. ZGW Office Add-in v0.9.313 -> v0.9.352 (chart 0.0.89, unchanged).
#      Repository names (zgw-office-addin-{frontend,backend}) unchanged from 4.8.2.
#   3. ITA 3.2.0 -> 3.3.0 (chart internetaakafhandeling 3.2.0 -> 3.3.0), web and
#      poller. No new images, tag bumps only.
#   4. KISS 2.2.4 -> 3.0.0 (kiss-chart 2.2.4 -> 3.0.0), kiss-elastic-sync 0.3.3 ->
#      3.0.0. Enterprise Search is gone: the Elastic Open Crawler now runs as a
#      CronJob per site, and curl registers the search-website* index template in
#      a pre-install/pre-upgrade hook.
#      docker.elastic.co/integrations/crawler is NEW to the mirror and must be
#      imported before the 4.9.0 rollout, or Azure Policy blocks pod creation.
#      curlimages/curl:8.20.0 is already mirrored (see images-baseline.yaml) and
#      is listed here only because KISS starts using it in this release.
#   5. PABC 1.1.0 -> 1.1.1 (chart 1.1.0 -> 1.1.1), pabc-api and pabc-migrations.
#   6. PodiumD Adapter 0.6.6 -> 0.6.7 (chart 0.6.6 -> 0.6.7), podiumd-adapter.
#
# See docs/_UPGRADE_PATHS/4.8.2-to-4.9.0-upgrade.md for the operator upgrade notes.
