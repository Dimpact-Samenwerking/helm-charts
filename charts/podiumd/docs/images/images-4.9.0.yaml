# Baseline: podiumd 4.8.5 (main @ cc293f8). Re-verify before release:
#   git diff cc293f8..HEAD -- charts/podiumd/Chart.yaml charts/podiumd/values.yaml
#
# Images new or changed in podiumd 4.9.0 vs 4.8.5.
#
# Changes:
#   1. clamav - clamav_exporter v2.1.3 -> v2.1.8.
#   2. redis-operator - redis-exporter 1.82.0 -> 1.89.0.
#   3. redis-operator - redis 8.6.2 -> 8.6.6.
#   4. zac - gotenberg 8.34.0 -> 8.36.0.
#   5. zac - opa 1.17.1-static -> 1.19.1-static.
#   6. redis-operator - k8s 1.36.2 -> 1.36.2.
#   7. keycloak-operator - python 3.14-slim -> 3.14.7-slim.
#   8. keycloak-operator - postgres 16 -> 16.15.
#   9. ZAC (Zaakafhandelcomponent) 5.0.2 -> 5.4.4 (chart 1.0.297, unchanged —
#      the chart line was already bumped ahead of the image in the 4.8.5 hop).
#      ZAC's bundled sidecar images also bumped: opa 1.17.1-static ->
#      1.19.1-static, office_converter (gotenberg) 8.34.0 -> 8.36.0.
#   10. ZGW Office Add-in v0.9.313 -> 0.11.0 (chart 0.0.89, unchanged).
#      Repository names (zgw-office-addin-{frontend,backend}) unchanged from
#      4.8.5. Tag scheme dropped the "v" prefix from 0.10.0 onward.
#   11. ClamAV 1.5.2 -> 1.5.4 (chart clamav 3.7.1 -> 3.7.2).
#   12. Keycloak app image 26.6.4 -> 26.7.2 (keycloak-operator chart unchanged,
#      1.12.1 — no operator release yet supports 26.7.x).
#   13. ECK Operator 3.4.0 -> 3.5.0 (chart eck-operator 3.4.0 -> 3.5.0; image tag
#      floats on the chart's appVersion, no override in values.yaml). CRD schema
#      change verified additive-only — see
#      docs/_UPGRADE_PATHS/4.8.5-to-4.9.0-operators-crds.md.
#   14. ECK Stack (kiss-eck) chart 0.19.0 -> 0.20.0 (no image change of its own).
#   15. Kiss's ECK-managed Elasticsearch/Kibana/Enterprise Search 8.19.3 -> 8.19.19
#      (16-patch bump on the same 8.19.x branch, all three components in lockstep).
#   16. Python (ensurePodiumdAdminUser init image) 3.14-slim -> 3.14.7-slim —
#      now pinned to a specific patch instead of the floating minor tag.
#   17. ITA 3.2.0 -> 3.3.0 (chart internetaakafhandeling 3.2.0 -> 3.3.0), web and
#      poller. No new images, tag bumps only.
#   18. KISS 2.2.4 -> 3.0.0 (kiss-chart 2.2.4 -> 3.0.0), kiss-elastic-sync 0.3.3 ->
#      3.0.0. Enterprise Search is gone: the Elastic Open Crawler now runs as a
#      CronJob per site, and curl registers the search-website* index template in
#      a pre-install/pre-upgrade hook.
#      docker.elastic.co/integrations/crawler is NEW to the mirror and must be
#      imported before the 4.9.0 rollout, or Azure Policy blocks pod creation.
#      curlimages/curl:8.20.0 is already mirrored (see images-baseline.yaml) and
#      is listed here only because KISS starts using it in this release.
#   19. PABC 1.1.0 -> 1.1.1 (chart 1.1.0 -> 1.1.1), pabc-api and pabc-migrations.
#   20. PodiumD Adapter 0.6.6 -> 0.6.7 (chart 0.6.6 -> 0.6.7), podiumd-adapter.
#   21. Redis (redis-ha) 8.6.2 -> 8.6.6 (opstree/redis, chart unchanged). Same
#      8.6.x branch; picks up several upstream security fixes (RCE-class RESTORE/
#      Lua/TLS CVEs) fixed across 8.6.3/8.6.5/8.6.6.
#   22. redis-exporter 1.82.0 -> 1.89.0 (opstree/redis-exporter). Sidecar is
#      disabled by default (redisExporter.enabled: false).
#   23. redis-operator chart 0.25.0 -> 0.26.1, operator image 0.25.0 -> 0.26.0
#      (quay.io/opstree/redis-operator, both main and init-container image now
#      explicitly digest-pinned). CRD diff verified as zero (no schema change).
#   24. openformulieren 3.4.10 -> 3.5.6 (chart 1.12.0, unchanged).
#   25. openinwoner 2.4.2 -> 2.4.3 (chart 2.4.0, unchanged).
#   26. openzaak 1.27.4 -> 1.29.3 (chart 1.14.2, unchanged).
#   27. opennotificaties 1.16.1 -> 1.16.2 (chart 2.0.0, unchanged).
#   28. clamav_exporter (metrics sidecar) v2.1.3 -> v2.1.8 (clamav chart
#      unchanged). Sidecar disabled by default (clamav.metrics.enabled: false).
#   29. nginx-unprivileged (shared global.images.nginx anchor, used by every
#      nginx sidecar in the chart) 1.31.3 -> 1.31.4.
#
# See docs/_UPGRADE_PATHS/4.8.5-to-4.9.0-upgrade.md for the operator upgrade notes,
# and docs/_UPGRADE_PATHS/4.8.5-to-4.9.0-operators-crds.md for the ECK Operator
# CRD change.
#
