# Info images — variant of images-baseline.yaml with ZAC and ZGW Office
# Add-in updated ahead of images-baseline.yaml, filtered to only the images
# actually referenced (repository/tag/digest/version) in
# charts/podiumd/values.yaml.
#
# Differences from images-baseline.yaml:
#   * infonl/zaakafhandelcomponent: updated to 5.6.0 (chart 1.0.301) instead
#     of the 5.1.0 / 5.0.2 entries in images-baseline.yaml.
#   * infonl/zgw-office-addin-backend / -frontend: updated to 0.11.0 (chart
#     0.0.91) instead of the v0.9.352 / v0.9.313 entries in
#     images-baseline.yaml.
#   * Entries with no matching reference in charts/podiumd/values.yaml, or
#     whose version doesn't match what values.yaml actually pins, are
#     dropped — e.g. azure-cli and brp-api/personen-mock (component not
#     configured at all), elastic/eck-operator (enabled but no image
#     override anywhere), the stale keycloak/keycloak(-operator) 26.6.3
#     entries (values.yaml pins 26.6.4), and superseded duplicate-version
#     entries (e.g. nginx 1.27-alpine/1.31.1, curl 8.20.0, redis-operator
#     v0.24.0) where values.yaml pins a newer version already listed below.
#
# Same strip-registry mirror convention as images-baseline.yaml:
#   name = strip_registry(url): upstream url with the registry host removed,
#   full <namespace>/<repo> path kept.
# Versions are the tags pinned in charts/podiumd/values.yaml (or the owning
# subchart). Digests are resolved live against the source registry
# (Docker-Content-Digest / manifest_digest).

