# NOT INCLUDED — need a separate decision, do not add blind:
#   * bitnami/rabbitmq (+ bitnami/os-shell): opennotificaties 1.13.1 still enables
#     rabbitmq (tags.rabbitmq: true), but Bitnami relocated its images off
#     docker.io/bitnami in Aug 2025 — tag 4.1.3-debian-12-r0 now 404s on the old
#     path. Mirror source must be re-pointed (bitnamilegacy / bitnami secure) or
#     opennotificaties moved to the redis broker before this can be pinned.
#   * library/alpine: NOT a real image. The kiss `alpine.image` block in the
#     gemeente values was dead config — no chart/subchart template ever reads
#     .Values.kiss.alpine.image, so it was never pulled (removed from all envs).
#     The real alpine image is alpine/k8s (redis-ha label-master + pre-delete
#     jobs), already pinned (1.36.2) and present in the manifest above.
