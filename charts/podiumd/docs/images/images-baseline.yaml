# Baseline images — the single, complete strip-registry mirror manifest.
#
# This is a full, CURRENT snapshot of every image PodiumD pulls right now —
# every component's own primary image, every sidecar, every MULTIPLE/global-
# anchored shared image — under the strip-registry mirror convention:
#   name = strip_registry(url): upstream url with the registry host removed,
#   full <namespace>/<repo> path kept.
# Versions are the tags currently pinned in charts/podiumd/values.yaml (or the
# owning subchart). Digests are the tag's own embedded "@sha256:..." suffix
# when it has one, else resolved live against the source registry
# (Docker-Content-Digest / manifest_digest).
#
# Fully regenerated by fix-doc-consistency, update-component-version and
# update-image-version on every run (lib.image.docs.
# regenerate_images_baseline_manifest) — always a complete, wholesale
# snapshot, never incremental patching: no hand-maintained gap-fillers, no
# "NOT INCLUDED" exclusion notes, no stale dual-version entries. Editing this
# file by hand is pointless — the next run overwrites it entirely.

