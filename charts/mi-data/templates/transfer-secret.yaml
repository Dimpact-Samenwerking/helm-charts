{{- /*
  Secrets for the MI export transfer egress, rendered from transfer.* values.

  Renders whenever enabled is true. The chart owns these Secrets — nothing
  is pre-provisioned in the namespace:

    1. `<transfer.secretName>`     — connection envvars: the SFTP_* family in
                                     the sftp modes, the FTP_* family in ftp
                                     mode. The unused family is rendered with
                                     empty values (see below).
    2. `<transfer.keySecretName>`  — the SSH private key (`id`); sftp-key mode only

  transfer.mode selects exactly one of sftp-password / sftp-key / ftp; the
  CronJob template guards enforce mode/credential consistency. The deploy
  pipeline (dev.azure.com/ssctwente/ExternalsPodiumD `application.yml`)
  substitutes the credential from Azure Key Vault into the env values file at
  deploy time, so it is never stored in git. SFTP host-key checking is
  disabled on the egress, so no known_hosts is rendered or needed.

  Every key of both families is rendered unconditionally: helm's three-way
  patch cannot remove stringData keys from the live Secret (they live under
  `data`), so a mode switch would otherwise leave stale keys behind — and
  dump.sh dispatches on FTP_HOST being non-empty, then on SFTP_PASSWORD for
  the sftp auth flavour. Writing "" explicitly overwrites the stale keys.
*/}}
{{- if .Values.enabled }}
{{- $tr := .Values.transfer }}
{{- $mode := $tr.mode | default "" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tr.secretName | quote }}
  labels:
    {{- include "mi-data.labels" . | nindent 4 }}
    app.kubernetes.io/component: mi-export
type: Opaque
stringData:
{{- if eq $mode "ftp" }}
  FTP_HOST: {{ $tr.host | quote }}
  FTP_PORT: {{ $tr.port | default 21 | quote }}
  FTP_USER: {{ $tr.user | quote }}
  FTP_PASSWORD: {{ $tr.password | quote }}
  FTP_REMOTE_PATH: {{ $tr.remotePath | quote }}
  FTP_FTPS: {{ $tr.ftps | default false | quote }}
  SFTP_HOST: ""
  SFTP_PORT: ""
  SFTP_USER: ""
  SFTP_REMOTE_PATH: ""
  SFTP_PASSWORD: ""
{{- else }}
  SFTP_HOST: {{ $tr.host | quote }}
  SFTP_PORT: {{ $tr.port | default 22 | quote }}
  SFTP_USER: {{ $tr.user | quote }}
  SFTP_REMOTE_PATH: {{ $tr.remotePath | quote }}
  SFTP_PASSWORD: {{ eq $mode "sftp-password" | ternary $tr.password "" | quote }}
  FTP_HOST: ""
  FTP_PORT: ""
  FTP_USER: ""
  FTP_PASSWORD: ""
  FTP_REMOTE_PATH: ""
  FTP_FTPS: ""
{{- end }}
{{- if eq $mode "sftp-key" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tr.keySecretName | quote }}
  labels:
    {{- include "mi-data.labels" . | nindent 4 }}
    app.kubernetes.io/component: mi-export
type: Opaque
stringData:
  id: |
    {{- $tr.privateKey | nindent 4 }}
{{- end }}
{{- end }}
