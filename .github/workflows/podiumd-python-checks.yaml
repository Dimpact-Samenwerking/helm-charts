name: PodiumD Python checks

on:
  push:
    paths:
      - 'charts/podiumd/bin/**'
      # tests/migrate-scripts/ tests the migrate scripts there.
      - 'charts/podiumd/scripts/**'
      # tests/migrate-scripts/ also runs the create-required-objecttypen Job's script.
      - 'charts/podiumd/templates/create-required-objecttypen.yaml'
      - 'charts/podiumd/files/objecttypen/**'
      - '.github/workflows/podiumd-python-checks.yaml'
  # Every PR, so the check can be required: a workflow skipped by `paths`
  # leaves a required check waiting; a job skipped by `if` counts as passed.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Detect script changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            code:
              - 'charts/podiumd/bin/**'
              # tests/migrate-scripts/ tests the migrate scripts there.
              - 'charts/podiumd/scripts/**'
              # tests/migrate-scripts/ also runs the create-required-objecttypen Job's script.
              - 'charts/podiumd/templates/create-required-objecttypen.yaml'
              - 'charts/podiumd/files/objecttypen/**'
              - '.github/workflows/podiumd-python-checks.yaml'

  run-python-checks:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Tests read release tags and baselines from the git history.
          fetch-depth: 0

      # Tests create commits in scratch repositories.
      - name: Configure Git
        run: |
          git config --global user.name "$GITHUB_ACTOR"
          git config --global user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: charts/podiumd/bin/requirements.txt

      # run_python_checks installs and upgrades the tools itself.
      - name: run_python_checks
        run: charts/podiumd/bin/run_python_checks
