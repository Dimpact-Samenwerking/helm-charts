name: PodiumD checks

on:
  # Every PR, so the checks can be required: a workflow skipped by `paths`
  # leaves a required check waiting; a job skipped by `if` counts as passed.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# An explicit bash runs with -o pipefail, so `check | tee` fails with the check.
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: v4.3.2
  HELM_DOCS_VERSION: 1.14.2
  KUBECONFORM_VERSION: v0.8.0
  KUBE_SCORE_VERSION: 1.20.0
  # The chart job skips exactly these, so the two jobs together run every
  # step except the CVE and upgrade steps.
  DOC_STEPS: release-baseline,helm-doc,markdown,upgrade-doc-layout,doc-consistency
  # The CVE steps can take more than an hour; they stay a manual gate before
  # a release (/verify-podiumd without skips).
  CVE_STEPS: cve-scan,cve-diff
  # Report available upgrades and never fail; nothing for a PR to act on.
  UPGRADE_STEPS: chart-upgrades,image-upgrades

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      chart: ${{ steps.filter.outputs.chart }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - name: Detect changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          # Docs never change the rendered chart; the docs job still runs on
          # chart changes, as its checks compare the docs with values.yaml.
          filters: |
            docs:
              - 'charts/podiumd/**'
              - '.github/workflows/podiumd-checks.yaml'
            chart:
              - 'charts/podiumd/**'
              - '.github/workflows/podiumd-checks.yaml'
              - '!charts/podiumd/docs/**'
              - '!charts/podiumd/**/*.md'
              - '!charts/podiumd/etc/release-baseline.yaml'
            python:
              - 'charts/podiumd/bin/**'
              # tests/migrate-scripts/ tests the migrate scripts there.
              - 'charts/podiumd/scripts/**'
              # tests/migrate-scripts/ also runs the create-required-objecttypen Job's script.
              - 'charts/podiumd/templates/create-required-objecttypen.yaml'
              - 'charts/podiumd/files/objecttypen/**'
              - '.github/workflows/podiumd-checks.yaml'

  docs:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Release baseline and doc consistency resolve podiumd-<version> tags.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: charts/podiumd/bin/requirements.txt

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install tools
        run: |
          python3 -m pip install --quiet --disable-pip-version-check -r charts/podiumd/bin/requirements.txt
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" helm-docs
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: verify-podiumd (docs)
        run: python3 charts/podiumd/bin/verify-podiumd --include="$DOC_STEPS" 2>&1 | tee "$RUNNER_TEMP/check.log"

      # The VERIFY SUMMARY block, for the job summary and the PR comment.
      - name: Summary
        if: always()
        run: |
          sed -n '/=== VERIFY SUMMARY ===/,$p' "$RUNNER_TEMP/check.log" > summary.txt 2>/dev/null || true
          { echo '```text'; cat summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: summary-docs
          path: summary.txt
          retention-days: 5

  chart:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: charts/podiumd/bin/requirements.txt

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install tools
        run: |
          python3 -m pip install --quiet --disable-pip-version-check -r charts/podiumd/bin/requirements.txt yamllint
          sudo apt-get install -y --no-install-recommends shellcheck
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" kubeconform
          curl -fsSL "https://github.com/zegl/kube-score/releases/download/v${KUBE_SCORE_VERSION}/kube-score_${KUBE_SCORE_VERSION}_linux_amd64" \
            -o "$RUNNER_TEMP/bin/kube-score"
          chmod +x "$RUNNER_TEMP/bin/kube-score"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: verify-podiumd (chart)
        run: python3 charts/podiumd/bin/verify-podiumd --skip="$DOC_STEPS,$CVE_STEPS,$UPGRADE_STEPS" 2>&1 | tee "$RUNNER_TEMP/check.log"

      # lint-values.yaml renders all three Frank!Gateway classes; this overlay
      # renders the opposite corner (one class, no dashboard, no policies).
      # verify-podiumd vendored the dependencies.
      - name: Render Frank!Gateway single-class shape
        if: success() || failure()
        run: |
          helm template podiumd charts/podiumd --namespace podiumd \
            -f charts/podiumd/ci/lint-values.yaml \
            -f charts/podiumd/ci/frankgateway-single-class-values.yaml \
            --skip-schema-validation > /dev/null 2> "$RUNNER_TEMP/render.err" \
            && echo '  Single-class render       : PASS' >> "$RUNNER_TEMP/check.log" \
            || { cat "$RUNNER_TEMP/render.err"; echo '  Single-class render       : FAIL (see the job log)' >> "$RUNNER_TEMP/check.log"; exit 1; }

      - name: Summary
        if: always()
        run: |
          sed -n '/=== VERIFY SUMMARY ===/,$p' "$RUNNER_TEMP/check.log" > summary.txt 2>/dev/null || true
          { echo '```text'; cat summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: summary-chart
          path: summary.txt
          retention-days: 5

  python:
    name: run-python-checks
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Tests read release tags and baselines from the git history.
          fetch-depth: 0

      # Tests create commits in scratch repositories.
      - name: Configure Git
        run: |
          git config --global user.name "$GITHUB_ACTOR"
          git config --global user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: charts/podiumd/bin/requirements.txt

      # run_python_checks installs and upgrades the tools itself.
      - name: run_python_checks
        run: charts/podiumd/bin/run_python_checks 2>&1 | tee "$RUNNER_TEMP/check.log"

      # One "=== <step> (<time>, ok|FAILED) ===" line per step, and the result.
      - name: Summary
        if: always()
        run: |
          grep -E '^=== .*(\(|passed|FAILED)' "$RUNNER_TEMP/check.log" > summary.txt 2>/dev/null || true
          { echo '```text'; cat summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: summary-python
          path: summary.txt
          retention-days: 5

  # One PR comment with the outcome of every check, updated on each run. Not
  # for PRs from forks: their token cannot write comments.
  report:
    needs: [changes, docs, chart, python]
    if: >-
      always() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download summaries
        uses: actions/download-artifact@v8
        with:
          pattern: summary-*
          path: summaries

      - name: Comment on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DOCS: ${{ needs.docs.result }}
          CHART: ${{ needs.chart.result }}
          PYTHON: ${{ needs.python.result }}
        run: |
          marker='<!-- podiumd-checks -->'
          result() {
            case "$1" in
              success) echo '✅ pass' ;;
              failure) echo '❌ fail' ;;
              skipped) echo '⏭️ skipped: no matching changes' ;;
              cancelled) echo '⚪ cancelled' ;;
              *) echo "$1" ;;
            esac
          }
          {
            echo "$marker"
            echo '## PodiumD checks'
            echo
            echo "Commit \`${SHA:0:8}\`, [workflow run]($RUN_URL)."
            echo
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo "| \`docs\` | $(result "$DOCS") |"
            echo "| \`chart\` | $(result "$CHART") |"
            echo "| \`run-python-checks\` | $(result "$PYTHON") |"
            for job in docs chart python; do
              file="summaries/summary-$job/summary.txt"
              [ -s "$file" ] || continue
              check=$job
              [ "$job" = python ] && check=run-python-checks
              # Failed steps first, the full summary folded below them.
              failed=$(grep -E ': FAIL|FAILED' "$file" || true)
              echo
              echo "### \`$check\`"
              if [ -n "$failed" ]; then
                echo
                echo '```text'
                echo "$failed"
                echo '```'
              fi
              echo
              echo '<details><summary>Summary</summary>'
              echo
              echo '```text'
              cat "$file"
              echo '```'
              echo
              echo '</details>'
            done
          } > body.md
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@body.md > /dev/null
          fi
