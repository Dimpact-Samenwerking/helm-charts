name: PodiumD verify

on:
  pull_request:
    paths:
      - 'charts/podiumd/**'
      - '.github/workflows/podiumd-verify.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: v4.3.2
  HELM_DOCS_VERSION: 1.14.2
  KUBECONFORM_VERSION: v0.8.0
  KUBE_SCORE_VERSION: 1.20.0

jobs:
  verify-podiumd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Release baseline and doc consistency resolve podiumd-<version> tags.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: charts/podiumd/bin/requirements.txt

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install tools
        run: |
          python3 -m pip install --quiet --disable-pip-version-check -r charts/podiumd/bin/requirements.txt yamllint
          sudo apt-get install -y --no-install-recommends shellcheck
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" helm-docs
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" kubeconform
          curl -fsSL "https://github.com/zegl/kube-score/releases/download/v${KUBE_SCORE_VERSION}/kube-score_${KUBE_SCORE_VERSION}_linux_amd64" \
            -o "$RUNNER_TEMP/bin/kube-score"
          chmod +x "$RUNNER_TEMP/bin/kube-score"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The CVE steps can take more than an hour; they stay a manual gate
      # before a release (/verify-podiumd without skips).
      - name: verify-podiumd
        run: python3 charts/podiumd/bin/verify-podiumd --skip=cve-scan,cve-diff
